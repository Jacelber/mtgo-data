schema_version: "1.0"
program_id: "GOVERNANCE-EFFICIENCY-20260815"
objective: "Reduce development governance and validation time while protecting the published output."
program_status: "blocked_pending_gov10b_pages_recovery_subject_fix"
closure_condition: "Bind recovery to its immutable master dispatch subject, accept only an ancestor production commit whose generated output still matches that subject, then complete one authorized recovery deployment with existing production evidence."
owner_principles:
  - "Do not test unless a named risk requires it; use the smallest check that can answer that question."
  - "Do not repeat evidence already obtained for the same immutable subject."
  - "Protect the publishable artifact at its single output gate; master is not the product."
  - "Undeclared or mismatched file operations stop instead of triggering a catch-all test suite."
  - "Owner browser acceptance is final UI evidence; do not repeat it after acceptance."
program_rules:
  one_active_task: true
  later_tasks_require_separate_authorization: true
  completion_record: "Move task detail to docs/history; retain one summary line here."
  owner_acceptance_authorizes_same_task_completion: true
  publication_gates_separate: false

tasks:
  - id: "GOV-06-OUTPUT-GATED-VALIDATION-CUTOVER"
    name: "Cut PR waiting and guard generated output"
    status: "completed_merged_and_deployed"
    authorization:
      local_implementation: true
      commit: true
      push: true
      pull_request: true
      merge: true
      applicable_publication_or_production: true
    problem: "Nearly every PR pays for full pytest, committed byte baselines, and Playwright even when those checks cannot answer a change-specific question."
    solution: "Classify known paths and exact predeclared file operations into minimal check categories, stop mismatches immediately, remove full/baseline/Playwright jobs from PR CI, and add value-independent invariants to the production build before packaging."
    effect: "Known PRs run only relevant minute-scale checks; malformed or unknown evidence fails quickly; inconsistent generated MTGO output cannot reach publish."
    acceptance:
      - "No PR path runs committed_baseline, full pytest, or Playwright."
      - "Known paths map deterministically to docs, ui, code, data, and/or governance."
      - "Known-path additions classify automatically; exact predeclared unknown additions, deletions, and renames run only their category."
      - "Undeclared, mismatched, stale, missing, or unavailable evidence produces unclassified and no catch-all tests."
      - "Production build validates range totals/shares and matchup conservation/symmetry/confidence intervals before consumer smoke and packaging."
      - "Exact merge confirmation accepts only the exact successful targeted job matrix."
    completion: "Published through PR 212 and merge commit fa347998696deddd63b54e8bad7d014dad71d8b5; detailed evidence is in the GOV-06 audit and GitHub."

  - id: "GOV-07-SNAPSHOT-RETIREMENT"
    name: "Retire byte-level snapshot tax"
    status: "completed_merged_and_deployed"
    depends_on: ["GOV-06-OUTPUT-GATED-VALIDATION-CUTOVER"]
    authorization:
      local_implementation: true
      commit: true
      push: true
      pull_request: true
      merge: true
      applicable_publication_or_production: true
    problem: "Committed baselines report every legitimate byte change as the same red signal as a defect and require manual regeneration."
    solution: "Classify recent baseline failures, retain the one unique semantic contract, remove eleven rolling-output snapshot nodes, retire the committed_baseline marker and timing group, and remove completed oversized R4 shadow-review tests from active discovery."
    effect: "Legitimate output evolution no longer creates baseline maintenance work."
    acceptance:
      - "No configured or decorated committed_baseline marker remains."
      - "The value-independent report accounting and subtype contract remains active."
      - "No active rolling MTGO report, statistics, matchup, Top 8, completeness, Pickup, or whole-product test compares regenerated bytes with committed rolling output."
      - "The R4 Modern and Standard dispositions, tools, audit artifacts, and frozen inputs remain, but their oversized historical inline tests are absent from discovery."
      - "Dynamic production candidate comparison, output invariants, Schemas, consumers, and protected Melee compatibility remain unchanged."
      - "Only the minimal static, collection, workflow-contract, Ruff, and retained semantic checks run locally once."
    evidence: "docs/audits/GOV-07-SNAPSHOT-RETIREMENT.md"
    completion: "Published through PR 213 and merge commit 78af1e59f6e7cb32309420c45d59a60d4b98c2e1."

  - id: "GOV-08-MINIMAL-TESTSET-REBUILD"
    name: "Rebuild the retained test set from zero"
    status: "completed_merged_and_deployed"
    depends_on: ["GOV-07-SNAPSHOT-RETIREMENT"]
    problem: "The ordinary suite accumulated tests without a current purpose/trigger inventory."
    solution: "Retain only schema, output/privacy invariants, and one tiny fixture smoke per supported CLI; document each trigger and remove duplicate coverage."
    effect: "Every retained test has one named risk and the smallest fixture that proves it."
    acceptance:
      - "No workflow invokes unbounded pytest."
      - "The retained Python inventory contains only six files: three CLI smoke nodes, output/privacy contracts, and focused docs/governance controls."
      - "MTGO and Melee pre-fetch jobs run only their own explicit minimum nodes and finish test execution within 60 seconds, excluding dependency installation."
      - "Schema, candidate-boundary, output-invariant, consumer, and generated-page checks remain at the publication output gate."
      - "All 91 Python test deletions and three additions were declared by exact path before the file operations."
      - "Fixtures and JavaScript/browser tests remain unchanged for later authorized tasks."
    evidence: "docs/audits/GOV-08-MINIMAL-TESTSET-REBUILD.md"
    completion: "Published through PR 214 and merge commit eb0eb7eb4226878430581b8968f24a60079a482e."

  - id: "GOV-08A-GITHUB-AUTH-SINGLE-ENTRYPOINT"
    name: "Make repository preflight the only GitHub credential verdict"
    status: "completed_merged_and_deployed"
    depends_on: ["GOV-08-MINIMAL-TESTSET-REBUILD"]
    problem: "A restricted-context bare gh auth result could still be misreported as an invalid token despite the documented publication method."
    solution: "Route every credential verdict through one repository script with machine-readable states and require the actual publication context before it can inspect gh."
    effect: "Restricted credential access causes an automatic context retry instead of an unnecessary Owner login request."
    acceptance:
      - "AGENTS.md names the preflight script as the only credential-verdict entry point."
      - "A call without ActualPublicationContext returns RETRY_ACTUAL_CONTEXT without invoking gh."
      - "The actual publication context returns READY only for Jacelber with repository push permission and any required workflow scope."
      - "Only AUTH_REJECTED permits an Owner login request; permission and network failures keep their own states."
      - "No GitHub workflow, product, data, statistical, UI, Schema, or public-path behavior changes."
    completion: "Published through PR 215 and merge commit ddf10e30d890379a288c52b1ade9837e15bf95c5."

  - id: "GOV-09-UI-ACCEPTANCE-CONTRACT"
    name: "Make owner browser review the UI acceptance record"
    status: "completed_merged_and_deployed"
    depends_on: ["GOV-06-OUTPUT-GATED-VALIDATION-CUTOVER"]
    problem: "Automated browser reruns duplicate detailed owner review and previously missed real mobile navigation defects."
    solution: "Run only the path-relevant matchup-model or runtime Node check before review, make Owner browser review final, bind the PR to the reviewed user-visible blob digest, retire nine high-maintenance browser/preflight files, and keep exactly two rendering smokes at the publication output gate."
    effect: "UI work is checked where defects are visible without paying for duplicate post-review automation."
    acceptance:
      - "PR CI never runs Node or Playwright UI tests after Owner acceptance; it only verifies the accepted digest and repository references."
      - "The digest covers changed index.html, assets/**, and melee/** blobs but ignores status, test, package, and governance files."
      - "Missing, duplicate, stale, or irrelevant UI acceptance markers stop immediately without a fallback suite."
      - "The retained matchup-model and runtime Node checks run only for their named logic changes, once before Owner review."
      - "Exactly nine declared browser/preflight files are removed and no file is added or renamed."
      - "The output gate retains exactly one MTGO and one Melee real-number rendering smoke."
    completion: "Published through PR 216 and merge commit 3ff9549e8fab9776f7a150ebf0cee6a6db85edd4."

  - id: "GOV-10-PRODUCTION-EVIDENCE-REUSE"
    name: "Stop retesting validated production commits"
    status: "completed_merged_operational_followup_required"
    depends_on: ["GOV-06-OUTPUT-GATED-VALIDATION-CUTOVER", "GOV-08-MINIMAL-TESTSET-REBUILD"]
    problem: "Scheduled build, bot push CI, and Pages can repeat evidence for the same generated subject."
    solution: "Hash the post-fetch generation subject, skip every downstream test and publication stage when it is unchanged, bind a changed subject's validated artifact to its producer run and generated commit, path-filter ordinary Pages pushes, and perform only exact evidence admission plus three availability requests downstream."
    effect: "One candidate is validated once before publication; downstream stages reuse that evidence."
    acceptance:
      - "An unchanged generation-subject digest skips baseline smoke, build, candidate validation, packaging, publication, and Pages."
      - "A changed candidate records one generation-subject digest and one validated-output digest and carries them unchanged through publication."
      - "The generated commit uniquely records producer run, attempt, source commit, generation subject, and validated output."
      - "Production Pages admission verifies exact commit ancestry, trailers, producer jobs, artifact digest, and published bytes without rerunning candidate tests."
      - "Governance, tests, and other non-site master changes do not trigger Pages."
      - "Post-deploy confirmation requests only index.html, melee/index.html, and stats/catalog.json with bounded retry."
      - "Manual or recovery dispatch with no production evidence remains distinct; partial evidence fails closed."
    completion: "Published through PR 217 and merge commit bdf40432ab474effcc43e92f93ca17cb86f9aa0c; merge confirmation and Pages deployment succeeded."
    operational_followup: "Scheduled run 31906796791 validated and published candidate 77508f1b450373ca471a6f0b03ecd9724937476f once, but Pages run 31907814499 falsely rejected identical file contents because the tar digest included six discovery.json permission changes from 0600 to Git-checkout 0644."

  - id: "GOV-10A-PAGES-CONTENT-EVIDENCE-CANONICALIZATION"
    name: "Compare published output content without Git-irrelevant permissions"
    status: "completed_merged_operational_followup_failed"
    depends_on: ["GOV-10-PRODUCTION-EVIDENCE-REUSE"]
    problem: "Pages recompresses the published tree and compares the resulting tar bytes to the validated artifact, so ordinary permissions not preserved by Git cause a false rejection."
    solution: "Keep immutable artifact, path-boundary, provenance, and exact-production-evidence checks; extract the validated artifact and compare only the allowed paths and file contents against the checked-out publication commit."
    effect: "Identical published content deploys despite ordinary permission normalization, while a missing, extra, or changed output file still blocks Pages without rerunning candidate validation."
    acceptance:
      - "The immutable validated-output artifact SHA and generation-subject SHA remain checked before content comparison."
      - "Pages compares data/, stats/, reports/, and fetched.txt with recursive path-and-content comparison and never regenerates published-output.tar."
      - "The existing workflow-contract test states the new content comparison and rejects the retired tar-byte comparison."
      - "A separately authorized recovery dispatch may reuse producer run 31906796791 and its immutable artifact; it must not regenerate or revalidate the candidate."
    completion: "Published through PR 220 and merge commit b6f572f9da6e78dfe4a6d956b61cd95c6dd4b93a; targeted and exact-merge CI passed."
    operational_followup: "Recovery run 31923585217 proved the content comparison but executed the historical publication commit's old verifier, which still required that publication commit to equal the live master head."

  - id: "GOV-10B-PAGES-RECOVERY-SUBJECT-BINDING"
    name: "Bind production recovery to the immutable Pages subject"
    status: "owner_accepted_same_task_completion_authorized"
    depends_on: ["GOV-10A-PAGES-CONTENT-EVIDENCE-CANONICALIZATION"]
    problem: "A recovery dispatch checks out the historical publication commit before admission, so it executes stale control-plane code; the old verifier also rejects valid history whenever master advances."
    solution: "Check out the immutable master dispatch SHA, require complete production evidence only on a master workflow dispatch, prove the publication commit is an ancestor of that SHA, and compare the validated generated output with that current subject."
    effect: "Recovery uses current trusted controls and site code without retesting the candidate or rolling back later UI, while diverged commits or changed generated output still fail closed."
    acceptance:
      - "A complete production-evidence dispatch is accepted only for workflow_dispatch on refs/heads/master."
      - "Pages checks out github.sha rather than the historical publication commit, and admission receives that same immutable Pages subject SHA."
      - "The publication commit must be identical to or an ancestor of the Pages subject; a diverged history fails."
      - "The validated artifact must still match data/, stats/, reports/, and fetched.txt in the Pages subject before packaging."
      - "No candidate, Schema, invariant, browser, generator, or production-data test is repeated."
      - "One accepted recovery dispatch reuses producer run 31906796791 and requests only the three post-deploy availability resources."

  - id: "GOV-11-LIVE-DOCUMENT-SLIMMING"
    name: "Keep live governance documents small"
    status: "completed_merged"
    depends_on: ["GOV-06-OUTPUT-GATED-VALIDATION-CUTOVER"]
    problem: "ROADMAP and mandatory reading contain completed history that consumes time and context every task."
    solution: "Move completed detail to docs/history, keep current/future objectives and acceptance only, and require the same archive step at every completion."
    effect: "Agents read only current state and relevant future work; ROADMAP no longer grows without bound."
    acceptance:
      - "The live roadmap contains no completed Phase 0-11 or P12-01 through P12-09 detail."
      - "Archived roadmap text remains available under docs/history and is explicitly non-authoritative."
      - "STATUS contains only live state and remains below the enforced size ceiling."
      - "AGENTS contains every-task steps and conditional pointers without completed-task sediment."
      - "Repository reference validation derives its durable document, catalog, event, and public-entry facts without retired STATUS caches."
      - "Every future completion moves detailed completed roadmap material to history in the same accepted task."
      - "No product, statistics, Schema, data, UI, workflow, public-path, production, or event behavior changes."
      - "Only the focused live-document contract runs locally once; PR CI owns its one independent reference check."
    completion: "Published through PR 218 and merge commit de6ca64a4d2f34b0f24f983bf11e881bf3a7181a; merge confirmation succeeded and the excluded-path change did not trigger Pages."

  - id: "GOV-12-OPERATIONS-AND-PRIVACY-CLOSEOUT"
    name: "Document Melee HMAC recovery and production failure response"
    status: "completed_merged"
    depends_on: ["GOV-08-MINIMAL-TESTSET-REBUILD"]
    problem: "Melee HMAC recovery rules and the repository's existing production failure controls are scattered, while the original suppression proposal would broaden the task before a real removal or v3-production trigger exists."
    solution: "Document Melee-only key loss and rotation boundaries, add one short operator runbook for existing MTGO, Pages, and Melee failure paths, and defer secret provisioning and removal suppression to separately triggered work."
    effect: "Operators receive a usable recovery entry point without changing executable behavior, adding a repository-wide scan, provisioning a secret, or increasing the test set."
    acceptance:
      - "A completed Melee v3 snapshot remains usable downstream without the HMAC key; an incomplete checkpoint resumes only with the original key material and key ID."
      - "Lost-key and rotation instructions prohibit joining snapshots or reusing one key ID for different key material."
      - "The runbook identifies the observable evidence and safe stop or retry boundary for MTGO baseline, fetch, build, publish, Pages, and Melee candidate failures."
      - "The documentation states that no production HMAC key is currently provisioned and records the separate Melee v3 preflight required before the first live test event."
      - "No suppression list, participant-string scan, code, test, Schema, configuration, workflow, data, UI, public-path, statistical, secret, production, or deployment change is made."
      - "No local automated test runs; the final targeted PR CI owns one existing documentation contract and repository-reference validation."
    completion: "Published through PR 219 and merge commit 9b80490651d605aad99d1fec41e8b6b5541eaeca; exact master confirmation succeeded and Pages did not run."

  - id: "GOV-13-BOUNDED-MAINTENANCE-AUTHORITY"
    name: "Avoid a full authorization cycle for routine maintenance"
    status: "cancelled_not_needed"
    depends_on: ["GOV-11-LIVE-DOCUMENT-SLIMMING"]
    problem: "Routine dependency and CI maintenance repeatedly pays the same governance setup cost."
    solution: "Do not add standing local authority; retain per-task local authorization and use the existing Owner-acceptance continuation rule for commit, Ready PR, CI, merge, and applicable same-task completion."
    effect: "The duplicate authorization cycle is avoided without creating an open-ended maintenance permission."
    closure: "Cancelled by the Owner on 2026-08-16 as unnecessary after the acceptance-continuation rule was adopted."
