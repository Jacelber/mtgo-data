schema_version: "1.0"
program_id: "GOVERNANCE-EFFICIENCY-20260815"
objective: "Reduce development governance and validation time while protecting the published output."
owner_principles:
  - "Do not test unless a named risk requires it; use the smallest check that can answer that question."
  - "Do not repeat evidence already obtained for the same immutable subject."
  - "Protect the publishable artifact at its single output gate; master is not the product."
  - "Undeclared or mismatched file operations stop instead of triggering a catch-all test suite."
  - "Owner browser acceptance is final UI evidence; do not repeat it after acceptance."
program_rules:
  one_active_task: true
  later_tasks_require_separate_authorization: true
  completion_record: "Move task detail to docs/history; retain one summary line here."
  owner_acceptance_authorizes_same_task_completion: true
  publication_gates_separate: false

tasks:
  - id: "GOV-06-OUTPUT-GATED-VALIDATION-CUTOVER"
    name: "Cut PR waiting and guard generated output"
    status: "completed_merged_and_deployed"
    authorization:
      local_implementation: true
      commit: true
      push: true
      pull_request: true
      merge: true
      applicable_publication_or_production: true
    problem: "Nearly every PR pays for full pytest, committed byte baselines, and Playwright even when those checks cannot answer a change-specific question."
    solution: "Classify known paths and exact predeclared file operations into minimal check categories, stop mismatches immediately, remove full/baseline/Playwright jobs from PR CI, and add value-independent invariants to the production build before packaging."
    effect: "Known PRs run only relevant minute-scale checks; malformed or unknown evidence fails quickly; inconsistent generated MTGO output cannot reach publish."
    acceptance:
      - "No PR path runs committed_baseline, full pytest, or Playwright."
      - "Known paths map deterministically to docs, ui, code, data, and/or governance."
      - "Known-path additions classify automatically; exact predeclared unknown additions, deletions, and renames run only their category."
      - "Undeclared, mismatched, stale, missing, or unavailable evidence produces unclassified and no catch-all tests."
      - "Production build validates range totals/shares and matchup conservation/symmetry/confidence intervals before consumer smoke and packaging."
      - "Exact merge confirmation accepts only the exact successful targeted job matrix."
    completion: "Published through PR 212 and merge commit fa347998696deddd63b54e8bad7d014dad71d8b5; detailed evidence is in the GOV-06 audit and GitHub."

  - id: "GOV-07-SNAPSHOT-RETIREMENT"
    name: "Retire byte-level snapshot tax"
    status: "completed_merged_and_deployed"
    depends_on: ["GOV-06-OUTPUT-GATED-VALIDATION-CUTOVER"]
    authorization:
      local_implementation: true
      commit: true
      push: true
      pull_request: true
      merge: true
      applicable_publication_or_production: true
    problem: "Committed baselines report every legitimate byte change as the same red signal as a defect and require manual regeneration."
    solution: "Classify recent baseline failures, retain the one unique semantic contract, remove eleven rolling-output snapshot nodes, retire the committed_baseline marker and timing group, and remove completed oversized R4 shadow-review tests from active discovery."
    effect: "Legitimate output evolution no longer creates baseline maintenance work."
    acceptance:
      - "No configured or decorated committed_baseline marker remains."
      - "The value-independent report accounting and subtype contract remains active."
      - "No active rolling MTGO report, statistics, matchup, Top 8, completeness, Pickup, or whole-product test compares regenerated bytes with committed rolling output."
      - "The R4 Modern and Standard dispositions, tools, audit artifacts, and frozen inputs remain, but their oversized historical inline tests are absent from discovery."
      - "Dynamic production candidate comparison, output invariants, Schemas, consumers, and protected Melee compatibility remain unchanged."
      - "Only the minimal static, collection, workflow-contract, Ruff, and retained semantic checks run locally once."
    evidence: "docs/audits/GOV-07-SNAPSHOT-RETIREMENT.md"
    completion: "Published through PR 213 and merge commit 78af1e59f6e7cb32309420c45d59a60d4b98c2e1."

  - id: "GOV-08-MINIMAL-TESTSET-REBUILD"
    name: "Rebuild the retained test set from zero"
    status: "completed_merged_and_deployed"
    depends_on: ["GOV-07-SNAPSHOT-RETIREMENT"]
    problem: "The ordinary suite accumulated tests without a current purpose/trigger inventory."
    solution: "Retain only schema, output/privacy invariants, and one tiny fixture smoke per supported CLI; document each trigger and remove duplicate coverage."
    effect: "Every retained test has one named risk and the smallest fixture that proves it."
    acceptance:
      - "No workflow invokes unbounded pytest."
      - "The retained Python inventory contains only six files: three CLI smoke nodes, output/privacy contracts, and focused docs/governance controls."
      - "MTGO and Melee pre-fetch jobs run only their own explicit minimum nodes and finish test execution within 60 seconds, excluding dependency installation."
      - "Schema, candidate-boundary, output-invariant, consumer, and generated-page checks remain at the publication output gate."
      - "All 91 Python test deletions and three additions were declared by exact path before the file operations."
      - "Fixtures and JavaScript/browser tests remain unchanged for later authorized tasks."
    evidence: "docs/audits/GOV-08-MINIMAL-TESTSET-REBUILD.md"
    completion: "Published through PR 214 and merge commit eb0eb7eb4226878430581b8968f24a60079a482e."

  - id: "GOV-08A-GITHUB-AUTH-SINGLE-ENTRYPOINT"
    name: "Make repository preflight the only GitHub credential verdict"
    status: "owner_accepted_completion_authorized"
    depends_on: ["GOV-08-MINIMAL-TESTSET-REBUILD"]
    problem: "A restricted-context bare gh auth result could still be misreported as an invalid token despite the documented publication method."
    solution: "Route every credential verdict through one repository script with machine-readable states and require the actual publication context before it can inspect gh."
    effect: "Restricted credential access causes an automatic context retry instead of an unnecessary Owner login request."
    acceptance:
      - "AGENTS.md names the preflight script as the only credential-verdict entry point."
      - "A call without ActualPublicationContext returns RETRY_ACTUAL_CONTEXT without invoking gh."
      - "The actual publication context returns READY only for Jacelber with repository push permission and any required workflow scope."
      - "Only AUTH_REJECTED permits an Owner login request; permission and network failures keep their own states."
      - "No GitHub workflow, product, data, statistical, UI, Schema, or public-path behavior changes."

  - id: "GOV-09-UI-ACCEPTANCE-CONTRACT"
    name: "Make owner browser review the UI acceptance record"
    status: "planned_not_authorized"
    depends_on: ["GOV-06-OUTPUT-GATED-VALIDATION-CUTOVER"]
    problem: "Automated browser reruns duplicate detailed owner review and previously missed real mobile navigation defects."
    solution: "Use syntax/model smoke before review, record the owner-reviewed immutable commit, and do not rerun Playwright after acceptance; keep one generated-page smoke only at the publish output gate."
    effect: "UI work is checked where defects are visible without paying for duplicate post-review automation."

  - id: "GOV-10-PRODUCTION-EVIDENCE-REUSE"
    name: "Stop retesting validated production commits"
    status: "planned_not_authorized"
    depends_on: ["GOV-06-OUTPUT-GATED-VALIDATION-CUTOVER", "GOV-08-MINIMAL-TESTSET-REBUILD"]
    problem: "Scheduled build, bot push CI, and Pages can repeat evidence for the same generated subject."
    solution: "Bind publication and bot admission to immutable build evidence, make unchanged inputs produce unchanged bytes, and verify only SHA, HTTP availability, and required resources after deployment."
    effect: "One candidate is validated once before publication; downstream stages reuse that evidence."

  - id: "GOV-11-LIVE-DOCUMENT-SLIMMING"
    name: "Keep live governance documents small"
    status: "planned_not_authorized"
    depends_on: ["GOV-06-OUTPUT-GATED-VALIDATION-CUTOVER"]
    problem: "ROADMAP and mandatory reading contain completed history that consumes time and context every task."
    solution: "Move completed detail to docs/history, keep current/future objectives and acceptance only, and require the same archive step at every completion."
    effect: "Agents read only current state and relevant future work; ROADMAP no longer grows without bound."

  - id: "GOV-12-OPERATIONS-AND-PRIVACY-CLOSEOUT"
    name: "Add the missing low-cost operational guards"
    status: "planned_not_authorized"
    depends_on: ["GOV-08-MINIMAL-TESTSET-REBUILD"]
    problem: "HMAC recovery, suppression enforcement, and failure recovery are not one executable contract."
    solution: "Document key recovery/rotation, add a non-public suppression list enforced at output, and create a short production recovery runbook."
    effect: "Privacy and recovery promises become executable without adding PR-wide testing."

  - id: "GOV-13-BOUNDED-MAINTENANCE-AUTHORITY"
    name: "Avoid a full authorization cycle for routine maintenance"
    status: "planned_not_authorized"
    depends_on: ["GOV-11-LIVE-DOCUMENT-SLIMMING"]
    problem: "Routine dependency and CI maintenance repeatedly pays the same governance setup cost."
    solution: "Define a narrow standing local-maintenance contract with prohibited changes, audit requirements, and the same acceptance-continuation stop conditions."
    effect: "Safe maintenance can start promptly while product, statistics, credentials, and remote actions remain owner-gated."
