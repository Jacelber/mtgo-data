    - "assets/css/phase8-base.css"
    - "assets/css/phase8-candidate.css"
    - "index.html"
    - "melee/index.html"
    - "tests/browser/accessibility.spec.js"
    - "tests/browser/loading-retry.spec.js"
    - "tests/browser/card-preview.spec.js"
    - "tests/browser/view-lazy-loading.spec.js"
    - "tests/js/phase8-runtime.test.js"
    - "tests/test_documentation_history.py"
    - "tests/test_frontend_asset_split.py"
    - "tests/test_node_test_suite.py"
    - "tests/test_phase8_production_candidate.py"
    - "tests/test_phase8_mtgo_production_entry.py"
    - "tests/test_phase8_tabletop_production_entry.py"
    - "tests/test_validate_repository.py"
    - "validate_repository.py"
    - "docs/prototypes/P8-07/index.html"
    - "docs/prototypes/P8-08/index.html"
    - "docs/FRONTEND_DESIGN_SYSTEM.md"
    - "docs/ROADMAP.md"
    - "docs/audits/P12-09.md"
    - "docs/STATUS.yaml"
  protected_scope:
    code_changed: "Runtime JSON cache and refresh state, scoped loading and retry UI, bounded card-image loading and placeholders, and touch-only card preview only"
    workflow_changed: "none"
    raw_or_generated_data_changed: "none"
    statistical_behavior_changed: "none"
    schema_changed: "none"
    frontend_source_changed: "shared classic-script runtime, controllers, interaction layer, bilingual copy, and shared CSS only"
    public_paths_changed: "none"
    event_434455_bytes_changed: false
    production_dispatched: false
    remote_write_performed: "none"
  allowed_actions:
    - "Implement the owner-approved session cache, LRU eviction, timeout, manual retry, visibility refresh, staged update, and stale-render contract."
    - "Replace destructive global loading and deferred-error behavior with text-first initial skeletons and scoped detail, refresh, image, and catalog states."
    - "Reserve card-image dimensions, defer near-viewport requests, bound image concurrency, and provide one explicit retry after an external-image failure."
    - "Add a touch-only full-screen card preview with accessible dismissal, history, focus, scroll restoration, and an explicit Scryfall link while preserving desktop hover and click."
    - "Prepare reusable Landing and Pickup loading boundaries without generating Landing data, adding its UI, or changing current product availability."
    - "Add focused real-browser coverage, update design and roadmap authority, and record local acceptance evidence."
  prohibited_changes:
    - "Any statistical formula, generated data, Schema, workflow, catalog, Pages policy, request path, product availability, event whitelist, or public-path change."
    - "Landing producer or reader UI, classifier remediation, P12-10 work, Weekly Pickup migration, service worker, mandatory front-end framework, or another task."
    - "Manual production dispatch, force-push, direct master development, workflow mutation, repository-setting changes, or protected event 434455 byte changes."
  stop_point: "After the authorized commit, Ready pull request, successful CI, normal merge, remote-master confirmation, and merge-triggered Pages verification, stop without beginning P12-10, classifier remediation, another task, or a manual production dispatch."

