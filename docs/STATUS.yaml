    - "current task and authorization"
    - "known blockers"
    - "next planned task"
    - "prohibited next actions"
  not_authoritative_for:
    - "statistical formulas"
    - "product scope"
    - "data architecture"
    - "historical decisions"
    - "completed-task evidence"
  history_policy: "Completed-task detail and superseded state belong under docs/history or in the linked audit, decision, roadmap, pull-request, and Git history."

