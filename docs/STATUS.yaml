    - "Render dates, coverage, event counts, deck counts, and completeness only when supplied by the active product document."
    - "Use one shared responsive visual component while keeping fact selection and meaning inside each product consumer."
    - "Render missing values as explicit localized Unknown text rather than zero, an empty dash, or an invented substitute."
    - "Keep DEC-083 provisional_through, seal_on, and status lifecycle fields internal and absent from public Top 8 copy."
    - "Add Chinese and English copy, browser isolation coverage, 390- and 412-pixel visual verification, task audit, and live status."
