    code_changed: "Shared freshness-strip presentation plus explicit MTGO statistics, matchup, Top 8, Weekly Pickup, and Tabletop fact mappings only"
    workflow_changed: "none"
    raw_or_generated_data_changed: "none"
    statistical_behavior_changed: "none"
    schema_changed: "none"
    frontend_source_changed: "shared CSS, a focused classic-script renderer and product fact mapper, product consumers, entry-point script references, and bilingual copy only"
