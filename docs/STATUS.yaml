    - "Give fetch an independent timeout budget and stop remaining official event-format operations after the first shared-source failure while retaining independent Videre attempts."
    - "Preserve least privilege, immutable trigger SHA, checkpoint recovery, build and publish gates, and failure-stage reporting."
