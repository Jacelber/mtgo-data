current_task:
  id: "OPS-VIDERE-DEGRADED-FETCH"
  name: "Degrade bounded Videre source outages without suppressing MTGO updates"
  status: "owner_accepted_publication_authorized"
  authorized_on: "2026-08-04"
  workspace: "C:/tmp/mtgo-data-ops-videre-degraded-20260804-01"
  branch: "codex/ops-videre-degraded-fetch"
  base_commit: "643dbd17bb2ba0d959fb63f649ab325441af8e93"
  task_type: "production_source_availability_maintenance"
  objective: "Allow exhausted retryable Videre outages to lower disclosed matchup completeness while unrelated MTGO data continues through validated publication."
  authorization:
    local_implementation: true
    commit: true
    remote_publication: true
    merge: true
  target_paths:
    - ".github/workflows/update.yml"
    - "src/mtgmeta/mtgo/matchup.py"
    - "src/mtgmeta/mtgo/__main__.py"
    - "tests/test_mtgo_matchup.py"
    - "tests/test_mtgo_cli.py"
    - "tests/test_production_workflow.py"
    - "tests/test_mtgo_top8.py"
    - "tests/test_validate_schemas.py"
    - "docs/STATISTICS_SPEC.md"
    - "docs/DATA_ARCHITECTURE.md"
    - "docs/DECISIONS.md"
    - "docs/STATUS.yaml"
  protected_scope:
    code_changed: "Videre transient-source classification and CLI reporting only"
    workflow_changed: "job-summary shell quoting only; pipeline structure and permissions unchanged"
    raw_or_generated_data_changed: false
    statistical_behavior_changed: "no formula change; missing Videre archives remain disclosed and matchup calculations use available archives only"
    schema_changed: false
    frontend_source_changed: false
    public_paths_changed: false
    event_434455_bytes_changed: false
    production_dispatched: false
    remote_write_performed: false
  acceptance:
    graceful_degradation: "Exhausted retryable Videre HTTP, timeout, and transport failures are warnings and do not block unrelated MTGO candidate generation or publication."
    fatal_boundary: "Non-retryable HTTP, malformed source contracts, invalid identities, storage failures, and unclassified exceptions remain fatal."
    completeness: "An admitted event without a usable Videre archive remains in missing_event_ids and lowers videre-range-coverage-v1 without being represented as zero matches."
    production_baseline_tests: "Top 8 history and Schema-count assertions derive from the committed production snapshot instead of the prior week's hard-coded counts."
    protected_behavior: "No source or generated data, formula, Schema, front-end source, public path, or protected event 434455 byte changes."
  owner_acceptance: "accepted"
  owner_accepted_on: "2026-08-04"
  owner_publication_authorized_on: "2026-08-04"
  stop_point: "Commit, push, pull-request creation, CI monitoring, and merge are authorized for OPS-VIDERE-DEGRADED-FETCH. Do not dispatch production or begin P12-01 or Phase 12."

