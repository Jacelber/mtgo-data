    user_facing_name: "MTGO Environment Trends"
    public_entry: "/index.html"
    public_formats:
      - "standard"
      - "modern"
    source_scope: "data/<format>/mtgo"
    statistics_scope: "stats/<format>/mtgo"
  tabletop:
    user_facing_name: "Tabletop Major Events"
    public_entry: "/melee/index.html"
    public_events:
      - event_id: 434455
        format: "modern"
        structure: "mixed"
    whitelist: "configs/melee_events.yaml"
    source_scope: "data_raw/melee and data/<format>/melee"
    statistics_scope: "stats/<format>/melee"
  separation_rule: "MTGO and tabletop source data, normalized data, statistics, catalogs, and front-end behavior remain separate."

