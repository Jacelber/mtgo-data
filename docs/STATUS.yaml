    prior_success: "Run 31742869239 completed ordinary live collection in about two minutes after its clean baseline"
    focused_pytest: "All 21 workflow-contract tests passed once; the one documentation node failed only on a known line-break string expectation and passed when that failed node alone was rerun"
    actionlint: "Not available from the repository-declared local environment; remains a required one-time complete-PR-CI check"
    ruff: "Both changed Python test files passed once"
    browser_validation: "Not applicable because no UI or public consumer changed"
  prohibited_changes:
    - "Do not delete, skip, weaken, mark non-blocking, or repeat the complete clean baseline."
    - "Do not fetch live data locally, dispatch production, change statistical meaning or generated data, retry the rehearsal before a successful scheduled production run, or begin P12-10."
  stop_point: "Commit and publish one Ready pull request, run one complete CI, merge only after every required check passes, manually dispatch exactly one production run, and repeat the no-publication rehearsal only if that production run succeeds; stop before P12-10."

