current_task:
  id: "CLASSIFIER-R3-PRODUCTION-MIGRATION"
  name: "Accepted classifier production and Pickup migration"
  status: "owner_accepted_and_locally_committed"
  authorized_on: "2026-08-11"
  completed_on: "2026-08-11"
  workspace: "D:/dl/crawlerpj/.codex-workspaces/classifier-r3-20260810-01"
  branch: "codex/classifier-r3-production-migration"
  base_commit: "f586bff875c46c9f4cedcb3b84dc74427700f30c"
  task_type: "local_statistical_artifact_migration"
  artifact_impact: "statistical_json_structure"
  objective: "Promote the owner-accepted R1 identities and R2 shadow rules into the shared production classifier, atomically migrate parent-keyed Pickup known state, and deterministically refresh existing MTGO and Tabletop classification-derived artifacts without changing formulas, source data, product separation, public paths, or workflows."
  authorization:
    local_implementation: true
    commit: true
    remote_publication: false
    merge: false
  target_paths:
    - "my_archetypes/modern.yaml"
    - "my_archetypes/standard.yaml"
    - "configs/classifier_semantic_features.yaml"
    - "src/mtgmeta/classifier*.py"
    - "src/mtgmeta/config.py"
    - "src/mtgmeta/rules.py"
    - "schemas/classification-rules.schema.json"
    - "schemas/classifier-semantic-features.schema.json"
    - "schemas/melee-compatibility-manifest.schema.json"
    - "reports/{modern,standard}/mtgo/*.json"
    - "stats/{modern,standard}/mtgo/**"
    - "data/modern/melee/classifications/434455.json"
    - "data/modern/melee/opportunities/434455.json"
    - "stats/modern/melee/events/434455/*.json"
    - "stats/catalog.json"
    - "tests/fixtures/melee/434455_compatibility_manifest.json"
    - "docs/audits/classifier-r{1,2,3}/**"
    - "tools/*classifier_r{2,3}*.py"
    - "tests/test_classifier_r{1,2,3}*.py"
    - "tests and validators directly affected by the migration"
    - "docs/ROADMAP.md"
    - "docs/DECISIONS.md"
    - "docs/audits/CLASSIFIER-R3-PRODUCTION-MIGRATION.md"
    - "docs/STATUS.yaml"
  protected_scope:
    code_changed: "Shared classifier semantic-feature binding, deterministic R3 rule and Pickup migration tools, and R1/R2 evidence compatibility only"
    workflow_changed: "none"
    raw_or_generated_data_changed: "classification-derived MTGO and Tabletop artifacts only; no source-event or retained-response change"
    statistical_behavior_changed: "classification identity only; no formula, window, opportunity, match, or rounding change"
    schema_changed: "classification rule semantic-manifest binding and versioned 434455 derived-artifact compatibility contract only"
    frontend_source_changed: "none"
    public_paths_changed: "none"
    event_434455_bytes_changed: false
    production_dispatched: false
    remote_write_performed: "none"
  allowed_actions:
    - "Promote the exact owner-accepted R2 shadow inventories and globally unique priorities into production rules."
    - "Bind production rules to the narrow fail-closed semantic feature manifest by versioned path and SHA-256."
    - "Apply the exact R2 Pickup known-state migration and prove that accepted identity changes do not create false new-archetype candidates."
    - "Refresh existing Standard and Modern MTGO reports/statistics and the existing Tabletop 434455 classification-derived closure."
    - "Freeze R1/R2 baselines so their historical evidence remains byte-reproducible after production migration."
    - "Run complete validation and prepare local owner-review evidence."
  prohibited_changes:
    - "Any statistical formula, source event, retained response, workflow, Pages policy, request path, product availability, event whitelist, public-path, or front-end change."
    - "Any rewrite of reviewed Pickup candidates, comments, approvals, published weeks, or history indexes beyond classification-derived existing Top8 week contents."
    - "R4 residual-Unknown review, P12-10 Landing work, another task, push, pull request, merge, or production dispatch."
    - "Force-push, direct master development, repository-setting changes, or protected event 434455 source-byte changes."
  stop_point: "After the Owner-authorized local commit, stop without publishing, starting R4, or starting P12-10."

