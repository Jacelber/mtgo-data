    classifier_rule_changed: "none"
    workflow_changed: "Separate clean baseline and fetch jobs; stop repeated same-source event waits after first failure"
    raw_or_generated_data_changed: "none"
    statistical_behavior_changed: "none"
    schema_changed: "none"
    frontend_source_changed: "none"
    public_paths_changed: "none"
