  allowed_actions:
    - "Replace the volatile exact Modern matchup row-count assertion with full ordered parent-row identity comparison and dynamic expandable-parent checks."
    - "Run the existing real-data consumer contract after candidate generation and validation but before packaging."
    - "Report fetch-job clean-baseline failures as baseline while retaining fetch, build, and publish stages."
    - "Update focused workflow tests and the directly governing production-validation and notification contracts."
  prohibited_changes:
