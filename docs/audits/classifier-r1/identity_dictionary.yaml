inheritance_policy:
  rule: Every reviewed parent inherits its exact baseline identity unless it appears under target_overlays or dependent_amendments_to_accepted_current.
  display_names_may_change_only_when_explicitly_listed: true
  parent_and_subtype_ids_may_change_only_with_transition_map_entry: true
  numeric_priority_status: deferred_to_r2_complete_shadow
  fallback_policy: No new generic fallback; unsupported or ambiguous constructions remain Unknown.
  source_policy: The same format taxonomy applies to MTGO and Tabletop; their data and statistics remain separate.

