migration_rules:
  - Never rewrite historical or generated artifacts in R1.
  - R2 proves each rule-routed transition; R3 applies accepted production and Pickup migrations.
  - Exact aliases are allowed only when membership semantics do not change.
  - Split and targeted-subset transitions require reclassification by the target rule set.
  - Parent-based Pickup known state never splits by subtype.
  - Every target derived from an already-known family is initialized as known to avoid a false new-deck claim.
  - Unknown-to-known oracle counts are validation evidence, not compatibility aliases.

