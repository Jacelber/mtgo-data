post_migration_invariants:
  - Removed Pickup keys are absent and every added key is present exactly once.
  - Modern Pickup remains stable-parent-ID based and Standard migration does not silently change its legacy key type.
  - No target derived from a known family is emitted as a Weekly Pickup new archetype solely because of the migration.
  - Existing approved Pickup weeks and reviewer comments remain byte-preserved unless a later task explicitly authorizes migration.
  - Candidate generation remains manual-state preserving and never overwrites a reviewed candidate.
