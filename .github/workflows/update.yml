name: MTGO production data update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read

concurrency:
  group: production-data-update
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch MTGO candidate data
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      failure-stage: ${{ steps.fetch-stage.outputs.stage }}
      generation-needed: ${{ steps.generation-subject.outputs.needed }}
      generation-subject-sha256: ${{ steps.generation-subject.outputs.sha256 }}
    permissions:
      actions: read
      contents: read
    env:
      PYTHONPATH: src
      MTGO_TRANSIENT_EXIT_CODE: "75"
    steps:
      - name: Check out full history without persisted credentials
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Select registry-admitted production formats
        shell: bash
        run: |
          COLLECTION_FORMATS=$(python -B validate_production_candidate.py formats --kind collection)
          PRODUCT_FORMATS=$(python -B validate_production_candidate.py formats --kind product)
          echo "MTGO_EVENT_FORMATS=$COLLECTION_FORMATS" >> "$GITHUB_ENV"
          echo "MTGO_PRODUCT_FORMATS=$PRODUCT_FORMATS" >> "$GITHUB_ENV"
          echo "MTGO_HIERARCHY_FORMATS=$PRODUCT_FORMATS" >> "$GITHUB_ENV"

      - name: Snapshot production data baseline
        run: python -B validate_production_candidate.py snapshot --output "$RUNNER_TEMP/production-baseline.json"

      - name: Record input collection stage
        id: fetch-stage
        run: echo "stage=fetch" >> "$GITHUB_OUTPUT"

      - name: Find a compatible incomplete fetch checkpoint
        id: previous-checkpoint
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "mtgo-fetch-checkpoint",
                per_page: 100,
              },
            );
            const candidates = artifacts
              .filter(
                (artifact) =>
                  !artifact.expired &&
                  artifact.workflow_run?.head_branch === "master",
              )
              .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));
            let checkpoint;
            const {spawnSync} = require('child_process');
            for (const candidate of candidates) {
              const run = (await github.rest.actions.getWorkflowRun({...context.repo, run_id: candidate.workflow_run.id})).data;
              if (run.path !== '.github/workflows/update.yml' || run.head_branch !== 'master' || !['schedule', 'workflow_dispatch'].includes(run.event) || run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`) continue;
              const result = spawnSync('python', ['-B', 'mtgo_fetch_checkpoint.py', 'compatible', '--source', run.head_sha, '--current', context.sha], {encoding: 'utf8'});
              if (result.status === 0) { checkpoint = {...candidate, source: run.head_sha}; break; }
              if (result.status !== 1) throw new Error(result.stderr || result.stdout || 'Checkpoint applicability query failed');
            }
            core.setOutput("found", checkpoint ? "true" : "false");
            core.setOutput("run-id", checkpoint ? String(checkpoint.workflow_run.id) : "");
            core.setOutput("source", checkpoint ? checkpoint.source : "");

      - name: Download compatible incomplete fetch checkpoint
        if: steps.previous-checkpoint.outputs.found == 'true'
        uses: actions/download-artifact@v4.3.0
        with:
          name: mtgo-fetch-checkpoint
          path: ${{ runner.temp }}/mtgo-fetch-resume
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous-checkpoint.outputs.run-id }}

      - name: Verify and restore compatible incomplete fetch checkpoint
        if: steps.previous-checkpoint.outputs.found == 'true'
        shell: bash
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/mtgo-fetch-resume"
          (
            cd "$ARTIFACT_DIR"
            sha256sum --check SHA256SUMS
          )
          python -B mtgo_fetch_checkpoint.py rebind \
            --checkpoint "$ARTIFACT_DIR/checkpoint.json" \
            --source '${{ steps.previous-checkpoint.outputs.source }}' \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --event-formats "$MTGO_EVENT_FORMATS" --match-formats "$MTGO_PRODUCT_FORMATS"
          cmp "$ARTIFACT_DIR/production-baseline.json" "$RUNNER_TEMP/production-baseline.json"
          if tar -tf "$ARTIFACT_DIR/fetched-inputs.tar" | grep -Ev '^(data/|fetched\.txt$)'; then
            echo "Fetch checkpoint contains a path outside the input boundary." >&2
            exit 1
          fi
          tar -xf "$ARTIFACT_DIR/fetched-inputs.tar" -C "$GITHUB_WORKSPACE"
          cp "$ARTIFACT_DIR/checkpoint.json" "$RUNNER_TEMP/mtgo-fetch-checkpoint.json"

      - name: Prepare fetch checkpoint
        id: checkpoint
        shell: bash
        run: |
          CHECKPOINT="$RUNNER_TEMP/mtgo-fetch-checkpoint.json"
          if [ ! -f "$CHECKPOINT" ]; then
            python -B mtgo_fetch_checkpoint.py initialize \
              --checkpoint "$CHECKPOINT" --repository "$GITHUB_REPOSITORY" \
              --commit "$GITHUB_SHA" --event-formats "$MTGO_EVENT_FORMATS" \
              --match-formats "$MTGO_PRODUCT_FORMATS"
          fi
          python -B mtgo_fetch_checkpoint.py validate \
            --checkpoint "$CHECKPOINT" --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --event-formats "$MTGO_EVENT_FORMATS" \
            --match-formats "$MTGO_PRODUCT_FORMATS"

      - name: Fetch every pending MTGO input operation
        shell: bash
        run: |
          CHECKPOINT="$RUNNER_TEMP/mtgo-fetch-checkpoint.json"
          STATUS=0
          RECOVERY_DELAYS=(120 300)
          fetch_events_with_recovery() {
            local format="$1"
            local attempt status delay
            for attempt in 1 2 3; do
              echo "Collecting MTGO event raw data for ${format} (recovery round ${attempt}/3)."
              if python -B -m mtgmeta.mtgo --format "$format" fetch-events; then
                return 0
              else
                status=$?
              fi
              if [ "$status" -ne "$MTGO_TRANSIENT_EXIT_CODE" ]; then
                return "$status"
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "MTGO transient source failure exhausted 3 recovery rounds for ${format}." >&2
                return "$status"
              fi
              delay="${RECOVERY_DELAYS[$((attempt - 1))]}"
              echo "MTGO source is temporarily unavailable; retrying ${format} in ${delay} seconds." >&2
              sleep "$delay"
            done
          }
          for FORMAT in $MTGO_EVENT_FORMATS; do
            OPERATION="events/${FORMAT}"
            if python -B mtgo_fetch_checkpoint.py is-complete \
              --checkpoint "$CHECKPOINT" --repository "$GITHUB_REPOSITORY" \
              --commit "$GITHUB_SHA" --event-formats "$MTGO_EVENT_FORMATS" \
              --match-formats "$MTGO_PRODUCT_FORMATS" --operation "$OPERATION"; then
              echo "Reusing completed MTGO event collection for ${FORMAT}."
              continue
            fi
            if fetch_events_with_recovery "$FORMAT"; then
              python -B mtgo_fetch_checkpoint.py complete \
                --checkpoint "$CHECKPOINT" --repository "$GITHUB_REPOSITORY" \
                --commit "$GITHUB_SHA" --event-formats "$MTGO_EVENT_FORMATS" \
                --match-formats "$MTGO_PRODUCT_FORMATS" --operation "$OPERATION"
            else
              STATUS=1
              echo "Stopping remaining MTGO event collection after ${FORMAT} failed; the remaining formats use the same upstream listing service." >&2
              break
            fi
          done
          for FORMAT in $MTGO_PRODUCT_FORMATS; do
            OPERATION="matches/${FORMAT}"
            if python -B mtgo_fetch_checkpoint.py is-complete \
              --checkpoint "$CHECKPOINT" --repository "$GITHUB_REPOSITORY" \
              --commit "$GITHUB_SHA" --event-formats "$MTGO_EVENT_FORMATS" \
              --match-formats "$MTGO_PRODUCT_FORMATS" --operation "$OPERATION"; then
              echo "Reusing completed Videre match collection for ${FORMAT}."
              continue
            fi
            echo "Collecting Videre match data for ${FORMAT}."
            if python -B -m mtgmeta.mtgo --format "$FORMAT" fetch-matches; then
              python -B mtgo_fetch_checkpoint.py complete \
                --checkpoint "$CHECKPOINT" --repository "$GITHUB_REPOSITORY" \
                --commit "$GITHUB_SHA" --event-formats "$MTGO_EVENT_FORMATS" \
                --match-formats "$MTGO_PRODUCT_FORMATS" --operation "$OPERATION"
            else
              STATUS=1
            fi
          done
          exit "$STATUS"

      - name: Identify the immutable generation subject
        id: generation-subject
        shell: bash
        run: |
          SUBJECT_TAR="$RUNNER_TEMP/mtgo-generation-subject.tar"
          INPUTS=(src data configs my_archetypes schemas fetched.txt pyproject.toml requirements.txt)
          if [ -d rules ]; then
            INPUTS+=(rules)
          fi
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 \
            --numeric-owner -cf "$SUBJECT_TAR" "${INPUTS[@]}"
          SUBJECT_SHA="$(sha256sum "$SUBJECT_TAR" | awk '{print $1}')"
          PREVIOUS_SHA="$(git log --format='%(trailers:key=Generation-Subject-SHA256,valueonly)' \
            | grep -m1 -E '^[0-9a-f]{64}$' || true)"
          if [ "$SUBJECT_SHA" = "$PREVIOUS_SHA" ]; then
            NEEDED=false
            echo "Generation subject is unchanged; build and publication will be skipped."
          else
            NEEDED=true
            echo "Generation subject requires one validated build."
          fi
          echo "sha256=$SUBJECT_SHA" >> "$GITHUB_OUTPUT"
          echo "needed=$NEEDED" >> "$GITHUB_OUTPUT"

      - name: Package resumable fetch checkpoint
        if: failure() && steps.checkpoint.outcome == 'success'
        shell: bash
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/mtgo-fetch-checkpoint"
          mkdir -p "$ARTIFACT_DIR"
          tar -cf "$ARTIFACT_DIR/fetched-inputs.tar" data fetched.txt
          cp "$RUNNER_TEMP/production-baseline.json" "$ARTIFACT_DIR/production-baseline.json"
          cp "$RUNNER_TEMP/mtgo-fetch-checkpoint.json" "$ARTIFACT_DIR/checkpoint.json"
          (
            cd "$ARTIFACT_DIR"
            sha256sum fetched-inputs.tar production-baseline.json checkpoint.json > SHA256SUMS
          )

      - name: Upload immutable resumable fetch checkpoint
        if: failure() && steps.checkpoint.outcome == 'success'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: mtgo-fetch-checkpoint
          path: ${{ runner.temp }}/mtgo-fetch-checkpoint
          if-no-files-found: error
          retention-days: 7

      - name: Package fetched candidate for the build job
        if: steps.generation-subject.outputs.needed == 'true'
        shell: bash
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/mtgo-fetch-candidate"
          mkdir -p "$ARTIFACT_DIR"
          tar -cf "$ARTIFACT_DIR/fetched-inputs.tar" data fetched.txt
          cp "$RUNNER_TEMP/production-baseline.json" "$ARTIFACT_DIR/production-baseline.json"
          (
            cd "$ARTIFACT_DIR"
            sha256sum fetched-inputs.tar production-baseline.json > SHA256SUMS
          )

      - name: Upload immutable fetched candidate
        if: steps.generation-subject.outputs.needed == 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: mtgo-fetch-candidate
          path: ${{ runner.temp }}/mtgo-fetch-candidate
          if-no-files-found: error
          retention-days: 1

      - name: Write fetch summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MTGO production fetch"
            echo
            echo "- Job result: ${{ job.status }}"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Candidate transfer: immutable \`mtgo-fetch-candidate\` artifact"
            echo "- Generation subject: \`${{ steps.generation-subject.outputs.sha256 || 'not-reached' }}\`"
            echo "- Build required: \`${{ steps.generation-subject.outputs.needed || 'not-reached' }}\`"
            echo "- Restart transfer: a seven-day \`mtgo-fetch-checkpoint\` reused when relevant inputs and the operation plan remain unchanged"
            echo "- Transient MTGO event recovery: three rounds with 120-second and 300-second cooldowns"
            echo "- Event formats: ${MTGO_EVENT_FORMATS}"
            echo "- Match formats: ${MTGO_PRODUCT_FORMATS}"
            echo "- The checkpoint is verified before reuse and is never sent to build or publish."
            echo "- No repository write permission is available to this job; Actions read is limited to locating a prior checkpoint."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and validate MTGO candidate
    if: >-
      github.ref == 'refs/heads/master' &&
      needs.fetch.outputs.generation-needed == 'true'
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      generation-subject-sha256: ${{ needs.fetch.outputs.generation-subject-sha256 }}
      validated-output-sha256: ${{ steps.output-evidence.outputs.sha256 }}
    permissions:
      contents: read
    env:
      PYTHONPATH: src
    steps:
      - name: Check out full history without persisted credentials
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Select registry-admitted production formats
        shell: bash
        run: |
          COLLECTION_FORMATS=$(python -B validate_production_candidate.py formats --kind collection)
          PRODUCT_FORMATS=$(python -B validate_production_candidate.py formats --kind product)
          echo "MTGO_EVENT_FORMATS=$COLLECTION_FORMATS" >> "$GITHUB_ENV"
          echo "MTGO_PRODUCT_FORMATS=$PRODUCT_FORMATS" >> "$GITHUB_ENV"
          echo "MTGO_HIERARCHY_FORMATS=$PRODUCT_FORMATS" >> "$GITHUB_ENV"

      - name: Download immutable fetched candidate
        uses: actions/download-artifact@v4.3.0
        with:
          name: mtgo-fetch-candidate
          path: ${{ runner.temp }}/mtgo-fetch-candidate

      - name: Verify and restore fetched candidate
        shell: bash
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/mtgo-fetch-candidate"
          (
            cd "$ARTIFACT_DIR"
            sha256sum --check SHA256SUMS
          )
          tar -xf "$ARTIFACT_DIR/fetched-inputs.tar" -C "$GITHUB_WORKSPACE"

      - name: Build product statistics
        shell: bash
        run: |
          for FORMAT in $MTGO_PRODUCT_FORMATS; do
            echo "Building MTGO statistics for ${FORMAT}."
            python -B -m mtgmeta.mtgo --format "$FORMAT" build-statistics
          done

      - name: Build product matchup statistics
        shell: bash
        run: |
          for FORMAT in $MTGO_PRODUCT_FORMATS; do
            echo "Building matchup statistics for ${FORMAT}."
            python -B -m mtgmeta.mtgo --format "$FORMAT" build-matchups
          done

      - name: Build product completeness reports
        shell: bash
        run: |
          for FORMAT in $MTGO_PRODUCT_FORMATS; do
            echo "Building MTGO completeness reports for ${FORMAT}."
            python -B -m mtgmeta.mtgo --format "$FORMAT" build-completeness
          done

      - name: Build weekly Top 8 decklists
        shell: bash
        run: |
          for FORMAT in $MTGO_PRODUCT_FORMATS; do
            echo "Building weekly MTGO Top 8 data for ${FORMAT}."
            python -B -m mtgmeta.mtgo --format "$FORMAT" build-top8
          done

      - name: Prepare Landing screening candidates when absent
        continue-on-error: true
        shell: bash
        run: |
          STATUS=0
          for FORMAT in $MTGO_PRODUCT_FORMATS; do
            echo "Preparing Landing screening candidates for ${FORMAT}."
            python -B -m mtgmeta.mtgo --format "$FORMAT" landing-review prepare --if-absent || STATUS=$?
          done
          exit "$STATUS"

      - name: Build latest MTGO Landing documents
        shell: bash
        run: |
          for FORMAT in $MTGO_PRODUCT_FORMATS; do
            echo "Building latest MTGO Landing for ${FORMAT}."
            python -B -m mtgmeta.mtgo --format "$FORMAT" build-landing
          done

      - name: Generate maintained hierarchy catalogs
        shell: bash
        run: |
          for FORMAT in $MTGO_HIERARCHY_FORMATS; do
            echo "Generating archetype hierarchy for ${FORMAT}."
            python -B -m mtgmeta.mtgo --format "$FORMAT" generate-hierarchy
          done

      - name: Generate and strictly validate product classification diagnostics
        shell: bash
        run: |
          for FORMAT in $MTGO_PRODUCT_FORMATS; do
            echo "Generating classification diagnostics for ${FORMAT}."
            python -B -m mtgmeta.mtgo --format "$FORMAT" classification-reports --strict
          done

      - name: Generate product metadata
        shell: bash
        run: |
          for FORMAT in $MTGO_PRODUCT_FORMATS; do
            echo "Binding all reviewed MTGO output bytes for ${FORMAT}."
            python -B -m mtgmeta.mtgo --format "$FORMAT" generate-metadata
          done

      - name: Generate format-first consumer catalog
        run: python -B -m mtgmeta.catalog --root .

      - name: Validate production candidate scope and data increments
        run: >-
          python -B validate_production_candidate.py validate
          --baseline "$RUNNER_TEMP/mtgo-fetch-candidate/production-baseline.json"

      - name: Check changed product outputs
        run: python -B tools/check_outputs.py --changed-from HEAD

      - name: Package validated output for the publish job
        id: output-evidence
        shell: bash
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/mtgo-build-candidate"
          mkdir -p "$ARTIFACT_DIR"
          python -B tools/integrate_mtgo_candidate.py export --artifact "$ARTIFACT_DIR"
          printf '%s\n' '${{ needs.fetch.outputs.generation-subject-sha256 }}' \
            > "$ARTIFACT_DIR/generation-subject.txt"
          (
            cd "$ARTIFACT_DIR"
            sha256sum output.patch source.txt generation-subject.txt > SHA256SUMS
          )
          OUTPUT_SHA="$(sha256sum "$ARTIFACT_DIR/output.patch" | awk '{print $1}')"
          echo "sha256=$OUTPUT_SHA" >> "$GITHUB_OUTPUT"

      - name: Encrypt unpublished output without archive credentials
        env:
          CERTIFICATE: ${{ vars.ARCHIVE_HANDOFF_CERT }}
        run: |
          printf '%s' "$CERTIFICATE" > "$RUNNER_TEMP/mtgo-public.pem"
          openssl cms -encrypt -binary -stream -outform DER -aes-256-gcm \
            -in "$RUNNER_TEMP/mtgo-build-candidate/output.patch" \
            -out "$RUNNER_TEMP/mtgo-build-candidate/output.patch.cms" \
            -recip "$RUNNER_TEMP/mtgo-public.pem" \
            -keyopt rsa_padding_mode:oaep -keyopt rsa_oaep_md:sha256

      - name: Upload immutable validated output
        uses: actions/upload-artifact@v4.6.2
        with:
          name: mtgo-build-candidate
          path: |
            ${{ runner.temp }}/mtgo-build-candidate/output.patch.cms
            ${{ runner.temp }}/mtgo-build-candidate/source.txt
            ${{ runner.temp }}/mtgo-build-candidate/generation-subject.txt
            ${{ runner.temp }}/mtgo-build-candidate/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MTGO production build and validation"
            echo
            echo "- Job result: ${{ job.status }}"
            echo "- Candidate transfer: verified \`mtgo-fetch-candidate\` input and immutable \`mtgo-build-candidate\` output"
            echo "- Product formats: ${MTGO_PRODUCT_FORMATS}"
            echo "- Hierarchy formats: ${MTGO_HIERARCHY_FORMATS}"
            echo "- Validation: selected production scope and increments, changed output schemas and relevant format arithmetic. No mechanism suite or browser test is implied by this run."
            echo "- No repository write permission is available to this job."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish validated MTGO data
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment: product-archive
    timeout-minutes: 15
    outputs:
      published-commit: ${{ steps.publish.outputs.commit }}
      source-commit: ${{ github.sha }}
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out full history for publication
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download existing validated output
        uses: actions/download-artifact@v4.3.0
        with:
          name: mtgo-build-candidate
          path: ${{ runner.temp }}/mtgo-build-candidate

      - name: Decrypt the existing output in the trusted integration job
        env:
          HANDOFF_KEY: ${{ secrets.ARCHIVE_HANDOFF_KEY }}
        run: |
          umask 077
          KEY="$RUNNER_TEMP/mtgo-output-key.pem"
          trap 'rm -f "$KEY"' EXIT
          printf '%s' "$HANDOFF_KEY" > "$KEY"
          openssl cms -decrypt -binary -inform DER \
            -in "$RUNNER_TEMP/mtgo-build-candidate/output.patch.cms" \
            -inkey "$KEY" -out "$RUNNER_TEMP/mtgo-build-candidate/output.patch"

      - name: Verify candidate transfer
        shell: bash
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/mtgo-build-candidate"
          (cd "$ARTIFACT_DIR" && sha256sum --check SHA256SUMS)
          test "$(sha256sum "$ARTIFACT_DIR/output.patch" | awk '{print $1}')" = '${{ needs.build.outputs.validated-output-sha256 }}'
          test "$(tr -d '\r\n' < "$ARTIFACT_DIR/generation-subject.txt")" = '${{ needs.build.outputs.generation-subject-sha256 }}'
          test "$(tr -d '\r\n' < "$ARTIFACT_DIR/source.txt")" = "$GITHUB_SHA"

      - name: Integrate the existing result with current master
        id: integrate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin master
          python -B tools/integrate_mtgo_candidate.py integrate \
            --artifact "$RUNNER_TEMP/mtgo-build-candidate" --run "$GITHUB_RUN_ID"

      - name: Push only the prepared data change and query actual result
        id: publish
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ steps.integrate.outputs.commit }}
          INTEGRATION_STATUS: ${{ steps.integrate.outputs.status }}
          CHANGED: ${{ steps.integrate.outputs.changed }}
        run: |
          if [ "$INTEGRATION_STATUS" = prepared ]; then
            # On timeout, query below before deciding another write is needed.
            git push origin HEAD:master || true
          fi
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$CANDIDATE_COMMIT" origin/master; then
            echo "Candidate retained in mtgo-build-candidate. Resume the failed publish job and integrate only; do not restart collection or generation." >&2
            exit 1
          fi
          echo "commit=$CANDIDATE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "status=published" >> "$GITHUB_OUTPUT"

      - name: Prepare published data for automatic Pages delivery
        if: steps.publish.outputs.status == 'published' && steps.publish.outputs.changed == 'true'
        uses: actions/github-script@v7.0.1
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "prepare-pages.yml",
              ref: "master",
              inputs: {
                source: "${{ steps.publish.outputs.commit }}",
                operation: "mtgo-${{ github.run_id }}",
                publish_automatically: "true",
              },
            });

      - name: Write publication summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MTGO data integration"
            echo "- Result: ${{ job.status }}"
            echo "- Existing candidate: mtgo-build-candidate from this run"
            echo "- Integrated commit: ${{ steps.publish.outputs.commit || 'not-published' }}"
            echo "- Changed outputs: ${{ steps.publish.outputs.changed || 'not-published' }}"
            echo "- Disjoint changes are preserved. Changed inputs or overlapping outputs need focused integration, not automatic workflow restart or Owner reauthorization."
            echo "- If publication fails, resume the failed job with the retained candidate; successful fetch and build results remain reusable."
          } >> "$GITHUB_STEP_SUMMARY"

  weekly-readiness:
    name: Build private weekly maintenance readiness
    if: >-
      always() && github.ref == 'refs/heads/master' &&
      needs.fetch.result == 'success' &&
      ((needs.fetch.outputs.generation-needed == 'true' && needs.publish.result == 'success') ||
      (needs.fetch.outputs.generation-needed == 'false' && needs.publish.result == 'skipped'))
    needs:
      - fetch
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-name: ${{ steps.generate.outputs.artifact-name }}
      readiness-digest: ${{ steps.generate.outputs.readiness-digest }}
      review-id: ${{ steps.generate.outputs.review-id }}
      status: ${{ steps.generate.outputs.status }}
      week: ${{ steps.generate.outputs.week }}
    permissions:
      contents: read
    env:
      PYTHONPATH: src
    steps:
      - name: Check out the verified production publication
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.publish.outputs.published-commit || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Generate the private weekly handoff
        id: generate
        shell: bash
        env:
          PUBLICATION_SHA: ${{ needs.publish.outputs.published-commit || github.sha }}
        run: |
          OUTPUT_DIR="$RUNNER_TEMP/weekly-maintenance-readiness"
          mkdir -p "$OUTPUT_DIR"
          python -B tools/generate_weekly_maintenance_readiness.py \
            --repository-root . \
            --output "$OUTPUT_DIR/readiness.json" \
            --publication-sha "$PUBLICATION_SHA" \
            --production-run-id "$GITHUB_RUN_ID" \
            --production-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
          WEEK="$(python -c 'import json,os; d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "weekly-maintenance-readiness", "readiness.json"), encoding="utf-8")); print(d.get("review_label") or d["week"]["id"])')"
          echo "artifact-name=weekly-maintenance-readiness-${WEEK}" >> "$GITHUB_OUTPUT"

      - name: Encrypt the private weekly handoff without write credentials
        env:
          CERTIFICATE: ${{ vars.ARCHIVE_HANDOFF_CERT }}
        run: |
          printf '%s' "$CERTIFICATE" > "$RUNNER_TEMP/weekly-handoff-public.pem"
          openssl cms -encrypt -binary -stream -outform DER -aes-256-gcm \
            -in "$RUNNER_TEMP/weekly-maintenance-readiness/readiness.json" \
            -out "$RUNNER_TEMP/weekly-maintenance-readiness/readiness.cms" \
            -recip "$RUNNER_TEMP/weekly-handoff-public.pem" \
            -keyopt rsa_padding_mode:oaep -keyopt rsa_oaep_md:sha256

      - name: Transfer encrypted weekly handoff
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ steps.generate.outputs.artifact-name }}
          path: ${{ runner.temp }}/weekly-maintenance-readiness/readiness.cms
          if-no-files-found: error
          retention-days: 21

      - name: Write weekly readiness summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Weekly MTGO maintenance readiness"
            echo
            echo "- Job result: ${{ job.status }}"
            echo "- Review week: ${{ steps.generate.outputs.week || 'not-reached' }}"
            echo "- Readiness status: ${{ steps.generate.outputs.status || 'not-reached' }}"
            echo "- Readiness digest: \`${{ steps.generate.outputs.readiness-digest || 'not-reached' }}\`"
            echo "- Handoff artifact: \`${{ steps.generate.outputs.artifact-name || 'not-reached' }}\`"
            echo "- The public workflow attachment contains ciphertext only; the readable report is retained in the private archive, outside Pages packages."
            echo "- No Codex scheduled task or repository mutation is authorized by this handoff."
          } >> "$GITHUB_STEP_SUMMARY"

  weekly-readiness-notify:
    name: Create or update the weekly maintenance issue
    if: >-
      always() && github.ref == 'refs/heads/master' &&
      needs.weekly-readiness.result != 'skipped'
    needs: weekly-readiness
    runs-on: ubuntu-latest
    environment: product-archive
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Download the private weekly handoff
        if: needs.weekly-readiness.result == 'success'
        uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ needs.weekly-readiness.outputs.artifact-name }}
          path: ${{ runner.temp }}/weekly-maintenance-readiness

      - name: Decrypt and retain the business handoff in the private archive
        if: needs.weekly-readiness.result == 'success'
        env:
          HANDOFF_KEY: ${{ secrets.ARCHIVE_HANDOFF_KEY }}
          GH_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
        run: |
          umask 077
          KEY="$RUNNER_TEMP/weekly-handoff-key.pem"
          trap 'rm -f "$KEY"' EXIT
          printf '%s' "$HANDOFF_KEY" > "$KEY"
          REPORT="$RUNNER_TEMP/weekly-maintenance-readiness/readiness.json"
          openssl cms -decrypt -binary -inform DER \
            -in "$RUNNER_TEMP/weekly-maintenance-readiness/readiness.cms" \
            -inkey "$KEY" -out "$REPORT"
          python -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); assert d["document_type"] == "weekly_maintenance_readiness"' "$REPORT"
          ARCHIVE=Jacelber/mtgo-data-releases
          test "$(gh api "repos/$ARCHIVE" --jq .private)" = true
          DIGEST="$(sha256sum "$REPORT" | awk '{print $1}')"
          TAG="weekly-readiness-${GITHUB_RUN_ID}-${DIGEST:0:16}"
          # A lost create response is resolved by reading the same immutable object.
          if ! gh release view "$TAG" --repo "$ARCHIVE" >/dev/null 2>&1; then
            gh release create "$TAG" "$REPORT" --repo "$ARCHIVE" --draft \
              --title "Private weekly review handoff $GITHUB_RUN_ID" --notes "Business review material; not a deployable or recovery package." || true
          fi
          gh release download "$TAG" --repo "$ARCHIVE" --pattern readiness.json --output "$RUNNER_TEMP/weekly-handoff-returned.json"
          cmp "$REPORT" "$RUNNER_TEMP/weekly-handoff-returned.json"
          echo "Private handoff: https://github.com/$ARCHIVE/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update the deduplicated readiness issue
        uses: actions/github-script@v7.0.1
        env:
          READINESS_PATH: ${{ runner.temp }}/weekly-maintenance-readiness/readiness.json
          READINESS_RESULT: ${{ needs.weekly-readiness.result }}
        with:
          script: |
            const fs = require("fs");
            const result = process.env.READINESS_RESULT;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              per_page: 100,
            });
            if (result !== "success") {
              const marker = "<!-- weekly-maintenance-readiness-failure -->";
              const details = [
                marker,
                "## Weekly maintenance readiness failed",
                "",
                `- Production workflow run: [${context.runId}](${runUrl})`,
                `- Source commit: \`${context.sha}\``,
                "",
                "The production failure notifier remains authoritative for an upstream production failure. This issue records only a failure to build the private weekly handoff.",
              ].join("\n");
              const existing = issues.find(
                (issue) => !issue.pull_request && issue.body?.includes(marker) && issue.state === "open",
              );
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: details,
                });
                core.summary.addRaw(`Updated readiness failure issue #${existing.number}.`).addEOL();
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: "Weekly maintenance readiness failure",
                  body: details,
                });
                core.summary.addRaw(`Created readiness failure issue #${created.data.number}.`).addEOL();
              }
              await core.summary.write({ overwrite: false });
              return;
            }

            const readiness = JSON.parse(fs.readFileSync(process.env.READINESS_PATH, "utf8"));
            if (readiness.schema_version === "1.7.0") {
              // A legacy shared notice requires verified completion of both formats.
              const legacyWeeks = readiness.formats.find(item => item.format === "standard")?.completed_reviews || [];
              for (const week of legacyWeeks) {
                if (!["standard", "modern"].every(format => readiness.formats.some(
                  item => item.format === format && item.completed_reviews.includes(week),
                ))) continue;
                const marker = `<!-- weekly-maintenance:${week} -->`;
                const legacy = issues.find(issue => !issue.pull_request && issue.body?.includes(marker));
                if (legacy?.state === "open") {
                  const body = [marker, "## Weekly MTGO maintenance completed", "",
                    `- Review week: ${week}`,
                    "- Standard and Modern: explicit completion records verified against their accepted subjects.",
                    `- Verification: [run ${context.runId}](${runUrl}).`,
                    "- Completion evidence: configs/mtgo_weekly_review_completions.yaml.",
                    "This legacy shared notice is closed only after both formats are complete; data publication alone does not close it.",
                  ].join("\n");
                  await github.rest.issues.update({ ...context.repo, issue_number: legacy.number,
                    body, state: "closed", state_reason: "completed" });
                }
              }
              for (const item of readiness.formats) {
                // Only explicit verified completion closes this format/week's notice.
                for (const week of item.completed_reviews) {
                  const marker = `<!-- weekly-maintenance:${item.format}:${week} -->`;
                  const completed = issues.find(issue => !issue.pull_request && issue.body?.includes(marker));
                  if (completed?.state === "open") {
                    await github.rest.issues.update({ ...context.repo, issue_number: completed.number, state: "closed" });
                  }
                }
                if (!item.review_week) continue;
                const marker = `<!-- weekly-maintenance:${item.format}:${item.review_week} -->`;
                const digest = require("crypto").createHash("sha256").update(JSON.stringify(item)).digest("hex");
                const digestMarker = `<!-- readiness-digest:${digest} -->`;
                const body = [marker, digestMarker, "## MTGO 人工审核与公开状态", "",
                  `- ${item.format}：待审核周 ${item.review_week}；当前公开周 ${item.public_week}；数据准入 ${item.data_admission}；首页 ${item.landing_week}；维护完成 ${item.completion.state}。`,
                  ...item.blockers.map(reason => `- 停止原因：${reason}`),
                  `- 首页筛选：${item.landing_screening.status}；展示资料差异在确定性重算和筛选之后确认。`,
                  "", `完整分类材料保存在私有归档，取用位置见本次工作流摘要：[${context.runId}](${runUrl})。`,
                  "机器重点不能替代全量人工审核。只有既有政策接受的随机牌堆可以保留为 intentional Unknown。",
                  "分类接受后先发布该赛制的数据；首页筛选、展示资料差异、中文、英文和最终预览完成后再发布首页。第一次发布不表示维护全部完成。",
                  "两个赛制独立推进。此通知不是授权；请在当前 Owner 会话中开始或恢复相应维护范围。",
                ].join("\n");
                const existing = issues.find(issue => !issue.pull_request && issue.body?.includes(marker));
                if (!existing) {
                  await github.rest.issues.create({ ...context.repo,
                    title: `Weekly MTGO maintenance — ${item.format} ${item.review_week}`, body });
                } else if (!existing.body?.includes(digestMarker) || existing.state !== "open") {
                  await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body, state: "open" });
                }
              }
              core.summary.addRaw("Format-specific readiness checked; no completion inferred from collection or data publication.");
              await core.summary.write({ overwrite: false });
              return;
            }
            const week = readiness.week.id;
            const marker = `<!-- weekly-maintenance:${week} -->`;
            const digestMarker = `<!-- readiness-digest:${readiness.readiness_digest} -->`;
            const presentations = {
              blocked: {
                heading: "## Weekly MTGO maintenance is blocked",
                state: "open",
                instruction: "Resolve the reported machine blocker before starting or resuming human review.",
              },
              awaiting_owner_start: {
                heading: "## Weekly MTGO maintenance is ready",
                state: "open",
                instruction: "Open Codex manually and start one exact weekly Operational Lane from this handoff.",
              },
              completed: {
                heading: "## Weekly MTGO maintenance is completed",
                state: "closed",
                instruction: "The accepted weekly review subject is unchanged. No new start authorization or human re-review is required.",
              },
              revalidation_required: {
                heading: "## Weekly MTGO maintenance requires revalidation",
                state: "open",
                instruction: "The recorded classification-review or published Landing subject no longer matches. Inspect the exact mismatch before continuing.",
              },
            };
            const presentation = presentations[readiness.status];
            if (!presentation) {
              core.setFailed(`Unsupported weekly readiness status: ${readiness.status}`);
              return;
            }
            const formatLines = readiness.formats.map((item) => {
              const queue = item.retained_corpus_unknown_queue;
              return `- ${item.format}: ${item.classification.unresolved_unknown_count} unresolved Unknown in ${week}; ` +
                `${queue.outside_review_week_unresolved_unknown_count} unresolved Unknown outside the review week in the retained-corpus queue; ` +
                `${item.classification.accepted_intentional_unknown_count} accepted intentional Unknown in ${week}; ` +
                `${item.landing_screening.total_candidate_count ?? "unavailable"} Landing screening candidates; ` +
                `complete official classifications through rank 32 require Owner review; display metadata is reviewed only after final classification and Landing screening exposes an actual delta.`;
            });
            const completionLines = readiness.completion.state === "unrecorded"
              ? ["- Completion record: `unrecorded`."]
              : [
                  `- Completion record: \`${readiness.completion.state}\`; completed on \`${readiness.completion.completed_on}\`.`,
                  `- Completion evidence: ${readiness.completion.evidence}`,
                  ...(readiness.completion.mismatches.length > 0
                    ? [`- Material mismatches: ${readiness.completion.mismatches.join(", ")}`]
                    : []),
                ];
            const details = [
              marker,
              digestMarker,
              presentation.heading,
              "",
              `- Review week: \`${week}\` (${readiness.week.start} through ${readiness.week.end})`,
              `- Lifecycle: \`${readiness.week.status}\`; seals on \`${readiness.week.seal_on}\``,
              `- Status: \`${readiness.status}\``,
              `- Production publication: \`${readiness.production.publication_sha}\``,
              `- Workflow run: [${context.runId}](${runUrl})`,
              ...completionLines,
              "",
              ...formatLines,
              `- Landing machine facts: \`${readiness.landing.status}\`; optional machine draft: \`${readiness.landing.optional_draft_status}\`.`,
              "",
              `${presentation.instruction} This artifact is evidence, not authorization; the active Owner conversation starts and governs the exact lane.`,
              "Codex must provide every review-week unresolved deck's complete main deck and sideboard before requesting classification decisions. Unknown records outside the review week remain visible in a separate retained-corpus queue and do not change this week's review count or readiness status. Singleton status is not a reason to remain Unknown; intentional Unknown is limited to Owner-confirmed random card piles.",
              "",
              "Landing substantive Chinese, English, and final-preview decisions remain Owner-reviewed. After each acceptance, exact workbook import, generation, validation, and publication are deterministic continuation of the same lane. Machine facts are provenance-bound, optional machine prose is not required, and human final copy may be edited, replaced, omitted, or written independently of machine conclusions.",
            ].join("\n");
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.body?.includes(marker),
            );
            if (!existing) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Weekly MTGO maintenance — ${week}`,
                body: details,
              });
              if (presentation.state === "closed") {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: created.data.number,
                  state: "closed",
                });
              }
              core.summary.addRaw(`Created weekly maintenance issue #${created.data.number}.`).addEOL();
            } else if (existing.body?.includes(digestMarker) && existing.state === presentation.state) {
              core.summary.addRaw(`Weekly maintenance issue #${existing.number} is already current.`).addEOL();
            } else {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title: `Weekly MTGO maintenance — ${week}`,
                body: details,
                state: presentation.state,
              });
              if (!existing.body?.includes(digestMarker)) {
                const comments = {
                  blocked: `The weekly diagnostics changed and are blocked. Inspect the updated handoff from [run ${context.runId}](${runUrl}).`,
                  awaiting_owner_start: `A new verified weekly handoff is available from [run ${context.runId}](${runUrl}). If a review is already active, stop and inspect why its fixed production subject changed.`,
                  completed: `Machine diagnostics changed, but the accepted weekly review subject is unchanged. Completion remains valid after [run ${context.runId}](${runUrl}).`,
                  revalidation_required: `The recorded weekly completion subject no longer matches. Inspect the exact mismatch from [run ${context.runId}](${runUrl}) before continuing.`,
                };
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: comments[readiness.status],
                });
              }
              core.summary.addRaw(`Updated weekly maintenance issue #${existing.number}.`).addEOL();
            }
            await core.summary.write({ overwrite: false });

  notify:
    name: Record deduplicated MTGO production failure
    if: >-
      always() && github.ref == 'refs/heads/master' &&
      (needs.fetch.result == 'failure' || needs.build.result == 'failure' || needs.publish.result == 'failure')
    needs:
      - fetch
      - build
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Identify the failed production stage
        id: failed-stage
        shell: bash
        env:
          FETCH_RESULT: ${{ needs.fetch.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          if [ "$FETCH_RESULT" = "failure" ]; then
            STAGE="fetch"
          elif [ "$BUILD_RESULT" = "failure" ]; then
            STAGE="build"
          elif [ "$PUBLISH_RESULT" = "failure" ]; then
            STAGE="publish"
          else
            echo "No failed production stage was available for notification." >&2
            exit 1
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "kind=stage-failure" >> "$GITHUB_OUTPUT"

      - name: Create or update the stage failure issue
        uses: actions/github-script@v7.0.1
        env:
          FAILED_STAGE: ${{ steps.failed-stage.outputs.stage }}
          FAILURE_KIND: ${{ steps.failed-stage.outputs.kind }}
        with:
          script: |
            const stage = process.env.FAILED_STAGE;
            const failureKind = process.env.FAILURE_KIND || "stage-failure";
            const marker = `<!-- mtgo-production-failure:${stage} -->`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const details = [
              marker,
              "## MTGO production failure",
              "",
              `- Failed stage: \`${stage}\``,
              `- Failure kind: \`${failureKind}\``,
              `- Commit: \`${context.sha}\``,
              `- Workflow run: [${context.runId}](${runUrl})`,
              "",
              "This issue is updated for repeated failures of the same stage. Review the linked workflow logs for the diagnostic details.",
            ].join("\n");
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: details,
              });
              core.summary.addRaw(`Updated failure issue #${existing.number} for ${stage}.`).addEOL();
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `MTGO production ${stage} failure`,
                body: details,
              });
              core.summary.addRaw(`Created failure issue #${created.data.number} for ${stage}.`).addEOL();
            }
            await core.summary.write({ overwrite: false });
