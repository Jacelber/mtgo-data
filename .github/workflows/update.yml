name: MTGO production data update

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 20 * * *"

permissions:
  contents: read

concurrency:
  group: production-data-update
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch MTGO candidate data
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      PYTHONPATH: src
      MTGO_EVENT_FORMATS: "standard legacy pioneer pauper vintage modern"
      MTGO_PRODUCT_FORMATS: "standard modern"
    steps:
      - name: Check out full history without persisted credentials
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Install pinned runtime and validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Verify clean-checkout code and committed baseline
        run: python -B -m pytest

      - name: Snapshot production data baseline
        run: python -B validate_production_candidate.py snapshot --output "$RUNNER_TEMP/production-baseline.json"

      - name: Find a compatible incomplete fetch checkpoint
        id: previous-checkpoint
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "mtgo-fetch-checkpoint",
                per_page: 100,
              },
            );
            const checkpoint = artifacts
              .filter(
                (artifact) =>
                  !artifact.expired &&
                  artifact.workflow_run?.head_branch === "master" &&
                  artifact.workflow_run?.head_sha === context.sha,
              )
              .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at))[0];
            core.setOutput("found", checkpoint ? "true" : "false");
            core.setOutput("run-id", checkpoint ? String(checkpoint.workflow_run.id) : "");

      - name: Download compatible incomplete fetch checkpoint
        if: steps.previous-checkpoint.outputs.found == 'true'
        uses: actions/download-artifact@v8.0.1
        with:
          name: mtgo-fetch-checkpoint
          path: ${{ runner.temp }}/mtgo-fetch-resume
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous-checkpoint.outputs.run-id }}

      - name: Verify and restore compatible incomplete fetch checkpoint
        if: steps.previous-checkpoint.outputs.found == 'true'
        shell: bash
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/mtgo-fetch-resume"
          (
            cd "$ARTIFACT_DIR"
            sha256sum --check SHA256SUMS
          )
          python -B mtgo_fetch_checkpoint.py validate \
            --checkpoint "$ARTIFACT_DIR/checkpoint.json" \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --event-formats "$MTGO_EVENT_FORMATS" --match-formats "$MTGO_PRODUCT_FORMATS"
          cmp "$ARTIFACT_DIR/production-baseline.json" "$RUNNER_TEMP/production-baseline.json"
          if tar -tf "$ARTIFACT_DIR/fetched-inputs.tar" | grep -Ev '^(data/|fetched\.txt$)'; then
            echo "Fetch checkpoint contains a path outside the input boundary." >&2
            exit 1
          fi
          tar -xf "$ARTIFACT_DIR/fetched-inputs.tar" -C "$GITHUB_WORKSPACE"
          cp "$ARTIFACT_DIR/checkpoint.json" "$RUNNER_TEMP/mtgo-fetch-checkpoint.json"

      - name: Prepare fetch checkpoint
        id: checkpoint
        shell: bash
        run: |
          CHECKPOINT="$RUNNER_TEMP/mtgo-fetch-checkpoint.json"
          if [ ! -f "$CHECKPOINT" ]; then
            python -B mtgo_fetch_checkpoint.py initialize \
              --checkpoint "$CHECKPOINT" --repository "$GITHUB_REPOSITORY" \
              --commit "$GITHUB_SHA" --event-formats "$MTGO_EVENT_FORMATS" \
              --match-formats "$MTGO_PRODUCT_FORMATS"
          fi
          python -B mtgo_fetch_checkpoint.py validate \
            --checkpoint "$CHECKPOINT" --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --event-formats "$MTGO_EVENT_FORMATS" \
            --match-formats "$MTGO_PRODUCT_FORMATS"

      - name: Fetch every pending MTGO input operation
        shell: bash
        run: |
          CHECKPOINT="$RUNNER_TEMP/mtgo-fetch-checkpoint.json"
          STATUS=0
          for FORMAT in $MTGO_EVENT_FORMATS; do
            OPERATION="events/${FORMAT}"
            if python -B mtgo_fetch_checkpoint.py is-complete \
              --checkpoint "$CHECKPOINT" --repository "$GITHUB_REPOSITORY" \
              --commit "$GITHUB_SHA" --event-formats "$MTGO_EVENT_FORMATS" \
              --match-formats "$MTGO_PRODUCT_FORMATS" --operation "$OPERATION"; then
              echo "Reusing completed MTGO event collection for ${FORMAT}."
              continue
            fi
            echo "Collecting MTGO event raw data for ${FORMAT}."
            if python -B -m mtgmeta.mtgo --format "$FORMAT" fetch-events; then
              python -B mtgo_fetch_checkpoint.py complete \
                --checkpoint "$CHECKPOINT" --repository "$GITHUB_REPOSITORY" \
                --commit "$GITHUB_SHA" --event-formats "$MTGO_EVENT_FORMATS" \
                --match-formats "$MTGO_PRODUCT_FORMATS" --operation "$OPERATION"
            else
              STATUS=1
            fi
          done
          for FORMAT in $MTGO_PRODUCT_FORMATS; do
            OPERATION="matches/${FORMAT}"
            if python -B mtgo_fetch_checkpoint.py is-complete \
              --checkpoint "$CHECKPOINT" --repository "$GITHUB_REPOSITORY" \
              --commit "$GITHUB_SHA" --event-formats "$MTGO_EVENT_FORMATS" \
              --match-formats "$MTGO_PRODUCT_FORMATS" --operation "$OPERATION"; then
              echo "Reusing completed Videre match collection for ${FORMAT}."
              continue
            fi
            echo "Collecting Videre match data for ${FORMAT}."
            if python -B -m mtgmeta.mtgo --format "$FORMAT" fetch-matches; then
              python -B mtgo_fetch_checkpoint.py complete \
                --checkpoint "$CHECKPOINT" --repository "$GITHUB_REPOSITORY" \
                --commit "$GITHUB_SHA" --event-formats "$MTGO_EVENT_FORMATS" \
                --match-formats "$MTGO_PRODUCT_FORMATS" --operation "$OPERATION"
            else
              STATUS=1
            fi
          done
          exit "$STATUS"

      - name: Package resumable fetch checkpoint
        if: failure() && steps.checkpoint.outcome == 'success'
        shell: bash
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/mtgo-fetch-checkpoint"
          mkdir -p "$ARTIFACT_DIR"
          tar -cf "$ARTIFACT_DIR/fetched-inputs.tar" data fetched.txt
          cp "$RUNNER_TEMP/production-baseline.json" "$ARTIFACT_DIR/production-baseline.json"
          cp "$RUNNER_TEMP/mtgo-fetch-checkpoint.json" "$ARTIFACT_DIR/checkpoint.json"
          (
            cd "$ARTIFACT_DIR"
            sha256sum fetched-inputs.tar production-baseline.json checkpoint.json > SHA256SUMS
          )

      - name: Upload immutable resumable fetch checkpoint
        if: failure() && steps.checkpoint.outcome == 'success'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: mtgo-fetch-checkpoint
          path: ${{ runner.temp }}/mtgo-fetch-checkpoint
          if-no-files-found: error
          retention-days: 7

      - name: Package fetched candidate for the build job
        shell: bash
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/mtgo-fetch-candidate"
          mkdir -p "$ARTIFACT_DIR"
          tar -cf "$ARTIFACT_DIR/fetched-inputs.tar" data fetched.txt
          cp "$RUNNER_TEMP/production-baseline.json" "$ARTIFACT_DIR/production-baseline.json"
          (
            cd "$ARTIFACT_DIR"
            sha256sum fetched-inputs.tar production-baseline.json > SHA256SUMS
          )

      - name: Upload immutable fetched candidate
        uses: actions/upload-artifact@v4.6.2
        with:
          name: mtgo-fetch-candidate
          path: ${{ runner.temp }}/mtgo-fetch-candidate
          if-no-files-found: error
          retention-days: 1

      - name: Write fetch summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MTGO production fetch"
            echo
            echo "- Job result: ${{ job.status }}"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Candidate transfer: immutable \`mtgo-fetch-candidate\` artifact"
            echo "- Restart transfer: a same-commit, seven-day \`mtgo-fetch-checkpoint\` artifact only after incomplete collection"
            echo "- Event formats: ${MTGO_EVENT_FORMATS}"
            echo "- Match formats: ${MTGO_PRODUCT_FORMATS}"
            echo "- The checkpoint is verified before reuse and is never sent to build or publish."
            echo "- No repository write permission is available to this job; Actions read is limited to locating a prior checkpoint."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and validate MTGO candidate
    if: github.ref == 'refs/heads/master'
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PYTHONPATH: src
      MTGO_PRODUCT_FORMATS: "standard modern"
      MTGO_HIERARCHY_FORMATS: "standard modern"
    steps:
      - name: Check out full history without persisted credentials
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Install pinned runtime and validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Download immutable fetched candidate
        uses: actions/download-artifact@v8.0.1
        with:
          name: mtgo-fetch-candidate
          path: ${{ runner.temp }}/mtgo-fetch-candidate

      - name: Verify and restore fetched candidate
        shell: bash
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/mtgo-fetch-candidate"
          (
            cd "$ARTIFACT_DIR"
            sha256sum --check SHA256SUMS
          )
          tar -xf "$ARTIFACT_DIR/fetched-inputs.tar" -C "$GITHUB_WORKSPACE"

      - name: Build product statistics
        shell: bash
        run: |
          for FORMAT in $MTGO_PRODUCT_FORMATS; do
            echo "Building MTGO statistics for ${FORMAT}."
            python -B -m mtgmeta.mtgo --format "$FORMAT" build-statistics
          done

      - name: Build product matchup statistics
        shell: bash
        run: |
          for FORMAT in $MTGO_PRODUCT_FORMATS; do
            echo "Building matchup statistics for ${FORMAT}."
            python -B -m mtgmeta.mtgo --format "$FORMAT" build-matchups
          done

      - name: Build product completeness reports
        shell: bash
        run: |
          for FORMAT in $MTGO_PRODUCT_FORMATS; do
            echo "Building MTGO completeness reports for ${FORMAT}."
            python -B -m mtgmeta.mtgo --format "$FORMAT" build-completeness
          done

      - name: Build weekly Top 8 decklists
        shell: bash
        run: |
          for FORMAT in $MTGO_PRODUCT_FORMATS; do
            echo "Building weekly MTGO Top 8 data for ${FORMAT}."
            python -B -m mtgmeta.mtgo --format "$FORMAT" build-top8
          done

      - name: Generate Weekly Pickup candidates when absent
        continue-on-error: true
        shell: bash
        run: |
          STATUS=0
          for FORMAT in $MTGO_PRODUCT_FORMATS; do
            echo "Preparing Weekly Pickup candidates for ${FORMAT}."
            python -B -m mtgmeta.mtgo --format "$FORMAT" pickup candidates --if-absent || STATUS=$?
          done
          exit "$STATUS"

      - name: Generate maintained hierarchy catalogs
        shell: bash
        run: |
          for FORMAT in $MTGO_HIERARCHY_FORMATS; do
            echo "Generating archetype hierarchy for ${FORMAT}."
            python -B -m mtgmeta.mtgo --format "$FORMAT" generate-hierarchy
          done

      - name: Generate product metadata
        shell: bash
        run: |
          for FORMAT in $MTGO_PRODUCT_FORMATS; do
            echo "Generating MTGO metadata for ${FORMAT}."
            python -B -m mtgmeta.mtgo --format "$FORMAT" generate-metadata
          done

      - name: Generate format-first consumer catalog
        run: python -B -m mtgmeta.catalog --root .

      - name: Generate and strictly validate product classification diagnostics
        shell: bash
        run: |
          for FORMAT in $MTGO_PRODUCT_FORMATS; do
            echo "Generating classification diagnostics for ${FORMAT}."
            python -B -m mtgmeta.mtgo --format "$FORMAT" classification-reports --strict
          done

      - name: Validate production candidate scope and data increments
        run: >-
          python -B validate_production_candidate.py validate
          --baseline "$RUNNER_TEMP/mtgo-fetch-candidate/production-baseline.json"

      - name: Validate repository files and references
        run: python -B validate_repository.py

      - name: Validate product archetype rules
        shell: bash
        run: |
          for FORMAT in $MTGO_PRODUCT_FORMATS; do
            python -B validate_rules.py "my_archetypes/${FORMAT}.yaml"
          done

      - name: Validate generated JSON schemas
        run: python -B validate_schemas.py

      - name: Package validated output for the publish job
        shell: bash
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/mtgo-build-candidate"
          mkdir -p "$ARTIFACT_DIR"
          tar -cf "$ARTIFACT_DIR/validated-output.tar" data stats reports fetched.txt
          (
            cd "$ARTIFACT_DIR"
            sha256sum validated-output.tar > SHA256SUMS
          )

      - name: Upload immutable validated output
        uses: actions/upload-artifact@v4.6.2
        with:
          name: mtgo-build-candidate
          path: ${{ runner.temp }}/mtgo-build-candidate
          if-no-files-found: error
          retention-days: 1

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MTGO production build and validation"
            echo
            echo "- Job result: ${{ job.status }}"
            echo "- Candidate transfer: verified \`mtgo-fetch-candidate\` input and immutable \`mtgo-build-candidate\` output"
            echo "- Product formats: ${MTGO_PRODUCT_FORMATS}"
            echo "- Hierarchy formats: ${MTGO_HIERARCHY_FORMATS}"
            echo "- Validation layers: production candidate acceptance, repository, rule, and Schema validation."
            echo "- No repository write permission is available to this job."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish validated MTGO data
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out full history for publication
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download immutable validated output
        uses: actions/download-artifact@v8.0.1
        with:
          name: mtgo-build-candidate
          path: ${{ runner.temp }}/mtgo-build-candidate

      - name: Verify and restore validated output
        shell: bash
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/mtgo-build-candidate"
          (
            cd "$ARTIFACT_DIR"
            sha256sum --check SHA256SUMS
          )
          if tar -tf "$ARTIFACT_DIR/validated-output.tar" | grep -Ev '^(data/|stats/|reports/|fetched\.txt$)'; then
            echo "Validated output contains a path outside the publication boundary." >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "Publication checkout is not clean before restoring validated output." >&2
            git status --short >&2
            exit 1
          fi
          tar -xf "$ARTIFACT_DIR/validated-output.tar" -C "$GITHUB_WORKSPACE"

      - name: Commit and push generated changes
        id: publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- data/ stats/ reports/ fetched.txt
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "No generated changes to publish."
            exit 0
          fi
          git commit -m "chore: update MTGO production data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify published master commit and clean workspace
        id: verify
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Production workspace is not clean after publication." >&2
            git status --short >&2
            exit 1
          fi
          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "Published master mismatch: local=$LOCAL_SHA remote=$REMOTE_SHA" >&2
            exit 1
          fi
          echo "commit=$LOCAL_SHA" >> "$GITHUB_OUTPUT"
          echo "Published master verified at $LOCAL_SHA."

      - name: Dispatch Pages deployment for published data
        if: steps.publish.outputs.changed == 'true'
        uses: actions/github-script@v7.0.1
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "pages.yml",
              ref: "master",
            });

      - name: Write publication summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MTGO production publication"
            echo
            echo "- Job result: ${{ job.status }}"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Generated changes published: ${{ steps.publish.outputs.changed || 'not-reached' }}"
            echo "- Published commit verified: ${{ steps.verify.outputs.commit || 'not-reached' }}"
            echo "- Candidate transfer: verified immutable \`mtgo-build-candidate\` artifact"
            echo "- Publication boundary: data/, stats/, reports/, and fetched.txt only."
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Record deduplicated MTGO production failure
    if: >-
      always() && github.ref == 'refs/heads/master' &&
      (needs.fetch.result == 'failure' || needs.build.result == 'failure' || needs.publish.result == 'failure')
    needs:
      - fetch
      - build
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Identify the failed production stage
        id: failed-stage
        shell: bash
        env:
          FETCH_RESULT: ${{ needs.fetch.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          if [ "$FETCH_RESULT" = "failure" ]; then
            STAGE="fetch"
          elif [ "$BUILD_RESULT" = "failure" ]; then
            STAGE="build"
          elif [ "$PUBLISH_RESULT" = "failure" ]; then
            STAGE="publish"
          else
            echo "No failed production stage was available for notification." >&2
            exit 1
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Create or update the stage failure issue
        uses: actions/github-script@v7.0.1
        env:
          FAILED_STAGE: ${{ steps.failed-stage.outputs.stage }}
        with:
          script: |
            const stage = process.env.FAILED_STAGE;
            const marker = `<!-- mtgo-production-failure:${stage} -->`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const details = [
              marker,
              "## MTGO production failure",
              "",
              `- Failed stage: \`${stage}\``,
              `- Commit: \`${context.sha}\``,
              `- Workflow run: [${context.runId}](${runUrl})`,
              "",
              "This issue is updated for repeated failures of the same stage. Review the linked workflow logs for the diagnostic details.",
            ].join("\n");
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: details,
              });
              core.summary.addRaw(`Updated failure issue #${existing.number} for ${stage}.`).addEOL();
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `MTGO production ${stage} failure`,
                body: details,
              });
              core.summary.addRaw(`Created failure issue #${created.data.number} for ${stage}.`).addEOL();
            }
            await core.summary.write({ overwrite: false });
