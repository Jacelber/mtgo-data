name: Isolated dependency TLS verification
on:
  push:
    branches: [audit/isolated-tls-verification-2026-11-18]
    paths: [.github/workflows/isolated-tls-verification.yml]
permissions:
  contents: read
concurrency:
  group: isolated-tls-verification-2026-11-18
  cancel-in-progress: false
jobs:
  compare:
    if: github.repository == 'Jacelber/mtgo-data' && github.ref == 'refs/heads/audit/isolated-tls-verification-2026-11-18'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 1946b4ccaa2966f265186fe2fdc23c15e13a8ef5
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Create exact baseline and two-package candidate in temporary directories
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          baseline = Path("requirements.txt").read_text()
          assert baseline.count("certifi==2026.7.22") == 1
          assert baseline.count("urllib3==2.7.0") == 1
          candidate = baseline.replace("certifi==2026.7.22", "certifi==2026.10.23").replace("urllib3==2.7.0", "urllib3==2.8.0")
          root = Path(os.environ["RUNNER_TEMP"])
          (root / "baseline.txt").write_text(baseline)
          (root / "candidate.txt").write_text(candidate)
          PY
          for variant in baseline candidate; do
            python -m venv "$RUNNER_TEMP/$variant"
            "$RUNNER_TEMP/$variant/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: -r "$RUNNER_TEMP/$variant.txt"
            "$RUNNER_TEMP/$variant/bin/python" -m pip check
          done
      - name: Compare bounded read-only HTTPS probes with certificate verification enabled
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import json, os, socket, ssl, sys
          from urllib.parse import urlsplit
          import certifi, requests, urllib3
          
          urls = [
              "https://www.mtgo.com/decklists",
              "https://melee.gg/Tournament/View/434455",
              "https://api.scryfall.com/bulk-data",
              "https://mtgch.com/",
              "https://images.mtgch.com/",
          ]
          print(json.dumps({"python": sys.version, "openssl": ssl.OPENSSL_VERSION, "certifi": certifi.__version__, "urllib3": urllib3.__version__, "requests": requests.__version__, "proxy_variable_names_present": [k for k in ("HTTPS_PROXY", "HTTP_PROXY", "ALL_PROXY", "https_proxy", "http_proxy", "all_proxy") if os.environ.get(k)]}))
          results = []
          for url in urls:
              host = urlsplit(url).hostname
              result = {"url": url}
              try:
                  context = ssl.create_default_context(cafile=certifi.where())
                  with socket.create_connection((host, 443), timeout=15) as tcp:
                      with context.wrap_socket(tcp, server_hostname=host) as tls:
                          cert = tls.getpeercert()
                          result["tls"] = {"ok": True, "version": tls.version(), "issuer": cert.get("issuer"), "notAfter": cert.get("notAfter")}
              except Exception as e:
                  result["tls"] = {"ok": False, "error_type": type(e).__name__, "error": str(e)[:500]}
              try:
                  with requests.Session() as session:
                      session.max_redirects = 3
                      with session.get(url, timeout=(15, 20), stream=True, verify=certifi.where(), headers={"User-Agent": "mtgo-data-dependency-verification/1.0", "Accept": "*/*"}) as response:
                          sample = next(response.iter_content(chunk_size=1024), b"")
                          result["http"] = {"transport_ok": True, "status": response.status_code, "final_url": response.url, "sample_bytes": len(sample), "content_type": response.headers.get("content-type"), "content_encoding": response.headers.get("content-encoding")}
              except Exception as e:
                  result["http"] = {"transport_ok": False, "error_type": type(e).__name__, "error": str(e)[:500]}
              results.append(result)
              print(json.dumps(result), flush=True)
          print("NOTE: HTTP 403/404 is not a TLS validation failure; this probe does not verify full collection, source data, or production deployment.")
          with open(sys.argv[1], "w") as f:
              json.dump(results, f, indent=2)
          
          PY
          for variant in baseline candidate; do
            echo "=== $variant ==="
            timeout 240 "$RUNNER_TEMP/$variant/bin/python" "$RUNNER_TEMP/probe.py" "$RUNNER_TEMP/$variant.json"
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          old, new = (json.loads((root / (v + ".json")).read_text()) for v in ("baseline", "candidate"))
          regressions = []
          for before, after in zip(old, new):
              assert before["url"] == after["url"]
              for section, key in (("tls", "ok"), ("http", "transport_ok")):
                  if before[section][key] and not after[section][key]:
                      regressions.append({"url": after["url"], "section": section})
          print(json.dumps({"observed_transport_regressions": regressions, "candidate_all_direct_tls_verified": all(r["tls"]["ok"] for r in new)}, indent=2))
          assert not regressions, "Candidate transport regression needs investigation"
          assert all(r["tls"]["ok"] for r in new), "Not all candidate source certificates could be verified"
          PY
      - name: Confirm checkout remained unchanged
        if: always()
        run: git diff --exit-code && test -z "$(git status --porcelain)"
