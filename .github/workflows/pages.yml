name: Deploy or restore selected product
run-name: ${{ inputs.operation }} (${{ inputs.mode }})
on:
  workflow_dispatch:
    inputs:
      package:
        description: Exact archived product package
        required: true
        type: string
      operation:
        description: Stable operation identifier
        required: true
        type: string
      base:
        description: Current operation, empty for first deployment
        type: string
        default: ''
      mode:
        description: Existing authorized action
        type: choice
        options: [publish, recovery, resume]
        default: publish
      reason:
        description: Concrete recovery reason when applicable
        type: string
        default: ''
      automatic:
        description: Unattended publication; false only for an explicitly authorized task publication
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  request:
    if: github.ref == 'refs/heads/master' && inputs.mode != 'resume'
    runs-on: ubuntu-latest
    environment: product-archive
    outputs:
      allowed: ${{ steps.request.outputs.allowed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Register request before writer queue
        id: request
        env:
          ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
          PACKAGE: ${{ inputs.package }}
          OPERATION: ${{ inputs.operation }}
          BASE: ${{ inputs.base }}
          MODE: ${{ inputs.mode }}
          REASON: ${{ inputs.reason }}
          AUTOMATIC: ${{ inputs.automatic }}
        run: |
          flags=()
          if [ "$AUTOMATIC" = true ]; then flags+=(--automatic); fi
          if [ "$MODE" = recovery ]; then flags+=(--recovery --reason "$REASON"); fi
          python tools/pages_writer.py --target Jacelber/mtgo-data --operation "$OPERATION" request --package "$PACKAGE" --base "$BASE" "${flags[@]}"
  deploy:
    name: Deploy selected product
    needs: request
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && ((needs.request.result == 'success' && needs.request.outputs.allowed == 'true') || inputs.mode == 'resume') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-pages
    concurrency:
      group: pages-writer
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      deployments: read
      pages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
      PACKAGE: ${{ inputs.package }}
      OPERATION: ${{ inputs.operation }}
      BASE: ${{ inputs.base }}
      MODE: ${{ inputs.mode }}
      AUTOMATIC: ${{ inputs.automatic }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Claim and retrieve selected candidate
        id: candidate
        run: |
          flags=()
          if [ "$AUTOMATIC" = true ]; then flags+=(--automatic); fi
          if [ "$MODE" = recovery ]; then flags+=(--recovery); fi
          python tools/pages_writer.py --target Jacelber/mtgo-data --operation "$OPERATION" claim --package "$PACKAGE" --base "$BASE" --output "$RUNNER_TEMP/selected-transport" "${flags[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.candidate.outputs.phase == 'claimed'
        id: transport
        with:
          name: github-pages
          path: ${{ steps.candidate.outputs.transport }}
          retention-days: 1
          if-no-files-found: error
      - name: Send selected package once
        if: steps.candidate.outputs.phase == 'claimed'
        env:
          ARTIFACT_ID: ${{ steps.transport.outputs.artifact-id }}
        run: python tools/pages_writer.py --target Jacelber/mtgo-data --operation "$OPERATION" send --artifact-id "$ARTIFACT_ID"
      - name: Confirm existing remote operation and selected product
        if: steps.candidate.outputs.phase != 'paused'
        env:
          CANDIDATE: ${{ steps.candidate.outputs.candidate }}
        run: python tools/pages_writer.py --target Jacelber/mtgo-data --operation "$OPERATION" resume --candidate "$CANDIDATE" --wait-seconds 50
