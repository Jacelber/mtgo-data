name: Allowlisted Pages deployment

on:
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "assets/**"
      - "build_pages_artifact.py"
      - "configs/pages_publication.json"
      - "data/**"
      - "data_raw/**"
      - "fetched.txt"
      - "index.html"
      - "melee/**"
      - "reports/**"
      - "stats/**"
      - "tests/fixtures/melee/434455_compatibility_manifest.json"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/pages.yml"
      - "assets/**"
      - "build_pages_artifact.py"
      - "configs/pages_publication.json"
      - "data/**"
      - "data_raw/**"
      - "fetched.txt"
      - "index.html"
      - "melee/**"
      - "reports/**"
      - "stats/**"
      - "tests/fixtures/melee/434455_compatibility_manifest.json"
  workflow_dispatch:
    inputs:
      publication_commit:
        description: "Published production commit; leave empty for an authorized manual deployment"
        required: false
        type: string
      producer_run_id:
        description: "MTGO production workflow run ID"
        required: false
        type: string
      producer_run_attempt:
        description: "MTGO production workflow attempt"
        required: false
        type: string
      source_commit:
        description: "Master commit used to build the production candidate"
        required: false
        type: string
      generation_subject_sha256:
        description: "Generation subject SHA-256"
        required: false
        type: string
      validated_output_sha256:
        description: "Validated output artifact SHA-256"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify allowlisted site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Classify optional production evidence
        id: dispatch-evidence
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          PUBLICATION_COMMIT: ${{ inputs.publication_commit }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          GENERATION_SUBJECT_SHA256: ${{ inputs.generation_subject_sha256 }}
          VALIDATED_OUTPUT_SHA256: ${{ inputs.validated_output_sha256 }}
        run: |
          VALUES=(
            "$PUBLICATION_COMMIT" "$PRODUCER_RUN_ID" "$PRODUCER_RUN_ATTEMPT"
            "$SOURCE_COMMIT" "$GENERATION_SUBJECT_SHA256" "$VALIDATED_OUTPUT_SHA256"
          )
          PROVIDED=0
          for VALUE in "${VALUES[@]}"; do
            if [ -n "$VALUE" ]; then
              PROVIDED=$((PROVIDED + 1))
            fi
          done
          if [ "$PROVIDED" -eq 0 ]; then
            echo "production=false" >> "$GITHUB_OUTPUT"
          elif [ "$PROVIDED" -eq "${#VALUES[@]}" ]; then
            if [ "$EVENT_NAME" != "workflow_dispatch" ] ||
               [ "$EVENT_REF" != "refs/heads/master" ]; then
              echo "Production evidence is accepted only for a master workflow dispatch." >&2
              exit 1
            fi
            echo "production=true" >> "$GITHUB_OUTPUT"
          else
            echo "Production dispatch evidence is incomplete." >&2
            exit 1
          fi

      - name: Check out full history without persisted credentials
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Download exact validated production output
        if: steps.dispatch-evidence.outputs.production == 'true'
        uses: actions/download-artifact@v4.3.0
        with:
          name: mtgo-build-candidate
          path: ${{ runner.temp }}/mtgo-build-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.producer_run_id }}

      - name: Admit exact production publication evidence
        if: steps.dispatch-evidence.outputs.production == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_COMMIT: ${{ inputs.publication_commit }}
          PAGES_SUBJECT_COMMIT: ${{ github.sha }}
          PRODUCTION_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCTION_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
          PRODUCTION_SOURCE_COMMIT: ${{ inputs.source_commit }}
          GENERATION_SUBJECT_SHA256: ${{ inputs.generation_subject_sha256 }}
          VALIDATED_OUTPUT_SHA256: ${{ inputs.validated_output_sha256 }}
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/mtgo-build-candidate"
          (
            cd "$ARTIFACT_DIR"
            sha256sum --check SHA256SUMS
          )
          if tar -tf "$ARTIFACT_DIR/validated-output.tar" | grep -Ev '^(data/|stats/|reports/|fetched\.txt$)'; then
            echo "Validated output contains a path outside the production boundary." >&2
            exit 1
          fi
          ARTIFACT_SHA="$(sha256sum "$ARTIFACT_DIR/validated-output.tar" | awk '{print $1}')"
          SUBJECT_SHA="$(tr -d '\r\n' < "$ARTIFACT_DIR/generation-subject.txt")"
          if [ "$ARTIFACT_SHA" != "$VALIDATED_OUTPUT_SHA256" ] ||
             [ "$SUBJECT_SHA" != "$GENERATION_SUBJECT_SHA256" ]; then
            echo "Downloaded production evidence does not match the dispatch." >&2
            exit 1
          fi
          VALIDATED_TREE="$RUNNER_TEMP/validated-output"
          mkdir -p "$VALIDATED_TREE"
          tar -xf "$ARTIFACT_DIR/validated-output.tar" -C "$VALIDATED_TREE"
          for DIRECTORY in data stats reports; do
            if ! diff --recursive --brief --no-dereference \
              "$VALIDATED_TREE/$DIRECTORY" "$DIRECTORY"; then
              echo "Published commit content does not match the validated output." >&2
              exit 1
            fi
          done
          if ! diff --brief --no-dereference \
            "$VALIDATED_TREE/fetched.txt" fetched.txt; then
            echo "Published commit content does not match the validated output." >&2
            exit 1
          fi
          python -B ci_master_admission.py --verify-production-evidence

      - name: Build fresh allowlisted Pages artifact
        run: >-
          python -B build_pages_artifact.py
          --output "$RUNNER_TEMP/pages-site"
          --report "$RUNNER_TEMP/pages-report.json"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    name: Deploy verified site
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirm the three public resources are available
        shell: bash
        run: |
          BASE_URL="${{ steps.deployment.outputs.page_url }}"
          for PATHNAME in index.html melee/index.html stats/catalog.json; do
            curl --fail --silent --show-error --retry 5 --retry-delay 2 \
              --retry-all-errors "${BASE_URL%/}/${PATHNAME}" > /dev/null
          done
