name: Allowlisted Pages deployment

on:
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "assets/**"
      - "build_pages_artifact.py"
      - "configs/pages_publication.json"
      - "configs/formats.yaml"
      - "src/mtgmeta/config.py"
      - "src/mtgmeta/catalog.py"
      - "requirements.txt"
      - "data/**"
      - "data_raw/**"
      - "fetched.txt"
      - "index.html"
      - "melee/**"
      - "reports/**"
      - "stats/**"
      - "schemas/landing-card-image-cache.schema.json"
      - "src/mtgmeta/card_names.py"
      - "src/mtgmeta/data/om1_spm_aliases.json"
      - "tests/fixtures/melee/434455_compatibility_manifest.json"
      - "tools/build_landing_card_image_cache.py"
      - "tools/build_pages_candidate_measurement.py"
      - "tools/build_simple_card_localization.py"
      - "tools/select_trusted_pages_artifact.py"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/pages.yml"
      - "assets/**"
      - "build_pages_artifact.py"
      - "configs/pages_publication.json"
      - "configs/formats.yaml"
      - "src/mtgmeta/config.py"
      - "src/mtgmeta/catalog.py"
      - "requirements.txt"
      - "data/**"
      - "data_raw/**"
      - "fetched.txt"
      - "index.html"
      - "melee/**"
      - "reports/**"
      - "stats/**"
      - "schemas/landing-card-image-cache.schema.json"
      - "src/mtgmeta/card_names.py"
      - "src/mtgmeta/data/om1_spm_aliases.json"
      - "tests/fixtures/melee/434455_compatibility_manifest.json"
      - "tools/build_landing_card_image_cache.py"
      - "tools/build_pages_candidate_measurement.py"
      - "tools/build_simple_card_localization.py"
      - "tools/select_trusted_pages_artifact.py"
  workflow_dispatch:
    inputs:
      publication_commit:
        description: "Published production commit; leave empty for an authorized manual deployment"
        required: false
        type: string
      producer_run_id:
        description: "MTGO production workflow run ID"
        required: false
        type: string
      producer_run_attempt:
        description: "MTGO production workflow attempt"
        required: false
        type: string
      source_commit:
        description: "Master commit used to build the production candidate"
        required: false
        type: string
      generation_subject_sha256:
        description: "Generation subject SHA-256"
        required: false
        type: string
      validated_output_sha256:
        description: "Validated output artifact SHA-256"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  localization-cache:
    name: Prepare simple card localization cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out localization inputs without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install pinned registry dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compute simple card localization cache subject
        id: localization-cache-subject
        shell: bash
        run: >-
          python -B tools/build_simple_card_localization.py subject
          --github-output "$GITHUB_OUTPUT"
          > "$RUNNER_TEMP/localization-cache-subject.json"

      - name: Find exact trusted simple card localization cache
        id: localization-cache-artifact
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: simple-card-localization-${{ steps.localization-cache-subject.outputs.sha256 }}
        run: >-
          python -B tools/select_trusted_pages_artifact.py
          --repository "${{ github.repository }}"
          --artifact-name "$ARTIFACT_NAME"
          --github-output "$GITHUB_OUTPUT"

      - name: Download exact simple card localization cache
        id: localization-cache-download
        if: steps.localization-cache-artifact.outputs.found == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.localization-cache-artifact.outputs.artifact-name }}
          path: ${{ runner.temp }}/card-localization-exact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.localization-cache-artifact.outputs.run-id }}

      - name: Verify exact simple card localization cache
        id: localization-cache-verify
        if: steps.localization-cache-download.outcome == 'success'
        continue-on-error: true
        run: >-
          python -B tools/build_simple_card_localization.py verify
          --output "$RUNNER_TEMP/card-localization-exact"

      - name: Find trusted current-demand localization seed
        id: localization-seed-artifact
        if: steps.localization-cache-verify.outcome != 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -B tools/select_trusted_pages_artifact.py
          --repository "${{ github.repository }}"
          --artifact-name "simple-card-localization-seed-v1"
          --github-output "$GITHUB_OUTPUT"

      - name: Download trusted current-demand localization seed
        id: localization-seed-download
        if: steps.localization-seed-artifact.outputs.found == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.localization-seed-artifact.outputs.artifact-name }}
          path: ${{ runner.temp }}/card-localization-seed
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.localization-seed-artifact.outputs.run-id }}

      - name: Verify trusted current-demand localization seed
        id: localization-seed-verify
        if: steps.localization-seed-download.outcome == 'success'
        continue-on-error: true
        run: >-
          python -B tools/build_simple_card_localization.py verify-seed
          --output "$RUNNER_TEMP/card-localization-seed"

      - name: Find compatible trusted exact cache for seed bootstrap
        id: localization-bootstrap-artifact
        if: >-
          steps.localization-cache-verify.outcome != 'success' &&
          steps.localization-seed-verify.outcome != 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -B tools/select_trusted_pages_artifact.py
          --repository "${{ github.repository }}"
          --artifact-name-regex '^simple-card-localization-[0-9a-f]{64}$'
          --github-output "$GITHUB_OUTPUT"

      - name: Download compatible trusted exact cache for seed bootstrap
        id: localization-bootstrap-download
        if: steps.localization-bootstrap-artifact.outputs.found == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.localization-bootstrap-artifact.outputs.artifact-name }}
          path: ${{ runner.temp }}/card-localization-bootstrap-bundle
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.localization-bootstrap-artifact.outputs.run-id }}

      - name: Bootstrap current-demand seed from compatible trusted exact cache
        id: localization-bootstrap
        if: steps.localization-bootstrap-download.outcome == 'success'
        continue-on-error: true
        run: >-
          python -B tools/build_simple_card_localization.py bootstrap-seed
          --bundle "$RUNNER_TEMP/card-localization-bootstrap-bundle"
          --source-commit "${{ steps.localization-bootstrap-artifact.outputs.head-sha }}"
          --output "$RUNNER_TEMP/card-localization-bootstrap-seed"
          --github-output "$GITHUB_OUTPUT"

      - name: Build missing simple card localization cache
        if: steps.localization-cache-verify.outcome != 'success'
        shell: bash
        run: |
          SEED_ARGS=()
          if [ "${{ steps.localization-seed-verify.outcome }}" = "success" ]; then
            SEED_ARGS=(--seed "$RUNNER_TEMP/card-localization-seed")
          elif [ "${{ steps.localization-bootstrap.outputs.usable }}" = "true" ]; then
            SEED_ARGS=(--seed "$RUNNER_TEMP/card-localization-bootstrap-seed")
          fi
          python -B tools/build_simple_card_localization.py build \
            --output "$RUNNER_TEMP/card-localization" \
            --summary "$GITHUB_STEP_SUMMARY" \
            "${SEED_ARGS[@]}"

      - name: Materialize verified exact simple card localization cache
        if: steps.localization-cache-verify.outcome == 'success'
        run: >-
          mv "$RUNNER_TEMP/card-localization-exact"
          "$RUNNER_TEMP/card-localization"

      - name: Verify final simple card localization cache
        run: >-
          python -B tools/build_simple_card_localization.py verify
          --output "$RUNNER_TEMP/card-localization"

      - name: Retain new simple card localization cache
        if: >-
          steps.localization-cache-verify.outcome != 'success' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simple-card-localization-${{ steps.localization-cache-subject.outputs.sha256 }}
          path: ${{ runner.temp }}/card-localization
          if-no-files-found: error
          retention-days: 90

      - name: Create next current-demand localization seed
        if: >-
          steps.localization-cache-verify.outcome != 'success' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/master'
        run: >-
          python -B tools/build_simple_card_localization.py seed
          --bundle "$RUNNER_TEMP/card-localization"
          --output "$RUNNER_TEMP/card-localization-next-seed"

      - name: Retain next current-demand localization seed
        if: >-
          steps.localization-cache-verify.outcome != 'success' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simple-card-localization-seed-v1
          path: ${{ runner.temp }}/card-localization-next-seed
          if-no-files-found: error
          retention-days: 90

      - name: Hand verified localization to the allowlisted build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simple-card-localization-handoff-${{ github.run_attempt }}
          path: ${{ runner.temp }}/card-localization
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build and verify allowlisted site
    needs: localization-cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Classify optional production evidence
        id: dispatch-evidence
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          PUBLICATION_COMMIT: ${{ inputs.publication_commit }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          GENERATION_SUBJECT_SHA256: ${{ inputs.generation_subject_sha256 }}
          VALIDATED_OUTPUT_SHA256: ${{ inputs.validated_output_sha256 }}
        run: |
          VALUES=(
            "$PUBLICATION_COMMIT" "$PRODUCER_RUN_ID" "$PRODUCER_RUN_ATTEMPT"
            "$SOURCE_COMMIT" "$GENERATION_SUBJECT_SHA256" "$VALIDATED_OUTPUT_SHA256"
          )
          PROVIDED=0
          for VALUE in "${VALUES[@]}"; do
            if [ -n "$VALUE" ]; then
              PROVIDED=$((PROVIDED + 1))
            fi
          done
          if [ "$PROVIDED" -eq 0 ]; then
            echo "production=false" >> "$GITHUB_OUTPUT"
          elif [ "$PROVIDED" -eq "${#VALUES[@]}" ]; then
            if [ "$EVENT_NAME" != "workflow_dispatch" ] ||
               [ "$EVENT_REF" != "refs/heads/master" ]; then
              echo "Production evidence is accepted only for a master workflow dispatch." >&2
              exit 1
            fi
            echo "production=true" >> "$GITHUB_OUTPUT"
          else
            echo "Production dispatch evidence is incomplete." >&2
            exit 1
          fi

      - name: Check out full history without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install pinned registry dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Download exact validated production output
        if: steps.dispatch-evidence.outputs.production == 'true'
        uses: actions/download-artifact@v4.3.0
        with:
          name: mtgo-build-candidate
          path: ${{ runner.temp }}/mtgo-build-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.producer_run_id }}

      - name: Admit exact production publication evidence
        if: steps.dispatch-evidence.outputs.production == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_COMMIT: ${{ inputs.publication_commit }}
          PAGES_SUBJECT_COMMIT: ${{ github.sha }}
          PRODUCTION_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCTION_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
          PRODUCTION_SOURCE_COMMIT: ${{ inputs.source_commit }}
          GENERATION_SUBJECT_SHA256: ${{ inputs.generation_subject_sha256 }}
          VALIDATED_OUTPUT_SHA256: ${{ inputs.validated_output_sha256 }}
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/mtgo-build-candidate"
          (
            cd "$ARTIFACT_DIR"
            sha256sum --check SHA256SUMS
          )
          if tar -tf "$ARTIFACT_DIR/validated-output.tar" | grep -Ev '^(data/|stats/|reports/|fetched\.txt$)'; then
            echo "Validated output contains a path outside the production boundary." >&2
            exit 1
          fi
          ARTIFACT_SHA="$(sha256sum "$ARTIFACT_DIR/validated-output.tar" | awk '{print $1}')"
          SUBJECT_SHA="$(tr -d '\r\n' < "$ARTIFACT_DIR/generation-subject.txt")"
          if [ "$ARTIFACT_SHA" != "$VALIDATED_OUTPUT_SHA256" ] ||
             [ "$SUBJECT_SHA" != "$GENERATION_SUBJECT_SHA256" ]; then
            echo "Downloaded production evidence does not match the dispatch." >&2
            exit 1
          fi
          VALIDATED_TREE="$RUNNER_TEMP/validated-output"
          mkdir -p "$VALIDATED_TREE"
          tar -xf "$ARTIFACT_DIR/validated-output.tar" -C "$VALIDATED_TREE"
          for DIRECTORY in data stats reports; do
            if ! diff --recursive --brief --no-dereference \
              "$VALIDATED_TREE/$DIRECTORY" "$DIRECTORY"; then
              echo "Published commit content does not match the validated output." >&2
              exit 1
            fi
          done
          if ! diff --brief --no-dereference \
            "$VALIDATED_TREE/fetched.txt" fetched.txt; then
            echo "Published commit content does not match the validated output." >&2
            exit 1
          fi
          python -B ci_master_admission.py --verify-production-evidence

      - name: Compute Landing card-image cache subject
        id: landing-card-cache-subject
        shell: bash
        run: >-
          python -B tools/build_landing_card_image_cache.py subject
          --github-output "$GITHUB_OUTPUT"
          --json-output "$RUNNER_TEMP/landing-card-cache-subject.json"

      - name: Find exact trusted Landing card-image cache
        id: landing-card-cache-artifact
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          ARTIFACT_NAME: landing-card-image-cache-${{ steps.landing-card-cache-subject.outputs.sha256 }}
        with:
          script: |
            const response = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: process.env.ARTIFACT_NAME,
              per_page: 100,
            });
            const artifact = response.data.artifacts
              .filter((item) => !item.expired)
              .filter((item) => item.workflow_run?.head_branch === "master")
              .sort((left, right) => right.id - left.id)[0];
            core.setOutput("cache-hit", artifact ? "true" : "false");
            core.setOutput("run-id", artifact?.workflow_run?.id ?? "");

      - name: Download exact Landing card-image cache
        if: steps.landing-card-cache-artifact.outputs.cache-hit == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: landing-card-image-cache-${{ steps.landing-card-cache-subject.outputs.sha256 }}
          path: ${{ runner.temp }}/landing-card-image-cache
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.landing-card-cache-artifact.outputs.run-id }}

      - name: Build missing Landing card-image cache
        if: steps.landing-card-cache-artifact.outputs.cache-hit != 'true'
        run: >-
          python -B tools/build_landing_card_image_cache.py build
          --output "$RUNNER_TEMP/landing-card-image-cache"

      - name: Verify exact Landing card-image cache
        run: >-
          python -B tools/build_landing_card_image_cache.py verify
          --output "$RUNNER_TEMP/landing-card-image-cache"

      - name: Download verified simple card localization handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: simple-card-localization-handoff-${{ github.run_attempt }}
          path: ${{ runner.temp }}/card-localization

      - name: Verify simple card localization handoff
        run: >-
          python -B tools/build_simple_card_localization.py verify
          --output "$RUNNER_TEMP/card-localization"

      - name: Retain new Landing card-image cache
        if: >-
          steps.landing-card-cache-artifact.outputs.cache-hit != 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: landing-card-image-cache-${{ steps.landing-card-cache-subject.outputs.sha256 }}
          path: ${{ runner.temp }}/landing-card-image-cache
          if-no-files-found: error
          retention-days: 90

      - name: Build fresh allowlisted Pages artifact
        env:
          PYTHONPATH: src
        run: >-
          python -B build_pages_artifact.py
          --output "$RUNNER_TEMP/pages-site"
          --report "$RUNNER_TEMP/pages-report.json"
          --summary "$GITHUB_STEP_SUMMARY"
          --overlay "landing_card_images=$RUNNER_TEMP/landing-card-image-cache"
          --overlay "card_localization=$RUNNER_TEMP/card-localization"

      - name: Recompute localization subject for candidate evidence
        if: github.event_name == 'pull_request'
        run: >-
          python -B tools/build_simple_card_localization.py subject
          > "$RUNNER_TEMP/localization-cache-subject.json"

      - name: Package deterministic Pages candidate measurement
        if: github.event_name == 'pull_request'
        run: >-
          python -B tools/build_pages_candidate_measurement.py package
          --site "$RUNNER_TEMP/pages-site"
          --pages-report "$RUNNER_TEMP/pages-report.json"
          --localization-subject "$RUNNER_TEMP/localization-cache-subject.json"
          --landing-subject "$RUNNER_TEMP/landing-card-cache-subject.json"
          --output "$RUNNER_TEMP/pages-candidate-measurement"

      - name: Upload measurement-only Pages candidate
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pages-candidate-measurement-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-candidate-measurement
          if-no-files-found: error
          retention-days: 7

      - name: Configure GitHub Pages
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages-site

  candidate-measurement-verification:
    name: Download and verify measurement-only Pages candidate
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the measured subject without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Download measurement-only Pages candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pages-candidate-measurement-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-candidate-measurement

      - name: Verify and restore measurement-only Pages candidate
        run: >-
          python -B tools/build_pages_candidate_measurement.py verify
          --input "$RUNNER_TEMP/pages-candidate-measurement"
          --extract "$RUNNER_TEMP/pages-candidate-restored"

  deploy:
    name: Deploy verified site
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirm the three public resources are available
        shell: bash
        run: |
          BASE_URL="${{ steps.deployment.outputs.page_url }}"
          for PATHNAME in index.html melee/index.html stats/catalog.json; do
            curl --fail --silent --show-error --retry 5 --retry-delay 2 \
              --retry-all-errors "${BASE_URL%/}/${PATHNAME}" > /dev/null
          done
