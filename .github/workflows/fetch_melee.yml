name: Melee production candidate

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: "Enabled and verified Melee event ID"
        required: true
        default: "434455"
        type: string

permissions:
  contents: write

concurrency:
  group: melee-production-${{ inputs.event_id }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build one reviewable Tabletop Major Events candidate
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src
      EVENT_ID: ${{ inputs.event_id }}
    steps:
      - name: Check out full history for candidate publication
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Install pinned development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Smoke the Melee and catalog commands plus privacy boundary
        run: >-
          python -B -m pytest
          --basetemp="${RUNNER_TEMP}/pytest-melee-baseline"
          tests/test_cli_smoke.py::test_melee_cli_smoke
          tests/test_cli_smoke.py::test_catalog_cli_smoke
          tests/test_melee_privacy_validation.py

      - name: Resolve verified whitelist format
        id: whitelist
        shell: bash
        env:
          EVENT_ID: ${{ inputs.event_id }}
        run: |
          EVENT_FORMAT="$(python -B -c 'from mtgmeta.melee.config import load_melee_event_registry; import sys; print(load_melee_event_registry("configs/melee_events.yaml").require_fetchable(sys.argv[1]).format)' "$EVENT_ID")"
          test -f "my_archetypes/${EVENT_FORMAT}.yaml"
          echo "FORMAT=$EVENT_FORMAT" >> "$GITHUB_ENV"
          echo "format=$EVENT_FORMAT" >> "$GITHUB_OUTPUT"

      - name: Snapshot Melee candidate baseline
        run: >-
          python -B validate_melee_candidate.py snapshot
          --event-id "$EVENT_ID" --format "$FORMAT"
          --output "$RUNNER_TEMP/melee-baseline.json"

      - name: Resume retained event review branch when present
        id: review-branch
        shell: bash
        run: |
          BRANCH="data/melee-${EVENT_ID}"
          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            REMOTE_REF="refs/remotes/origin/${BRANCH}"
            MERGE_BASE="$(git merge-base "$GITHUB_SHA" "$REMOTE_REF")"
            while IFS=$'\t' read -r STATUS PATH REST; do
              if [[ "$STATUS" == D* || "$STATUS" == R* || -n "$REST" ]]; then
                echo "Resumed review branch contains a deletion or rename: ${STATUS} ${PATH}" >&2
                exit 1
              fi
              case "$PATH" in
                "data_raw/melee/${EVENT_ID}/"* | \
                "data/${FORMAT}/melee/events/${EVENT_ID}.json" | \
                "data/${FORMAT}/melee/classifications/${EVENT_ID}.json" | \
                "data/${FORMAT}/melee/opportunities/${EVENT_ID}.json" | \
                "stats/${FORMAT}/melee/index.json" | \
                "stats/${FORMAT}/melee/events/${EVENT_ID}/"* | \
                "stats/catalog.json") ;;
                *) echo "Resumed review branch path is outside the event boundary: ${PATH}" >&2; exit 1 ;;
              esac
            done < <(git diff --name-status "$MERGE_BASE" "$REMOTE_REF")
            git checkout -B "$BRANCH" "refs/remotes/origin/${BRANCH}"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git merge --no-edit "$GITHUB_SHA"
            fi
            echo "resumed=true" >> "$GITHUB_OUTPUT"
          else
            echo "resumed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Resolve retained snapshot or fetch a new whitelisted event
        id: snapshot
        shell: bash
        run: |
          EVENT_PATH="data/${FORMAT}/melee/events/${EVENT_ID}.json"
          if [ -f "$EVENT_PATH" ]; then
            SNAPSHOT="$(python -c 'import json,pathlib,sys; p=json.load(open(sys.argv[1], encoding="utf-8"))["provenance"]["raw_artifacts"][0]["path"]; print(pathlib.Path(p).parent.as_posix())' "$EVENT_PATH")"
            SOURCE_MODE="retained"
          else
            RESULT="$(python -B -m mtgmeta.melee --event-id "$EVENT_ID" --complete --execute)"
            printf '%s\n' "$RESULT"
            SNAPSHOT="$(printf '%s' "$RESULT" | python -c 'import json,sys; print(json.load(sys.stdin)["archive_path"])')"
            SOURCE_MODE="fetched"
          fi
          test -n "$SNAPSHOT"
          echo "snapshot=$SNAPSHOT" >> "$GITHUB_OUTPUT"
          echo "source_mode=$SOURCE_MODE" >> "$GITHUB_OUTPUT"

      - name: Retain normalized event
        run: >-
          python -B -m mtgmeta.melee.retention
          --event-id "$EVENT_ID" --snapshot "${{ steps.snapshot.outputs.snapshot }}"
          --execute

      - name: Checkpoint immutable source and normalized event
        id: checkpoint
        if: steps.snapshot.outputs.source_mode == 'fetched' || steps.review-branch.outputs.resumed == 'true'
        shell: bash
        run: |
          BRANCH="${{ steps.review-branch.outputs.branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "data_raw/melee/${EVENT_ID}/" "data/${FORMAT}/melee/events/${EVENT_ID}.json"
          if ! git diff --cached --quiet; then
            git commit -m "chore: checkpoint Melee event ${EVENT_ID} source"
          fi
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify immutable checkpoint
        if: steps.checkpoint.outputs.commit != ''
        shell: bash
        run: |
          REMOTE_SHA="$(git ls-remote origin "refs/heads/${{ steps.checkpoint.outputs.branch }}" | awk '{print $1}')"
          test "$REMOTE_SHA" = "${{ steps.checkpoint.outputs.commit }}"

      - name: Classify submitted decks strictly
        run: >-
          python -B -m mtgmeta.melee.classification
          --root . --format "$FORMAT" --event-id "$EVENT_ID"
          --execute --strict

      - name: Build Constructed opportunity ledger
        run: >-
          python -B -m mtgmeta.melee.opportunities
          --root . --format "$FORMAT" --event-id "$EVENT_ID" --execute

      - name: Build event overview, decks, and quality
        run: >-
          python -B -m mtgmeta.melee.stats
          --root . --format "$FORMAT" --event-id "$EVENT_ID" --execute

      - name: Build hierarchical matchup statistics
        run: >-
          python -B -m mtgmeta.melee.matchup
          --root . --format "$FORMAT" --event-id "$EVENT_ID" --execute

      - name: Package event metadata and catalog
        run: >-
          python -B -m mtgmeta.melee.publish
          --root . --format "$FORMAT" --event-id "$EVENT_ID" --execute

      - name: Generate format-first consumer catalog
        run: python -B -m mtgmeta.catalog --root .

      - name: Validate Melee candidate scope
        run: >-
          python -B validate_melee_candidate.py validate
          --baseline "$RUNNER_TEMP/melee-baseline.json"

      - name: Validate repository, rules, and public Schemas
        shell: bash
        run: |
          python -B validate_repository.py
          python -B validate_rules.py "my_archetypes/${FORMAT}.yaml"
          python -B validate_schemas.py

      - name: Commit and push review branch
        id: publish
        shell: bash
        run: |
          BRANCH="${{ steps.review-branch.outputs.branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "data_raw/melee/${EVENT_ID}/" "data/${FORMAT}/melee/" "stats/${FORMAT}/melee/" "stats/catalog.json"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: build Melee event ${EVENT_ID} candidate"
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify review branch
        if: steps.publish.outputs.changed == 'true'
        shell: bash
        run: |
          REMOTE_SHA="$(git ls-remote origin "refs/heads/${{ steps.publish.outputs.branch }}" | awk '{print $1}')"
          test "$REMOTE_SHA" = "${{ steps.publish.outputs.commit }}"

      - name: Write candidate summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Melee production candidate"
            echo
            echo "- Event ID: ${EVENT_ID}"
            echo "- Format: ${FORMAT}"
            echo "- Source mode: ${{ steps.snapshot.outputs.source_mode || 'not-reached' }}"
            echo "- Immutable checkpoint: ${{ steps.checkpoint.outputs.commit || 'not-required' }}"
            echo "- Result: ${{ job.status }}"
            echo "- Candidate changed: ${{ steps.publish.outputs.changed || 'not-reached' }}"
            echo "- Review branch: ${{ steps.publish.outputs.branch || 'not-reached' }}"
            echo "- Candidate commit: ${{ steps.publish.outputs.commit || 'not-reached' }}"
            echo "- This workflow never pushes directly to master and never creates or merges a pull request."
          } >> "$GITHUB_STEP_SUMMARY"
