name: Focused project checks
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - AGENTS.md
      - CLAUDE.md
      - .github/copilot-instructions.md
      - docs/GOVERNANCE.md
      - docs/QUALITY.md
      - docs/DELIVERY.md
      - docs/STATUS.yaml
      - tools/project.py
  workflow_dispatch:
    inputs:
      check:
        description: Necessary mechanism check selected for this task
        required: true
        type: choice
        options: [packages, writer, github, platform, checks, dispatch, entries, status]
permissions:
  contents: read
concurrency:
  group: focused-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  selected:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run selected checks
        env:
          CHECK: ${{ inputs.check }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from tools.delivery import checks
          from tools.delivery.gitfacts import changed_files
          root = Path.cwd()
          if os.environ.get("CHECK"):
              selected = [os.environ["CHECK"]]
          else:
              paths = set(changed_files(root, os.environ["BASE"]))
              selected = []
              if "docs/STATUS.yaml" in paths:
                  selected.append("status")
              if paths.intersection((*checks.ENTRY_FILES, "tools/project.py")):
                  selected.append("entries")
          result = checks.run(root, selected)
          print(json.dumps(result, indent=2))
          raise SystemExit(1 if result["state"] in {"failed", "execution_failed"} else 0)
          PY
