review:
  top_copy:
    items:
    - order: 1
      text:
        zh: 本周摩登红白能量王者归来，两项占比都排名榜首，席卷两场、十二个八强。
        en: Boros Energy reclaimed the top spot in Modern this week. It led both share tables, winning two events and recording twelve Top 8 finishes.
    - order: 2
      text:
        zh: 柯克开始进入红白能量的构筑，主牌三张已经是相对比较流行的构筑，拿下一个冠军（deck:44a38588947409298528）。另一套亚军版本还带了三张[[card:The Naked Time|赤裸时刻]]，和标准一样，敏捷的柯克船长还是非常猛的，歌手、老年人配合[[card:The Naked Time|赤裸时刻]]也不错（deck:14caa731a7316802727f）。这个版本基本就是完全不考虑规避第三章的牺牲地，追求第2章的敏捷铺场配合[[card:Guide of Souls|导灵僧]]膨胀直接把对手打成半残。
        en: Kirk has started appearing in Boros Energy, and three copies in the main deck is already a fairly popular choice. One such list won an event (deck:44a38588947409298528). A runner-up list also played three copies of [[card:The Naked Time|The Naked Time]] (deck:14caa731a7316802727f). Just as in Standard, a hasty Captain Kirk is a serious threat, and [[card:Voice of Victory|Voice of Victory]] and [[card:Seasoned Pyromancer|Seasoned Pyromancer]] also work well with [[card:The Naked Time|The Naked Time]]. This build commits to the second chapter's hasty swarm and [[card:Guide of Souls|Guide of Souls]] triggers, aiming to deal a huge burst of damage even at the cost of sacrificing its lands to chapter three.
    - order: 3
      text:
        zh: 带[[card:Collation Trimatrix|汇整三联矩阵]]的格利极版本共鸣也开始流行。配合矩阵带更多[[card:Ornithopter|扑翼机]]、[[card:Memnite|蒙纳兽]]等小生物。这个八强版本主牌另有一张[[card:Borg Cube|博格方块]]作为去除（deck:ae2688d11bb4db1e6b48）。
        en: Grixis Affinity builds with [[card:Collation Trimatrix|Collation Trimatrix]] are also becoming popular. They play more small creatures, such as [[card:Ornithopter|Ornithopter]] and [[card:Memnite|Memnite]], to support the Matrix. This Top 8 list also included a main-deck [[card:Borg Cube|Borg Cube]] as removal (deck:ae2688d11bb4db1e6b48).
    - order: 4
      text:
        zh: 另外一套不带[[card:Eldrazi Temple|奥札奇殿堂]]的纯绿塔脉炉，满编[[card:Deep Space 9|深空九号]]和[[card:Nexus of Becoming|形变连结点]]，主备4张航海家号，使用了大量新牌，拿下一个25人小比赛的亚军（deck:a1c6445519c303c1ccb4）。航海家号提供Ramp，[[card:Nexus of Becoming|形变连结点]]放[[card:Deep Space 9|深空九号]]拉密度相对较高的永久物进来，或者[[card:Extinguisher Battleship|灭绝战舰]]直接扫场，上限都很高。
        en: A Mono-Green Tron list without [[card:Eldrazi Temple|Eldrazi Temple]] finished second in a small 25-player event (deck:a1c6445519c303c1ccb4). It ran full playsets of [[card:Deep Space 9|Deep Space 9]] and [[card:Nexus of Becoming|Nexus of Becoming]], along with four copies of U.S.S. Voyager across the main deck and sideboard, making extensive use of the new cards. Voyager provides ramp, while [[card:Nexus of Becoming|Nexus of Becoming]] can bring in [[card:Deep Space 9|Deep Space 9]] to take advantage of the deck's high permanent count, or Extinction Battleship to clear the board. Both plays have a very high ceiling.
    - order: 5
      text:
        zh: '[[card:Anthropological Mission|人类学任务]]也进入了摩登，主牌带三张任务的红蓝介刀拿下一个八强（deck:4276dabf217bf8c49294）。历史上这套牌这个位置有很多尝试：比比、娜尔施、霸权、克撒、量子等等，但任务看起来是最合适的。'
        en: '[[card:Anthropological Mission|Anthropological Mission]] has reached Modern too. An Izzet Steel-Cutter list with three main-deck copies made the Top 8 (deck:4276dabf217bf8c49294). This slot has seen plenty of experiments over time, including Vivi, Narset, [[card:Jeskai Ascendancy|Jeskai Ascendancy]], Urza and Quantum Riddler, but Mission looks like the best fit.'
    - order: 6
      text:
        zh: Q也在两套新牌中就业。亚军的洁斯凯云移版本主牌带三张，作为[[card:Cloudshift|云移]]目标（deck:0115d17c7ee976220312）。奥札奇仙人大轻老师则是在红绿奥札奇中使用两张，拿下一个八强（deck:f2a3961a0a9f1d24df62）。
        en: Q has found a home in two decks as well. A runner-up Jeskai Blink list played three copies as blink targets (deck:0115d17c7ee976220312). Eldrazi specialist Lightspirit used two copies in Gruul Eldrazi and earned a Top 8 finish (deck:f2a3961a0a9f1d24df62).
    non_card_phrases:
    - Arianne
    - Q
    - TEG
    reviewed: true
