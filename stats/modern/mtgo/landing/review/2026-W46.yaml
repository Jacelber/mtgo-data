review:
  top_copy:
    items:
    - order: 1
      text:
        zh: 本周摩登孳巢蜥组合技仍以13.7%的高分占比排在第一，拿下17个八强；红黑躁狂占比11.8%，拿下14个八强和三个冠军。除了先驱变境同样使用的[[card:Genesis Device|创世装置]]在泰坦护身符中的应用之外，暂时还没有什么新科技。护身符本周拿下四个八强，其中两次亚军（牌表deck:0ed3469bad08909ea920）。
        en: Broodscale Combo remained the most popular archetype among Modern’s high-scoring decks at 13.7%, with 17 Top 8 finishes. Rakdos Delirium followed at 11.8%, recording 14 Top 8s and three wins. There has been little new technology so far, with the main development being Amulet Titan’s adoption of [[card:Genesis Device|Genesis Device]], also seen in Pioneer Scapeshift. Amulet made four Top 8s this week, including two runner-up finishes (decklistdeck:0ed3469bad08909ea920).
