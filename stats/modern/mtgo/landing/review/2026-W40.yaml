      copy.zh:
      - order: 1
        text: '本周有两场RC，各类套牌占比、对阵胜率等详细数据可以在“实体大赛”标签中查看。两场RC上纯绿孳巢蜥虽然都没有席卷，但作为占比最高的套牌，依旧打出了非常出色的战绩（含平局胜率53.8%）。MO上也是继续一骑绝尘。

          RC上蓝白吟颂控也表现出色，胜率达到57.1%。这套牌也席卷了本周MO上344人的超级RCQ。不过另外三个资格中有2个都被纯绿孳巢蜥拿到，另外一个是红蓝灵技。'
      - order: 2
        text: FRA新科技方面，标准先驱灵技都用上的[[card:Pompous Battlemage|浮夸战巫师]]，在摩登中也得到很多满编：deck:66a574998435c01d9534。日韩RC中也有一套替代了矛妹的版本打进八强：deck:be06bd26bda6fb708dbb。不过相比之下暂时还是传统构筑比较多。
      - order: 3
        text: 名人堂牌手中村修平操控满编[[card:Dark Matter Manipulator|暗物质操弄师]]的红黑躁狂也打进了RC八强，替代了之前使用的[[card:Stitcher's Supplier|拼接师备尸]]：deck:2f3bb88642c119095bb1。MO上也有人使用这个版本，老版本本周倒是有席卷，但新版暂时还没出成绩。
      - order: 4
        text: 红宝石风暴基本都带上了两张[[card:Twinned Vision|双生视像]]。被冲动效果放逐后施放也可以抓2张，返照也还比较有用：deck:60809d01e109ec40e1b4
      - order: 5
        text: 泰坦护身符收获了[[card:Roiling Canopy|狂搅树冠]]这张绿色瓦拉库，配合已经在环境中的[[card:Yavimaya, Cradle of Growth|育苗摇篮亚维马雅]]，可以打出非常爆炸的伤害：deck:b79b48cc693f1457fbb3
      - order: 6
        text: 缓伤组合技套牌很多都带上了1-2张[[card:Solarium Sentry|沐日哨卫]]作为对风暴、烧等套牌的仇恨组件，沾绿能被绿阳找是不小的提升：deck:9124fda2b936a0f508a0。而在超级RCQ中打进八强的版本备牌带了一张[[card:Karn, Argent Defender|银白守卫像卡恩]]，是一个可以被韵律找出来的类[[card:Torpor Orb|迟钝法球]]效果：deck:c089ee20b271b059e4bf。
      - order: 7
        text: 虽然用的人相对较少，带了[[card:Emrakul, the Exigent Doom|迫临末日伊莫库]]作为给迷宫压的对象和Ramp咒语的纯绿孳巢蜥也有一个四强成绩：deck:44c5ff72575ca4b0bb88
      - order: 8
        text: 很多沾蓝中慢速套牌都带上了[[card:Theorist's Sanctum|塑理师圣所]]，有海岛类别找地可导，还是相对优质的法术力水槽：deck:0d34ad3e08d1f134bd6a、deck:59661def48412ec7970b、deck:c23a3e39139573bee2b4
      - order: 9
        text: 带了两张[[card:Seasoned Cryomancer|干练凛寒术士]]的怨灵套牌拿下一个挑战赛八强：deck:c632cfa8aeee0fb1dae4
      copy.en:
      - order: 1
        text: 'There were two RCs this week. Detailed metagame shares and matchup win rates are available under the Tabletop Events tab. Although Mono-Green Broodscale did not win either RC, the most represented deck still posted excellent results, with a 53.8% win rate including draws. It also continues to lead the field on Magic Online.

          Azorius Chant Control also performed well at the RCs, posting a 57.1% win rate. The deck also won this week''s 344-player Super RCQ on Magic Online. Of the other three qualification spots, Mono-Green Broodscale took two and Izzet Prowess took the remaining one.'
      - order: 2
        text: 'Among the new FRA technology, [[card:Pompous Battlemage|Pompous Battlemage]], already used in Standard and Pioneer Prowess, also appears as a full playset in many Modern lists: deck:66a574998435c01d9534. A version replacing [[card:Monastery Swiftspear|Monastery Swiftspear]] reached the Top 8 of the Japan/Korea RC: deck:be06bd26bda6fb708dbb. For now, though, traditional builds remain more common.'
      - order: 3
        text: 'Hall of Famer Shuhei Nakamura also made the RC Top 8 with Rakdos Delirium, running a full playset of [[card:Dark Matter Manipulator|Dark Matter Manipulator]] in place of former [[card:Stitcher''s Supplier|Stitcher''s Supplier]]: deck:2f3bb88642c119095bb1. This version is seeing some play on Magic Online too. The older build won an event this week, while the new version has yet to post a result.'
      - order: 4
        text: 'Ruby Storm lists mostly run two copies of [[card:Twinned Vision|Twinned Vision]]. Casting it after an impulse-draw effect exiles it still draws two cards, and flashback is useful too: deck:60809d01e109ec40e1b4'
      - order: 5
        text: 'Amulet Titan gains [[card:Roiling Canopy|Roiling Canopy]], a green Valakut. Together with [[card:Yavimaya, Cradle of Growth|Yavimaya, Cradle of Growth]], it can deal explosive amounts of damage: deck:b79b48cc693f1457fbb3'
      - order: 6
        text: 'Many [[card:Devoted Druid|Devoted Druid]] Combo lists run one or two [[card:Solarium Sentry|Solarium Sentry]] as hate cards against Storm, Burn, and similar decks. Being green makes it searchable with [[card:Green Sun''s Zenith|Green Sun''s Zenith]], a substantial improvement: deck:9124fda2b936a0f508a0. The Super RCQ Top 8 version has one [[card:Karn, Argent Defender|Karn, Argent Defender]] in the sideboard, offering a [[card:Torpor Orb|Torpor Orb]]-like effect that [[card:Nature''s Rhythm|Nature''s Rhythm]] can find: deck:c089ee20b271b059e4bf.'
      - order: 7
        text: 'Although still relatively uncommon, a Mono-Green Broodscale build with [[card:Emrakul, the Exigent Doom|Emrakul, the Exigent Doom]] as both an imprint target for [[card:Ugin''s Labyrinth|Ugin''s Labyrinth]] and a ramp spell reached the Top 4: deck:44c5ff72575ca4b0bb88'
      - order: 8
        text: 'Many slower blue decks have added [[card:Theorist''s Sanctum|Theorist''s Sanctum]]. Its Island type makes it fetchable, and it is a relatively strong mana sink: deck:0d34ad3e08d1f134bd6a, deck:59661def48412ec7970b, deck:c23a3e39139573bee2b4'
      - order: 9
        text: 'A [[card:Goryo''s Vengeance|Goryo''s Vengeance]] list with two copies of [[card:Seasoned Cryomancer|Seasoned Cryomancer]] made the Top 8 of a Challenge: deck:c632cfa8aeee0fb1dae4'
