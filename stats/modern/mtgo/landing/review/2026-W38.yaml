review:
  top_copy:
    reviewed: true
    items:
    - order: 1
      text:
        zh: 上周在美国RC上表现极佳的孳巢蜥组合技，本周在MO上也登顶两项占比。整体构筑变化不大。之前Spotlight上表现不错的灵技也能维持10%以上的占比。其他套牌基本是在混战状态，在个位数占比波动。
        en: Broodscale Combo, which performed exceptionally well at last week's U.S. RC, also topped both metagame share measures on Magic Online this week. Its overall construction remains the same. Prowess, which also performed well at the previous Spotlight, maintained a share above 10%. The rest of the field was largely a free-for-all, with single-digit shares fluctuating from deck to deck.
    - order: 2
      text:
        zh: 护身符大师kanister构筑的一套不带太古泰坦的护身符Ramp：deck:00a19000dd2010fecac2，带了[[card:Lessons from Life|生活教训]]、[[card:Escape to the Wilds|逃往幻野]]这些赚牌+Ramp的咒语，最后用[[card:Cultivator Colossus|陪护巨像]]（AKA Mr.Beast）终结。
        en: 'Amulet master kanister built a Titanless Amulet Ramp deck: deck:00a19000dd2010fecac2. It uses card-advantage-and-ramp spells such as Lessons from Life and Escape to the Wilds, then finishes with [[card:Cultivator Colossus|Cultivator Colossus]] (a.k.a. Mr.Beast).'
    - order: 3
      text:
        zh: 另外还有一套不带[[card:Orim's Chant|欧琳的吟颂]]、[[card:Day's Undoing|重启一日]]等类组合技的纯艾斯波控：deck:63d94347ed9783e35e42。本周也拿下一个八强。
        en: 'Another Top 8 finisher was a pure Esper Control deck without combo-like packages such as [[card:Orim''s Chant|Orim''s Chant]] or [[card:Day''s Undoing|Day''s Undoing]]: deck:63d94347ed9783e35e42.'
  features:
    reviewed: true
    explicit_empty: false
    items:
    - source_order: 24
      category: new_deck
      destination_id: deck:00a19000dd2010fecac2
      parent_id: amulet-ramp
      subtype_id: null
      positioning:
        zh: 无泰坦的护身符，带了生活教训、逃往幻野这些赚牌+Ramp的咒语，最后用陪护巨像（AKA Mr.Beast）终结。
        en: A Titanless Amulet build that uses card-advantage-and-ramp spells such as Lessons from Life and Escape to the Wilds, then finishes with Cultivator Colossus (a.k.a. Mr.Beast).
      featured_cards:
