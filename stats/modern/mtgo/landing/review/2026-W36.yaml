review:
  top_copy:
    reviewed: true
    items:
    - order: 1
      text:
        zh: 本周是第二场霍比特人主题的摩登MS，在美国达拉斯举办，921名牌手参赛，最终又由红蓝灵技席卷。连续两场MS都是灵技整体占比最高，并最终夺冠。不过高阶数据方面，灵技都并不是最出色的。详细数据可以在点击上方“实体大赛”标签查看。
        en: This week featured the second the Hobbits themed Modern Spotlight Series, held in Dallas with 921 players. Izzet Prowess again won the event. Prowess was the most-played strategy at both Super Qualifiers and won both, although its advanced performance metrics were not the strongest. Full data is available through the Tabletop Major Events tab above.
    - order: 2
      text:
        zh: 整体环境持续保持开放，两场MS上占比最高的灵技也只是刚刚过10%。而MO的高分占比同样是没有能稳定过10%的套牌。不过从四周平均来看，艾斯波云移和艾斯波怨灵两套艾斯波色组的牌八强的转化率都是相对更高的。
        en: The metagame remains wide open. Even Prowess, the most-played deck at both Spotlights, only just exceeded 10%. And no MTGO deck has consistently stayed above a 10% high-finish share. Across the four-week average, however, Esper Blink and Esper Goryo's—both Esper strategies—have posted comparatively higher Top 8 conversion rates.
    - order: 3
      text:
        zh: 一套蓝黑色组的怨灵套牌可以拿下一个亚军和另外一个八强：deck:5c191e64b5866f5771ac。整体结构有点像格利极掘坟，出土大眼加2费掘大哥。只不过没有红色的丧信掠夺，加了晶石蟹和拼接师备尸自磨。并且完全放弃了互动，专注自己的计划。
        en: 'A Dimir Goryo''s list reached one final and another Top 8: deck:5c191e64b5866f5771ac. Its structure resembles Grixis Goryo''s, using Unearth for Abhorrent Oculus and two-mana reanimation for its larger threats. Without red for Faithless Looting, it instead uses Hedron Crab and Stitcher''s Supplier for self-mill, abandoning interaction entirely to focus on its own game plan.'
  features:
    reviewed: true
    explicit_empty: false
    items:
    - source_order: 14
      category: new_technology
      destination_id: deck:5c191e64b5866f5771ac
      parent_id: dimir-goryos
      subtype_id: null
      positioning:
        zh: 整体结构有点像格利极掘坟，出土大眼加2费掘大哥。只不过没有红色的丧信掠夺，加了晶石蟹和拼接师备尸自磨。并且完全放弃了互动，专注自己的计划。所以要掘大哥的目标加到了八张，钨拉莫很多时候可以一脚直接爆头。而大锅可以吃棘泽边抓牌，还可以放逐大哥让钨拉莫进场有豆。备牌也是组的很简洁，基本都是满编，要打谁非常明确。
        en: 'The overall structure resembles Grixis Goryo''s: Unearth brings back Abhorrent Oculus, while two-mana reanimation targets the large threats. Without red for Faithless Looting, the deck uses Hedron Crab and Stitcher''s Supplier for self-mill and gives up interaction entirely to focus on its own plan. That allows it to play eight large reanimation targets, with Ulamog often ending the game in a single attack. Agatha''s Soul Cauldron can exile Griselbrand to turn counters into card draw, while exiling the deck''s large creatures also ensures Ulamog enters with counters. The sideboard is straightforward, with almost every card played as a four-of and each matchup target clearly defined.'
      featured_cards:
      - Hedron Crab
      - Goryo's Vengeance
      - Griselbrand
      - Ulamog, the Defiler
      supporting_facts: []
