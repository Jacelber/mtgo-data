review:
  top_copy:
    reviewed: true
    items:
    - order: 1
      text:
        zh: 本周孳巢蜥组合技继续爬升，两项占比都超过20%，这在禁牌后的摩登应该是首次出现。而且基本全都是纯绿，红绿等其他混色版本基本已经遭到环境淘汰。
        en: Broodscale Combo continued to climb this week, exceeding 20% of both the high-score field and the Top 8. This may be the first time a Modern archetype has cleared both marks since the most recent bans. Nearly every list was mono-green, while Gruul and other multicolor builds have all but disappeared from the metagame.
    - order: 2
      text:
        zh: 在满编[[card:Orim's Chant|欧琳的吟颂]]之外，还带3张[[card:Silence|封口]]的蓝白吟颂版本连续席卷了两场比赛：deck:ff48d8612256c0eb6a06。相当针对现在相对偏组合技和中慢速套牌的环境。
        en: 'An Azorius Chant Control build with a full playset of [[card:Orim''s Chant|Orim''s Chant]] and three copies of [[card:Silence|Silence]] won two consecutive events: deck:ff48d8612256c0eb6a06. That configuration is well suited to a metagame currently leaning toward combo and midrange-to-slower decks.'
  features:
    reviewed: true
    explicit_empty: false
    items:
    - source_order: 57
      category: new_technology
      destination_id: deck:ff48d8612256c0eb6a06
      parent_id: chant-control
      subtype_id: azorius
      positioning:
        zh: 3张封口的蓝白吟颂
        en: An Azorius Chant Control build with three copies of Silence.
      featured_cards:
      - Orim's Chant
      - Silence
      - Narset, Parter of Veils
      - Day's Undoing
      supporting_facts: []
