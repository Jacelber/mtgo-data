review:
  top_copy:
    reviewed: true
    items:
    - order: 1
      text:
        zh: 本周MO的比赛结构虽然调整，但摩登魅力不减，和上周开起来的普通挑战赛数量持平。不过混战在本周开始有一些慢慢清晰的趋势。艾斯波怨灵的领先优势开始明朗，本周优势明显。另外两套牌阿布赞缓伤和艾斯波云移的八强占比也都能超过10%。传统豪强红白能量则已经开始彻底掉队。
        en: MTGO's event structure changed this week, but Modern remained as popular as ever, with the same number of regular Challenges firing as last week. The crowded field is nevertheless beginning to show some clearer trends. Esper Goryo's pulled ahead decisively this week. Abzan Devoted Druid Combo and Esper Blink each also exceeded a 10% share of Top 8s, while former powerhouse Boros Energy has begun to fall well off the pace.
    - order: 2
      text:
        zh: 不过依旧还有新套牌进入环境，一套使用了HOB的Bilbo和Key to the Side-Door，并加入黑色的Basim的蓝黑伟代本周拿下一个八强：deck:acc94e69d84da4b303d1
        en: 'New decks are still entering the metagame. A Dimir Erayo list using HOB''s Bilbo and Key to the Side-Door, plus black for Basim, made a Top 8 this week: deck:acc94e69d84da4b303d1'
    - order: 3
      text:
        zh: 混蓝加入Quantum Riddler续航，还有Mana Leak作为许可咒语的洁斯凯炸地套牌本周也有多个高分、八强成绩：deck:78a27b72522b16549da7。蓝色确实让套牌可以应对的局面更丰富，但法术力基础也变得更差。
        en: 'A Jeskai Ponza build that splashes blue for Quantum Riddler as card advantage and Mana Leak as permission posted multiple high-score finishes, including a Top 8, this week: deck:78a27b72522b16549da7. Blue gives the deck answers to a wider range of situations, but also makes its mana base worse.'
    - order: 4
      text:
        zh: 传统介刀套牌中，也开始有加入Bilbo的版本出成绩，本周一套满编并带了一张Key to the Side-Door的版本拿下一个八强：deck:29ffa26abbc811f769a1
        en: 'Traditional Steel-Cutter shells are also starting to post results with Bilbo. This week, a list with the full four copies plus one Key to the Side-Door made a Top 8: deck:29ffa26abbc811f769a1'
  features:
    reviewed: true
    explicit_empty: false
    items:
    - source_order: 18
      category: new_deck
      destination_id: deck:acc94e69d84da4b303d1
      parent_id: erayo
      subtype_id: null
      positioning:
        zh: HOB带来Bilbo和Key to the Side-Door之后，aspiringspike率先尝试了纯蓝版本的伟代套牌，不过本周没有八强成绩，只有两个高分。而这个版本是加入了Basim和更多黑色互动，本周取得一个八强。包括MSH补的Loki在内，新组件确实都非常适合这个思路。
        en: After HOB introduced Bilbo and Key to the Side-Door, aspiringspike was first to try a mono-blue Erayo build. It missed the Top 8 this week but posted two high-score finishes. This version added Basim and more black interaction and did reach a Top 8. The new pieces—including Loki from MSH—are all excellent fits for the strategy.
      featured_cards:
      - Bilbo, Thief in the Night
      - Key to the Side-Door
      - Basim Ibn Ishaq
      - Erayo, Soratami Ascendant
      supporting_facts: *id001
    - source_order: 19
      category: new_deck
      destination_id: deck:78a27b72522b16549da7
      parent_id: jeskai-ponza
      subtype_id: null
      positioning:
        zh: 红白炸地的基底，混入蓝色加入Quantum Riddler续航，还有Mana Leak作为许可咒语，让套牌可以应对的局面更丰富。不过个人对这个法术力基础是否能支持三色还是有一定疑虑。
        en: Built on the Boros Ponza shell, this version splashes blue for Quantum Riddler as card advantage and Mana Leak as permission, expanding the range of situations it can answer. I still have some doubts about whether the mana base can reliably support all three colors.
      featured_cards:
      - Mana Leak
      - Quantum Riddler
      - Price of Freedom
      - Field of Ruin
      supporting_facts: *id002
    - source_order: 21
      category: new_technology
      destination_id: deck:29ffa26abbc811f769a1
      parent_id: steel-cutter
      subtype_id: izzet
      positioning:
        zh: 传统介刀套牌中，也开始有加入Bilbo的版本出成绩，本周一套满编并带了一张Key to the Side-Door的版本拿下一个八强。
        en: Traditional Steel-Cutter shells are also starting to post results with Bilbo. This week, a list with the full four copies and one Key to the Side-Door made a Top 8.
      featured_cards:
      - Bilbo, Thief in the Night
      - Key to the Side-Door
      - Loki, God of Mischief
      - Cori-Steel Cutter
      supporting_facts: *id003
