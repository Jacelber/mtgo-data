    dimensions:
      copy.zh:
      - order: 1
        text: 本周最后两场RC落下帷幕。南美404人参加由红白能量席卷，澳新233人由蓝白吟颂席卷。之前成为禁牌众矢之的的孳巢蜥表现相对一般，而前两周开始一直表现坚挺的红黑躁狂持续发挥。详细数据统计和胜率矩阵可以在上方实体大赛标签中查看。
      - order: 2
        text: MO上有一些新科技，都是绿Ramp牌：一套泰坦树冠Ramp本周拿下四强：deck:6251f171c1c49cd8a83e。结合了Ramp出泰坦和奥札奇体系，满编[[card:Kozilek's Command|寇基雷的指命]]。
      - order: 3
        text: 另外用[[card:Mine Collapse|矿井塌方]]配合[[card:Hexhaven Invigorator|赫克海文茁茂兽]]的[[card:Valakut, the Molten Pinnacle|熔天顶瓦拉库]]套牌，本周也终于拿下挑战赛八强：deck:fcd13e84caf0c7af79a9
      copy.en:
      - order: 1
        text: The final two Regional Championships concluded this week. In South America, Boros Energy swept a 404-player event, while Azorius Chant took the title in the 233-player Australia and New Zealand event. [[card:Basking Broodscale|Basking Broodscale]], previously the focus of calls for a ban, had a relatively modest showing. Rakdos Delirium, which has remained strong over the past two weeks, continued to perform well. Detailed statistics and the matchup matrix are available in the Tabletop tab above.
      - order: 2
        text: 'There is some new technology on Magic Online, all in green ramp decks. A Titan Canopy Ramp list reached the Top 4 this week: deck:6251f171c1c49cd8a83e. It combines ramping into Titan with the Eldrazi package and runs a full playset of [[card:Kozilek''s Command|Kozilek''s Command]].'
      - order: 3
        text: 'A [[card:Valakut, the Molten Pinnacle|Valakut, the Molten Pinnacle]] deck pairing [[card:Mine Collapse|Mine Collapse]] with [[card:Hexhaven Invigorator|Hexhaven Invigorator]] also finally made a Challenge Top 8 this week: deck:fcd13e84caf0c7af79a9'
