      feature.deck:b52ef8fe70fbd3804a2f.zh: 席卷普通挑战赛的黑白回血的版本挂了一张（牌表）。还有满编联邦前哨的四强黑白回血版本，作为额外的回血触发（牌表）；另一份八强版本带两张贝弗莉·克拉希尔医生，是一个自带回血万和琴的高级阿耶尼的群伴（牌表）。
      feature.deck:b52ef8fe70fbd3804a2f.en: The Orzhov Lifegain build that won a regular Challenge included one Salt Vampire (decklist). Another version reached the semifinals with four Federation Outposts, providing additional lifegain triggers (decklist). A third list made Top 8 with two copies of Dr. Beverly Crusher, effectively an upgraded Ajani’s Pridemate with a built-in Panharmonicon for lifegain triggers (decklist).
