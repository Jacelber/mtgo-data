      material_digest: bd669a4c8e27a26c6ca3d9b9bbbc3c90051b995b1e9d2e42c8a101a013af9be1
    dimensions:
      copy.zh:
      - order: 1
        text: Stefan Schütz 使用红蓝任务最终拿下冠军（牌表deck:a94f42bf1083daa46f3e）。满编[[card:Anthropological Mission|人类学任务]]，并带大量过牌咒语，还满编[[card:Flashback|返照]]，可以迅速到3个指示物，获取源源不断的手牌资源。制胜靠三张[[card:Ral, Crackling Wit|震天急智拉尔]]，在手牌近似无限的情况下可以迅速开大。这套牌包含冠军在内共有两人使用，另外一人是著名牌手Alex Rohan，构筑5-3。而冠军Stefan保持全胜，两人合计胜率80%，也让这套牌成为世冠上胜率最高的套牌。上次SOS的洁斯凯石板就是他Alex Rohan最先构筑，这次又带来了席卷世冠的套牌，可以说是神级构筑水平了。本周MTGO上的红蓝任务也拿下一个冠军、四个八强。
      - order: 2
        text: 而瑞士轮排名第一的Charis Kikidis（Mogged）使用的是备牌带3张[[card:Anthropological Mission|人类学任务]]和2张拉尔的红蓝灵技（牌表deck:58a4044f55b7bdff07fc），备牌可以转换成类似红蓝任务的游戏计划。主牌还带了两张[[card:Ravenous Cosmozoan|贪食星兽]]。世冠赛场上共有两人使用，牌表类似，备牌计划都是任务。Mogged构筑5-1，最后两轮提前进入八强拿到bye，八强首轮1-3不敌白绿地落。另一人2-2。瑞士轮整体胜率70%也非常可观。
      - order: 3
        text: 整体占比最高的是红白模模，最终也能够进入四强（牌表deck:ffc3bca72d8438cc54df）。[[card:The Naked Time|赤裸时刻]]第一章找[[card:Mountain|山脉]]加速，第二章的加豆敏捷可以打出非常可观的伤害，配合[[card:Sage of the Skies|苍穹智者]]的[[card:Lifelink|系命]]更是让对手无法race。而[[card:Nurturing Pixie|育幼碧仙]]可以把传纪拿回手，或者用[[card:Torch the Tower|点燃塔楼]]加码牺牲，规避第三章牺牲地的代价，法术力也可以领先。而三张[[card:Captain James T. Kirk|詹姆斯·T·柯克舰长]]也和敏捷配合良好，进场造人也可以吃到加豆敏捷，踢出去可以群体膨胀，斩杀线很高。没有敏捷的时候也可以滤牌、铺场。套牌在整体占比最高，接近20%的情况下还可以拿到53.8%的胜率，强度还是很高的。
      - order: 4
        text: 柯克也进入了玛尔都弃牌（牌表deck:643d116ad875827b155e）和红黑弃牌（牌表deck:69808e3bc925806920fd），两份四强牌表都带了三张；玛尔都版本还在备牌加入两张[[card:Salt Vampire|盐吸血鬼]]。
      - order: 5
        text: '[[card:Salt Vampire|盐吸血鬼]]在不同体系里也都有出现。在104人RCQ上取得四强（可惜只有前两名有Q）的蓝黑中速主牌满编4张（牌表deck:d6d1d78b612c9cc2f849）。'
      - order: 6
        text: 席卷普通挑战赛的黑白回血的版本挂了一张（牌表deck:b52ef8fe70fbd3804a2f）。还有满编[[card:Federation Outpost|联邦前哨]]的四强黑白回血版本，作为额外的回血触发（牌表deck:28e8a1023959c23c12ea）；另一份八强版本带两张[[card:Dr. Beverly Crusher|贝弗莉·克拉希尔医生]]，是一个自带回血万和琴的高级[[card:Ajani's Pridemate|阿耶尼的群伴]]（牌表deck:9a21850e7c942548134d）。
      - order: 7
        text: 勇得神器牺牲也用了少量新牌。世冠八强版本主牌带一张[[card:Q, Stacking the Deck|暗中做牌的Q]]、备牌带一张[[card:Test of Courage|考验勇气]]（牌表deck:6b1c561f0b533a2585fb）。前者提供反复施放翻出牌之复制品的资源用法，后者兼顾坟场干扰和处理三费以下神器、结界。另一份 MTGO 八强版本在备牌加入一张[[card:U.S.S. Enterprise-D, Galaxy-Class|银河级联邦星舰进取号-D]]作为备牌的资源点（牌表deck:ea96bf0870f003b1a295）。
      - order: 8
        text: 蓝黑中慢速套牌也有补强：世冠构筑7-1，小分劣势屈居第9的蓝黑蜘蛛侠备牌带了两张[[card:Georgiou, Terran Emperor|地球帝国皇帝乔久]]（牌表deck:0048478711efb782a28d）；MO席卷一场的蓝黑控制也带了主备各1（牌表deck:91dc62c31e1a311d5d45），基本上是对地落这种缺少硬去除套牌的银子弹。新的单色地也有一些用量，234人超级RCQ四强拿到RC资格的蓝黑控制带了两张[[card:Ni'Var Science Academy|尼瓦科学院]]（牌表deck:49c7d4a3d5f703dd85bc），挑战赛八强的蓝黑蜘蛛侠也有用一张[[card:The Unicomplex|联合体]]（牌表deck:18473b733064af5b8aea）。基本主要是为了中期以后的竖进刺探效果，蓝色给的飞行大多数时候没用，但黑色回收生物到牌库顶和套牌配合也还不错。
      - order: 9
        text: 白绿猛袭也获得了两张新组件。RCQ亚军版本带两张[[card:Captain Jean-Luc Picard|让-卢克·皮卡德舰长]]，自带铺场的赞美诗比较契合思路（牌表deck:da4c1abb0be6fa7f85de）。另一份挑战赛八强版本加入三张[[card:Jadzia Dax, Living Legacy|传承化身婕琪娅·戴克斯]]，可以爆费、膨胀，抓到多张也可以弃牌加豆（牌表deck:72ab0f36a37dd128b637）。而世冠八强的版本则完全没有携带新牌（牌表deck:54d09f0b3d335f9ad736），而白绿猛袭整体也是相对主流的套牌中表现最出色的，基本都是类似八强满编米开朗基罗的版本（官方是直接把这牌改叫白绿米开朗基罗。然后带裸男的红白模模改叫皮可西，我是觉着有些反应过度了，本质还是同一套牌的演化）。
      copy.en:
      - order: 1
        text: Stefan Schütz took down Worlds with Izzet Mission (decklistdeck:a94f42bf1083daa46f3e). With full playsets of [[card:Anthropological Mission|Anthropological Mission]] and [[card:Flashback|Flashback]], backed by plenty of card draw, the deck can quickly get Mission to three counters and establish a steady flow of cards. Three copies of [[card:Ral, Crackling Wit|Ral, Crackling Wit]] provide the finish. With that much card advantage, Ral can reach his ultimate in short order. Only two players brought the deck to Worlds. The other was Alex Rohan, who went 5–3 in Constructed. Schütz went undefeated, putting their combined win rate at 80%, the highest of any archetype at the tournament. Rohan was also behind the Jeskai Tablet deck from the last SOS. Following that up with a Worlds-winning build is an extraordinary run of deckbuilding. On MTGO, Izzet Mission recorded one win and four Top 8 finishes this week.
      - order: 2
        text: Charis Kikidis (Mogged) topped the Swiss standings with Izzet Prowess (decklistdeck:58a4044f55b7bdff07fc). His sideboard contained three Anthropological Missions and two copies of Ral, allowing him to pivot to a game plan similar to Izzet Mission. He also ran two Ravenous Cosmozoans in the main deck. The two Prowess players at Worlds had similar lists, both with the Mission plan in the sideboard. Mogged went 5–1 in Constructed before securing a Top 8 berth and receiving byes for the final two rounds. He then lost his quarterfinal 1–3 to Selesnya Landfall. The other Prowess player went 2–2, giving the archetype an impressive 70% win rate in the Swiss.
      - order: 3
        text: Boros Momo was the most-played deck at Worlds and put a player into the semifinals (decklistdeck:ffc3bca72d8438cc54df). [[card:The Naked Time|The Naked Time]] ramps with a Mountain on chapter I, then adds counters and grants haste on chapter II for some explosive attacks. Lifelink from [[card:Sage of the Skies|Sage of the Skies]] makes those attacks especially difficult to race. [[card:Nurturing Pixie|Nurturing Pixie]] can bounce the Saga, while [[card:Torch the Tower|Torch the Tower]] can sacrifice it to bargain. Both lines let you avoid chapter III’s land sacrifice and keep your mana advantage. The list also ran three copies of [[card:Captain James T. Kirk|Captain James T. Kirk]], another excellent recipient of haste. His token can benefit from the counters and haste as well, and his attack trigger pumps the whole team, giving the deck considerable reach. Even without haste, Kirk provides card selection and helps develop the board. Maintaining a 53.8% win rate while making
          up nearly 20% of the field is a strong indication of the deck’s power.
      - order: 4
        text: Kirk also appeared in Mardu Discard (decklistdeck:643d116ad875827b155e) and Rakdos Discard (decklistdeck:69808e3bc925806920fd). Both semifinal lists ran three copies, with the Mardu build adding two Salt Vampires to the sideboard as well.
      - order: 5
        text: '[[card:Salt Vampire|Salt Vampire]] has found a home in several different shells. A Dimir Midrange list ran the full four copies in the main deck and reached the semifinals of the 104-player RCQ (decklistdeck:d6d1d78b612c9cc2f849). Unfortunately, only the top two finishers qualified.'
      - order: 6
        text: The Orzhov Lifegain build that won a regular Challenge included one [[card:Salt Vampire|Salt Vampire]] (decklistdeck:b52ef8fe70fbd3804a2f). Another version reached the semifinals with four Federation Outposts, providing additional lifegain triggers (decklistdeck:28e8a1023959c23c12ea). A third list made Top 8 with two copies of [[card:Dr. Beverly Crusher|Dr. Beverly Crusher]], effectively an upgraded Ajani’s Pridemate with a built-in Panharmonicon for lifegain triggers (decklistdeck:9a21850e7c942548134d).
      - order: 7
        text: Jund Artifact Sacrifice also found room for a few new cards. The Worlds Top 8 list ran one [[card:Q, Stacking the Deck|Q, Stacking the Deck]] in the main deck and one [[card:Test of Courage|Test of Courage]] in the sideboard (decklistdeck:6b1c561f0b533a2585fb). Q provides a recurring source of value by letting you cast copies of the cards it reveals. [[card:Test of Courage|Test of Courage]] combines graveyard interaction with removal for artifacts and enchantments with mana value three or less. Another list made Top 8 on MTGO with a sideboard copy of [[card:U.S.S. Enterprise-D, Galaxy-Class|U.S.S. Enterprise-D, Galaxy-Class]] to help keep the resources flowing (decklistdeck:ea96bf0870f003b1a295).
      - order: 8
        text: The slower Dimir decks gained some tools as well. At Worlds, the Dimir Spider-Man player who went 7–1 in Constructed and narrowly missed Top 8 on tiebreakers ran two copies of [[card:Georgiou, Terran Emperor|Georgiou, Terran Emperor]] in the sideboard (decklistdeck:0048478711efb782a28d). An MTGO-winning Dimir Control list split two copies between the main deck and sideboard (decklistdeck:91dc62c31e1a311d5d45). Georgiou is a potent silver bullet against decks such as Landfall that have little hard removal. The new monocolored lands also saw play. A Dimir Control list ran two copies of [[card:Ni'Var Science Academy|Ni'Var Science Academy]] and earned an RC qualification with a semifinal finish in the 234-player Super RCQ (decklistdeck:49c7d4a3d5f703dd85bc). A Dimir Spider-Man list made Top 8 in a Challenge with one copy of [[card:The Unicomplex|The Unicomplex]] (decklistdeck:18473b733064af5b8aea). These lands are primarily there to enter untapped and surveil in the mid-to-late
          game. The blue land’s ability to grant flying rarely comes up, while the black land’s ability to put a creature from the graveyard on top of the library works quite well with the deck.
      - order: 9
        text: Selesnya Offense gained two new additions. The RCQ runner-up played two copies of [[card:Captain Jean-Luc Picard|Captain Jean-Luc Picard]], whose combination of an anthem and extra bodies fits the deck well (decklistdeck:da4c1abb0be6fa7f85de). A Challenge Top 8 list ran three copies of [[card:Jadzia Dax, Living Legacy|Jadzia Dax, Living Legacy]], offering both bursts of mana and a way to grow the board. Redundant copies can be discarded for counters (decklistdeck:72ab0f36a37dd128b637). The Worlds Top 8 build, meanwhile, used no new cards at all (decklistdeck:54d09f0b3d335f9ad736). Selesnya Offense was the best-performing archetype among the more popular decks, and most lists followed a similar approach to the Top 8 build with four copies of Michelangelo. The official coverage even renamed the deck Selesnya Michelangelo, while calling the Boros Momo builds with [[card:The Naked Time|The Naked Time]] “Pixie.” That strikes me as an overreaction. Both are natural evolutions of
          their existing archetypes.
