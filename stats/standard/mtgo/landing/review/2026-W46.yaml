      positioning:
        zh: 勇得神器牺牲也用了少量新牌。世冠八强版本主牌带一张暗中做牌的Q、备牌带一张考验勇气（牌表）。前者提供反复施放翻出牌之复制品的资源用法，后者兼顾坟场干扰和处理三费以下神器、结界。另一份 MTGO 八强版本在备牌加入一张银河级联邦星舰进取号-D作为备牌的资源点（牌表）。
        en: Jund Artifact Sacrifice also found room for a few new cards. The Worlds Top 8 list ran one Q, Stacking the Deck in the main deck and one Test of Courage in the sideboard (decklist). Q provides a recurring source of value by letting you cast copies of the cards it reveals. Test of Courage combines graveyard interaction with removal for artifacts and enchantments with mana value three or less. Another list made Top 8 on MTGO with a sideboard copy of U.S.S. Enterprise-D, Galaxy-Class to help keep the resources flowing (decklist).
