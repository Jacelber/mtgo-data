    - destination_id: deck:a94f42bf1083daa46f3e
      category: new_deck
      source_order: 1
      featured_cards:
      - Anthropological Mission
      - Flashback
      - Ral, Crackling Wit
      - Opt
      positioning:
        zh: Stefan Schütz 使用红蓝任务最终拿下冠军（牌表）。满编人类学任务，并带大量过牌咒语，还满编返照，可以迅速到3个指示物，获取源源不断的手牌资源。制胜靠三张震天急智拉尔，在手牌近似无限的情况下可以迅速开大。这套牌包含冠军在内共有两人使用，另外一人是著名牌手Alex Rohan，构筑5-3。而冠军Stefan保持全胜，两人合计胜率80%，也让这套牌成为世冠上胜率最高的套牌。上次SOS的洁斯凯石板就是他Alex Rohan最先构筑，这次又带来了席卷世冠的套牌，可以说是神级构筑水平了。本周MTGO上的红蓝任务也拿下一个冠军、四个八强。
        en: Stefan Schütz took down Worlds with Izzet Mission (decklist). With full playsets of Anthropological Mission and Flashback, backed by plenty of card draw, the deck can quickly get Mission to three counters and establish a steady flow of cards. Three copies of Ral, Crackling Wit provide the finish. With that much card advantage, Ral can reach his ultimate in short order. Only two players brought the deck to Worlds. The other was Alex Rohan, who went 5–3 in Constructed. Schütz went undefeated, putting their combined win rate at 80%, the highest of any archetype at the tournament. Rohan was also behind the Jeskai Tablet deck from the last SOS. Following that up with a Worlds-winning build is an extraordinary run of deckbuilding. On MTGO, Izzet Mission recorded one win and four Top 8 finishes this week.
