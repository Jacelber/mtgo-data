      feature.deck:ffc3bca72d8438cc54df.en: Boros Momo was the most-played deck at Worlds and put a player into the semifinals (decklist). The Naked Time ramps with a Mountain on chapter I, then adds counters and grants haste on chapter II for some explosive attacks. Lifelink from Sage of the Skies makes those attacks especially difficult to race. Nurturing Pixie can bounce the Saga, while Torch the Tower can sacrifice it to bargain. Both lines let you avoid chapter III’s land sacrifice and keep your mana advantage. The list also ran three copies of Captain James T. Kirk, another excellent recipient of haste. His token can benefit from the counters and haste as well, and his attack trigger pumps the whole team, giving the deck considerable reach. Even without haste, Kirk provides card selection and helps develop the board. Maintaining a 53.8% win rate while making up nearly 20% of the field is a strong indication of the deck’s power.
