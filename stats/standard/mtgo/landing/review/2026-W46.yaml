        - Practiced Offense
        - Brightglass Gearhulk
      feature.deck:da4c1abb0be6fa7f85de.zh: 白绿猛袭也获得了两张新组件。RCQ亚军版本带两张让-卢克·皮卡德舰长，自带铺场的赞美诗比较契合思路（牌表）。另一份挑战赛八强版本加入三张传承化身婕琪娅·戴克斯，可以爆费、膨胀，抓到多张也可以弃牌加豆（牌表）。而世冠八强的版本则完全没有携带新牌（牌表），而白绿猛袭整体也是相对主流的套牌中表现最出色的，基本都是类似八强满编米开朗基罗的版本（官方是直接把这牌改叫白绿米开朗基罗。然后带裸男的红白模模改叫皮可西，我是觉着有些反应过度了，本质还是同一套牌的演化）。
      feature.deck:da4c1abb0be6fa7f85de.en: Selesnya Offense gained two new additions. The RCQ runner-up played two copies of Captain Jean-Luc Picard, whose combination of an anthem and extra bodies fits the deck well (decklist). A Challenge Top 8 list ran three copies of Jadzia Dax, Living Legacy, offering both bursts of mana and a way to grow the board. Redundant copies can be discarded for counters (decklist). The Worlds Top 8 build, meanwhile, used no new cards at all (decklist). Selesnya Offense was the best-performing archetype among the more popular decks, and most lists followed a similar approach to the Top 8 build with four copies of Michelangelo. The official coverage even renamed the deck Selesnya Michelangelo, while calling the Boros Momo builds with The Naked Time “Pixie.” That strikes me as an overreaction. Both are natural evolutions of their existing archetypes.
