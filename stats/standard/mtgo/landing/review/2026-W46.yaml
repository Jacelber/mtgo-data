        - Superior Spider-Man
        - Deceit
        - Theorix Charm
      feature.deck:0048478711efb782a28d.zh: 蓝黑中慢速套牌也有补强：世冠构筑7-1，小分劣势屈居第9的蓝黑蜘蛛侠备牌带了两张地球帝国皇帝乔久（牌表）；MO席卷一场的蓝黑控制也带了主备各1（牌表），基本上是对地落这种缺少硬去除套牌的银子弹。新的单色地也有一些用量，234人超级RCQ四强拿到RC资格的蓝黑控制带了两张尼瓦科学院（牌表），挑战赛八强的蓝黑蜘蛛侠也有用一张联合体（牌表）。基本主要是为了中期以后的竖进刺探效果，蓝色给的飞行大多数时候没用，但黑色回收生物到牌库顶和套牌配合也还不错。
      feature.deck:0048478711efb782a28d.en: The slower Dimir decks gained some tools as well. At Worlds, the Dimir Spider-Man player who went 7–1 in Constructed and narrowly missed Top 8 on tiebreakers ran two copies of Georgiou, Terran Emperor in the sideboard (decklist). An MTGO-winning Dimir Control list split two copies between the main deck and sideboard (decklist). Georgiou is a potent silver bullet against decks such as Landfall that have little hard removal. The new monocolored lands also saw play. A Dimir Control list ran two copies of Ni'Var Science Academy and earned an RC qualification with a semifinal finish in the 234-player Super RCQ (decklist). A Dimir Spider-Man list made Top 8 in a Challenge with one copy of The Unicomplex (decklist). These lands are primarily there to enter untapped and surveil in the mid-to-late game. The blue land’s ability to grant flying rarely comes up, while the black land’s ability to put a creature from the graveyard on top of the library works
        quite well with the deck.
