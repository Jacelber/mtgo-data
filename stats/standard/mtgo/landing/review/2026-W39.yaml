review:
  top_copy:
    reviewed: true
    items:
    - order: 1
      text:
        zh: 本周标准环境还在继续演变，红蓝元素重新回归高分占比榜首，但八强占比并没有领先勇得太多。而且相比红蓝元素的构筑已经基本固定，勇得本周还在开发新科技单卡：一套席卷版本带了[[card:Azog, Moria's Ruin|Azog, Moria's Ruin]]和[[card:Wolverine, Fierce Fighter|Wolverine, Fierce Fighter]]：deck:2cb213eef80be589dfef；而另一套席卷牌表带了3个[[card:The Misty Mountains Cold|The Misty Mountains Cold]]以及一张[[card:Smaug the Magnificent|Smaug the Magnificent]]：deck:90bee2bf2991b773cb05。
        en: 'The Standard metagame kept evolving this week. Izzet Spellementals returned to the top spot by high-score share, but its Top 8 share was only narrowly ahead of Jund Artifact Sacrifice. While the Izzet Spellementals build has largely settled, Jund is still testing new cards: one winning list featured [[card:Azog, Moria''s Ruin|Azog, Moria''s Ruin]] and [[card:Wolverine, Fierce Fighter|Wolverine, Fierce Fighter]]: deck:2cb213eef80be589dfef; another played three copies of [[card:The Misty Mountains Cold|The Misty Mountains Cold]] and one [[card:Smaug the Magnificent|Smaug the Magnificent]]: deck:90bee2bf2991b773cb05.'
    - order: 2
      text:
        zh: 老套牌本周也出了一些成绩：用[[card:Bejeweled Warg|Bejeweled Warg]]、[[card:Great Divide Guide|Great Divide Guide]]替代[[card:Badgermole Cub|Badgermole Cub]]的经典白绿猛袭席卷一场：deck:36fe505600babecdf776；放弃一费生物曲线，满编[[card:Gandalf, Goblins' Bane|Gandalf, Goblins' Bane]]和[[card:Wizard's Staff|Wizard's Staff]]的红蓝灵技也可以拿下一个八强：deck:130fe587608f20376921。
        en: 'Established decks posted results too: a classic Selesnya Offense list replacing [[card:Badgermole Cub|Badgermole Cub]] with [[card:Bejeweled Warg|Bejeweled Warg]] and [[card:Great Divide Guide|Great Divide Guide]] won an event: deck:36fe505600babecdf776; an Izzet Prowess build without one-drop creatures, running four copies each of [[card:Gandalf, Goblins'' Bane|Gandalf, Goblins'' Bane]] and [[card:Wizard''s Staff|Wizard''s Staff]], also reached the Top 8: deck:130fe587608f20376921.'
