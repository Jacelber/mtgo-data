review:
  top_copy:
    items:
    - order: 1
      text:
        zh: 本周有一场实体Magic Spotlight在美国哈特福德举办，吸引775人参加，最终由勇德神器牺牲席卷。洁斯凯神器虽然屈居亚军，但胜率大幅度领跑，达到了59.9%，所有主流对局中唯一数据劣势的是内战，因为平局太多。而亚军的牌表和一般轻混红，只带一张[[card:The Fire Crystal|火之水晶]]的不同，进红更深，还带了[[card:Solitary Cell|独囚牢房]]作为短解，还可以弃掉满编的[[card:The Mind Stone|心灵宝石]]：deck:5b41170c6e29924821b7
        en: 'This week, a tabletop Magic Spotlight took place in Hartford, USA, drawing 775 players, with Jund Artifact Sacrifice ultimately sweeping the event. Jeskai Artifacts finished second but led the field by a wide margin with a 59.9% win rate. Its only unfavorable matchup among the major archetypes was the mirror, owing to the large number of draws. Unlike the usual light red splash with just one [[card:The Fire Crystal|The Fire Crystal]], the runner-up’s list goes deeper into red and includes [[card:Solitary Cell|Solitary Cell]] as cheap removal, which can also discard copies of its full playset of [[card:The Mind Stone|The Mind Stone]]: deck:5b41170c6e29924821b7'
    - order: 2
      text:
        zh: 另外一套胜率明显领先的就是蓝黑中速了，也达到56.5%。其他主流套牌中纯绿地落的表现也相对不错，meta占比最高，还能拿下53.0%胜率。详细数据统计和胜率矩阵可以在上方实体大赛标签中查看。
        en: 'Dimir Midrange was another clear leader in win rate, reaching 56.5%. Among the other major archetypes, Mono-Green Landfall also performed relatively well: it had the largest metagame share while still posting a 53.0% win rate. Detailed statistics and the matchup matrix are available in the Tabletop tab above.'
    - order: 3
      text:
        zh: 新科技方面，国人大师王昊天使用自己调整的铁木尔战呼人拿下12-3：deck:0c20228077791108a8ca。上一场奥兰多Spotlight他也操控战呼人获得非常好的成绩。整场比赛中两人使用战呼人，合计17-7，是使用人数超过1人的套牌中胜率最高的。只有1人使用的红白Token控，同样也是12-3,80%胜率。另外本周AC上也有人使用的格利极掘坟，还有更新构筑的蓝黑大眼，胜率也都不错。
        en: 'For new technology, Chinese standout Haotian Wang went 12–3 with his own take on Temur Battlecrier: deck:0c20228077791108a8ca. He also achieved an excellent result with Battlecrier at the previous Spotlight in Orlando. The two Battlecrier players at this event finished a combined 17–7, the highest win rate among archetypes played by more than one person. Boros Token Control, played by just one person, likewise finished 12–3 for an 80% win rate. Grixis Reanimator, which also appeared in this week’s AC, and an updated Dimir Oculus build both posted solid win rates as well.'
    non_card_phrases:
    - 王昊天
    - Haotian Wang
    - 战呼人
    reviewed: true
  features:
    explicit_empty: false
