review:
  top_copy:
    reviewed: true
    items:
    - order: 1
      text:
        zh: 上周开始兴起的勇德神器牺牲，本周直接占比登顶。胜率也是非常强大，达到57%，主流对局中只有蓝黑中速这一个劣势对局。地落也因为这个对局很差，占比跌落非常迅速。勇德甚至还没有找到自己的最佳构筑，但都很能打。本周席卷的四场中，不光有上周出现的[[card:Lively Dirge|唤生挽歌]]版本，还有[[card:Rottenmouth Viper|腐臭口毒蛇]]版本：deck:9b8dd31e486740428087，[[card:Break Out|破墙而出]]版本：deck:783d37f9e8c8e8e9cb8b。爆发力和韧性、灵活性都非常强的一套牌，估计之后的环境也会以这套牌为中心继续演变。
        en: 'Jund Artifact Sacrifice, which began rising last week, surged all the way to the top of the metagame this week. Its win rate was also impressive at 57%, with Dimir Midrange being its only unfavorable matchup among the major decks. Landfall’s share also fell rapidly, in part because its matchup against Jund is so poor.


          Jund may not even have found its optimal build yet, but every version has proven competitive. Across the four events the archetype won this week, the successful lists included not only the [[card:Lively Dirge|Lively Dirge]] build seen last week, but also a [[card:Rottenmouth Viper|Rottenmouth Viper]] build—deck:9b8dd31e486740428087—and a [[card:Break Out|Break Out]] build—deck:783d37f9e8c8e8e9cb8b.


          With its explosive power, resilience, and flexibility, Jund Artifact Sacrifice is likely to become a central force around which the metagame continues to evolve.'
  features:
    reviewed: true
    explicit_empty: false
