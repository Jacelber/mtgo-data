      visual.feature.deck:d6f7229cef5f289b3793:
        colors:
        - u
        - r
        cards:
        - Pompous Battlemage
        - Elusive Otter
        - Slickshot Show-Off
        - Flow State
      feature.deck:d6f7229cef5f289b3793.zh: 新的1费灵技人浮夸战巫师的加持之下，红蓝灵技王者归来，直接席卷新环境第一场比赛，之后又席卷一场还有多个八强
      feature.deck:d6f7229cef5f289b3793.en: 'With the new one-mana prowess creature Pompous Battlemage, Izzet Prowess is back in force: it won the first tournament of the new environment, followed by another win and multiple Top 8 finishes.'
      visual.feature.deck:badf534d73a6dda20fa1:
        colors:
        - b
        - r
        cards:
        - Master of Barbs
        - Ingris Stingerquill
        - Stingerquill Charm
        - Hired Claw
      feature.deck:badf534d73a6dda20fa1.zh: 一口气补强了倒刺烁师、英格利棘毫、棘毫护符的红黑蜥蜴，本周也有不错的成绩
      feature.deck:badf534d73a6dda20fa1.en: Rakdos Lizards received three additions at once—Master of Barbs, Ingris Stingerquill, and Stingerquill Charm—and posted solid results this week.
      visual.feature.deck:e2c952a1112744ef5668:
        colors:
        - w
        - b
        cards:
        - Ajani Resolute
        - Liliana the Faultless
        - Enlightened Confidant
        - Hinterland Sanctifier
      feature.deck:e2c952a1112744ef5668.zh: 新莉莲娜、阿耶尼都是纯强度提升。白亲信在回血源本身有保障的情况下，强度也是颇高
      feature.deck:e2c952a1112744ef5668.en: Liliana the Faultless and Ajani Resolute are straightforward power upgrades. Enlightened Confidant is also very strong when the deck has reliable sources of lifegain.
      visual.feature.deck:9ad4756364a4065afe24:
        colors:
        - u
        - b
        cards:
        - Yuriko, Hope from the Shadows
        - Theorix Charm
        - Kaito, Bane of Nightmares
        - Dream Beavers
      feature.deck:9ad4756364a4065afe24.zh: 有人开始尝试希望之影百合子和论析护符，本周有多个八强成绩
      feature.deck:9ad4756364a4065afe24.en: Players have begun trying Yuriko, Hope from the Shadows and Theorix Charm, with multiple Top 8 finishes this week.
      visual.feature.deck:ca3408693934822818fd:
        colors:
        - u
        - r
        cards:
        - Seasoned Cryomancer
        - Hearth Elemental
        - Eddymurk Crab
        - Sunderflock
      feature.deck:ca3408693934822818fd.zh: 携带两张干练凛寒术士
      feature.deck:ca3408693934822818fd.en: This list runs two copies of Seasoned Cryomancer.
      visual.feature.deck:773eedf462cec0b58bf3:
        colors:
        - b
        - g
        cards:
        - Vraska, the Cutting Glare
        - Simulacrum Shaper
        - Emeritus of Abundance
        - Environmental Scientist
      feature.deck:773eedf462cec0b58bf3.zh: 满编新瓦丝卡和黯影塑师的偏ramp思路
      feature.deck:773eedf462cec0b58bf3.en: A more ramp-oriented build running full playsets of Vraska, the Cutting Glare and Simulacrum Shaper.
      visual.feature.deck:9267dfb755f14301b645:
        colors:
        - w
        cards:
        - Leonardo, Cutting Edge
        - Liliana the Faultless
        - Enlightened Confidant
        - Ajani Resolute
      feature.deck:9267dfb755f14301b645.zh: 放弃黑色，并带了3张萌动新生的纯白版本本周拿下八强
      feature.deck:9267dfb755f14301b645.en: A mono-white version that drops black and runs three copies of Germinate Recruits made the Top 8 this week.
      visual.feature.deck:e8f4dffe5f0441c749b8:
        colors:
        - b
        - g
        cards:
        - Dark Matter Manipulator
        - Liliana the Repentant
        - Overlord of the Balemurk
        - Huskburster Swarm
      feature.deck:e8f4dffe5f0441c749b8.zh: 加入暗物质操弄师之后自磨思路也重回环境，自新莉莲娜也可以帮助自磨
      feature.deck:e8f4dffe5f0441c749b8.en: Self-mill is back in the environment with the addition of Dark Matter Manipulator. Liliana the Repentant also helps fuel the self-mill plan.
      visual.feature.deck:d235f512158403cf70c6:
        colors:
        - w
        - u
        - r
        cards:
        - Geist of Saint Thalia
        - Tablet of Discovery
        - Jeskai Revelation
        - Accumulate Wisdom
      feature.deck:d235f512158403cf70c6.zh: 用圣莎利雅的游魂代替奶奶的洁斯凯课程
      feature.deck:d235f512158403cf70c6.en: Jeskai Lessons replaces Gran-Gran with Geist of Saint Thalia.
