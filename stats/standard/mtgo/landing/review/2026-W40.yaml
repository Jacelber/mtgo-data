    dimensions:
      copy.zh:
      - order: 1
        text: '本周9月29日开始FRA进入MO环境，周报照例会把各赛制有八强成绩的新科技都给大家分享一下。不过一些中慢速套牌在法术力基础中加入了慢地之类就不提了。


          首先是在新的1费灵技人[[card:Pompous Battlemage|浮夸战巫师]]的加持之下，红蓝灵技王者归来，直接席卷新环境第一场比赛，之后又席卷一场还有多个八强：deck:d6f7229cef5f289b3793'
      - order: 2
        text: 一口气补强了[[card:Master of Barbs|倒刺烁师]]、[[card:Ingris Stingerquill|英格利棘毫]]、[[card:Stingerquill Charm|棘毫护符]]的红黑蜥蜴，本周也有不错的成绩：deck:badf534d73a6dda20fa1
      - order: 3
        text: '另外一套得到极大补强的是回血思路，新莉莲娜、阿耶尼都是纯升级。虽然也有不带它的牌表，但在回血源本身有保障的情况下，白亲信的强度也是颇高：deck:e2c952a1112744ef5668。

          同时也有纯白带[[card:Germinate Recruits|萌动新生]]的版本：deck:9267dfb755f14301b645。'
      - order: 4
        text: 还有加入[[card:Dark Matter Manipulator|暗物质操弄师]]之后自磨思路也重回环境，[[card:Liliana the Repentant|自新莉莲娜]]也可以帮助自磨：deck:e8f4dffe5f0441c749b8
      - order: 5
        text: 一套用[[card:Geist of Saint Thalia|圣莎利雅的游魂]]代替被禁的[[card:Gran-Gran|奶奶]]的洁斯凯课程本周可以拿下一个四强：deck:d235f512158403cf70c6
      - order: 6
        text: 其他传统套牌中，蓝黑中速开始尝试[[card:Yuriko, Hope from the Shadows|希望之影百合子]]和[[card:Theorix Charm|论析护符]]，本周有多个八强成绩：deck:9ad4756364a4065afe24；携带两张[[card:Seasoned Cryomancer|干练凛寒术士]]的红蓝元素取得四强：deck:ca3408693934822818fd；还有满编[[card:Vraska, the Cutting Glare|夺命目光瓦丝卡]]和[[card:Simulacrum Shaper|黯影塑师]]的偏ramp黑绿中速也能拿下八强：deck:773eedf462cec0b58bf3
      copy.en:
      - order: 1
        text: 'FRA arrived on Magic Online on September 29 this week. As usual, this report highlights new technology that reached the Top 8 across the formats. We will skip changes such as midrange and control decks adding slow lands to their mana bases.


          First, with the new one-mana prowess creature [[card:Pompous Battlemage|Pompous Battlemage]], Izzet Prowess is back in force: it won the first tournament of the new environment, followed by another win and multiple Top 8 finishes: deck:d6f7229cef5f289b3793'
      - order: 2
        text: 'Rakdos Lizards received three additions at once—[[card:Master of Barbs|Master of Barbs]], [[card:Ingris Stingerquill|Ingris Stingerquill]], and [[card:Stingerquill Charm|Stingerquill Charm]]—and posted solid results this week: deck:badf534d73a6dda20fa1'
      - order: 3
        text: 'Lifegain is another strategy that received major upgrades. [[card:Liliana the Faultless|Liliana the Faultless]] and [[card:Ajani Resolute|Ajani Resolute]] are straightforward improvements. Although some lists leave it out, [[card:Enlightened Confidant|Enlightened Confidant]] is very strong when reliable sources of lifegain are already in place: deck:e2c952a1112744ef5668.

          There is also a mono-white version with [[card:Germinate Recruits|Germinate Recruits]]: deck:9267dfb755f14301b645.'
      - order: 4
        text: 'Self-mill is also back in the environment with the addition of [[card:Dark Matter Manipulator|Dark Matter Manipulator]]. [[card:Liliana the Repentant|Liliana the Repentant]] helps fuel the self-mill plan as well: deck:e8f4dffe5f0441c749b8'
      - order: 5
        text: 'A Jeskai Lessons list replacing the banned [[card:Gran-Gran|Gran-Gran]] with [[card:Geist of Saint Thalia|Geist of Saint Thalia]] reached the Top 4 this week: deck:d235f512158403cf70c6'
      - order: 6
        text: 'Among established decks, Dimir Midrange has begun trying [[card:Yuriko, Hope from the Shadows|Yuriko, Hope from the Shadows]] and [[card:Theorix Charm|Theorix Charm]], earning multiple Top 8 finishes this week: deck:9ad4756364a4065afe24. Izzet Spellementals with two copies of [[card:Seasoned Cryomancer|Seasoned Cryomancer]] reached the Top 4: deck:ca3408693934822818fd. A more ramp-oriented Golgari Midrange build with full playsets of [[card:Vraska, the Cutting Glare|Vraska, the Cutting Glare]] and [[card:Simulacrum Shaper|Simulacrum Shaper]] also made the Top 8: deck:773eedf462cec0b58bf3.'
