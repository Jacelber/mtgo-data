review:
  top_copy:
    reviewed: true
    items:
    - order: 1
      text:
        zh: 本周标准地落依旧独占鳌头，两项占比都来到了30%以上，巨幅领先第二名的蓝黑中速。不过之后的第二梯队涌现了很多新面孔，除了地落的数据有些失控之外，整体环境还算开放。除了上周介绍过的新版小黑之外，HOB矮人+武具思路的矮人套牌本周两项占比也都可以超过5%：deck:ccd8c0e396b0f9bf2338
        en: 'Standard Landfall remained firmly on top this week, with both metagame-share measures above 30% and a huge lead over second-place Dimir Midrange. The second tier, however, featured plenty of new faces. Aside from Landfall’s rather overwhelming numbers, the field remained fairly open. In addition to the updated Mono-Black build covered last week, the HOB Dwarves equipment build also cleared 5% in both measures this week: deck:ccd8c0e396b0f9bf2338'
    - order: 2
      text:
        zh: 禁牌前就曾经出现过，但曾经一度被打没的思路，最近也开始重新涌现：EOE、TMT神器为核心的共鸣deck:8f7c4d0eeef49d894520；经典融合仪洁斯凯神器deck:b65e7c596ec9a1c79648；经典班特截气deck:9c0f1669a41d46933d8a；还有毒镖蛙哥的地脉红蓝deck:8fdac0a6194558e83efc，这些套牌本周都有席卷。
        en: 'Several strategies that appeared before the ban but were subsequently pushed out have started to return: Affinity built around EOE and TMT artifacts deck:8f7c4d0eeef49d894520; classic Simulacrum Synthesizer–based Jeskai Artifacts deck:b65e7c596ec9a1c79648; classic Bant Airbending deck:9c0f1669a41d46933d8a; and Poison Dart Frog’s post-ban Izzet Leyline build deck:8fdac0a6194558e83efc. Each of these decks won an event this week.'
    - order: 3
      text:
        zh: 还有满编截水师水袋的蓝白控拿下四强deck:ec57ff967da37ccf91b7；类似之前席卷RC的苏勒台拷打魔拿下八强deck:0c06019f86999a574c2a。
        en: Azorius Control with the full four copies of Bender’s Waterskin reached the semifinals deck:ec57ff967da37ccf91b7; a Sultai Excruciator build similar to the one that previously won an RC also made the Top 8 deck:0c06019f86999a574c2a.
  features:
    reviewed: true
    explicit_empty: false
    items:
    - source_order: 1
      category: new_deck
      destination_id: deck:8f7c4d0eeef49d894520
      parent_id: affinity
      subtype_id: null
      positioning:
        zh: 曾经一瞬出现在环境中的共鸣套牌复活，本周席卷一场
        en: Affinity briefly surfaced in the metagame before disappearing, but returned to win an event this week.
      featured_cards:
      - Pinnacle Emissary
      - Ravenous Robots
      - Springleaf Drum
      - Uthros, Titanic Godcore
      supporting_facts: *id001
    - source_order: 2
      category: new_technology
      destination_id: deck:ccd8c0e396b0f9bf2338
      parent_id: dwarves
      subtype_id: boros
      positioning:
        zh: HOB矮人+武具思路的矮人套牌本周两项占比也都可以超过5%。奇力、戴恩一行给续航，舞锤矮人和劳班装武具打伤害。最强力的应该是梭林，进场装所有武具，有熔刺靴+地脉斧就是敏捷连击践踏，进场还能解一个阻挡者，经常能直接终结比赛。
        en: 'The HOB Dwarves equipment build cleared 5% in both share metrics this week. Kíli and Dáin’s Company provide staying power, while Dwarven Mauler and Raubahn turn equipment into damage. Thorin is probably the deck’s strongest card: he equips everything on entry, and Lavaspur Boots plus Leyline Axe immediately gives him haste, double strike, and trample. He can also remove a blocker as he enters, often ending the game on the spot.'
      featured_cards:
      - Thorin, Mountain-king
      - Kíli the Resourceful
      - Leyline Axe
      - Lavaspur Boots
      supporting_facts: []
    - source_order: 3
      category: new_technology
      destination_id: deck:b65e7c596ec9a1c79648
      parent_id: jeskai-artifacts
      subtype_id: null
      positioning:
        zh: 传统洁斯凯神器，完全没用新牌，也能够席卷
        en: A traditional Jeskai Artifacts list with no new cards at all still managed to win an event.
      featured_cards:
      - Simulacrum Synthesizer
      - Repurposing Bay
      - Cryogen Relic
      - United Battlefront
      supporting_facts: []
    - source_order: 4
      category: new_technology
      destination_id: deck:9c0f1669a41d46933d8a
      parent_id: bant-airbending
      subtype_id: null
      positioning:
        zh: 同样是TMT之后的版本，虽然没有獾地鼠了但影响不大。本周可以席卷一场
        en: This is another post-TMT build. The loss of Badgermole Cub has not hurt it much, and it won an event this week.
      featured_cards:
      - Aang, Swift Savior
      - Appa, Steadfast Guardian
      - Reality Fulcrum
      - Michelangelo's Technique
      supporting_facts: []
    - source_order: 5
      category: new_technology
      destination_id: deck:8fdac0a6194558e83efc
      parent_id: leyline-aggro
      subtype_id: izzet
      positioning:
        zh: 毒镖蛙哥在才能被禁后的地脉投掷版本，本周席卷一场
        en: Poison Dart Frog’s post-ban Leyline fling build won an event this week.
      featured_cards:
      - Leyline of Resonance
      - Slickshot Show-Off
      - Wild Ride
      - Callous Sell-Sword
      supporting_facts: []
    - source_order: 6
      category: new_technology
      destination_id: deck:ec57ff967da37ccf91b7
      parent_id: azorius-control
      subtype_id: null
      positioning:
        zh: 满编截水师水袋拿下一个四强
        en: An Azorius Control build with a full four copies of Bender’s Waterskin reached the semifinals.
      featured_cards:
      - Bender's Waterskin
      - Emeritus of Ideation
      - Three Steps Ahead
      - Ugin, Eye of the Storms
      supporting_facts: []
    - source_order: 7
      category: new_technology
      destination_id: deck:0c06019f86999a574c2a
      parent_id: sultai-excruciator
      subtype_id: null
      positioning:
        zh: 之前席卷过一场RC的进绿混惆怅的拷打魔，本周有一个八强成绩
        en: A green-splash Excruciator build with Wistfulness, similar to one that previously won an RC, posted a Top 8 finish this week.
      featured_cards:
      - Doomsday Excruciator
