    items:
    - order: 1
      text:
        zh: 在地落连续霸榜三周之后，本周环境开始有一些变化。顶端还是地落、元素、蓝黑三套，但元素两项占比本周都实现了反超，登上头名。上周开始成为环境组成部分的红白矮人套牌，本周依旧能保持5%的占比。
        en: After Landfall topped the metagame for three consecutive weeks, the field began to shift. Landfall, Spellementals, and Dimir remain the leading decks, but Spellementals overtook the field in both tracked shares to claim first place. Boros Dwarves, which joined the metagame last week, still held roughly a 5% share.
    - order: 2
      text:
        zh: 同时还有新势力进入环境。两套恶魔隔间控都取得不错的成绩。首先是McWinsauce的：deck:79c590f0205dbbdbf928。本质是个携力如一套牌，带了很多黑边陲产其他色。用杉石人核心ramp+调色出携力如一，并可以作为恶魔触发隔间，长盘价值爆炸。
        en: 'New contenders also entered the metagame. Two Unholy Annex control decks posted strong results. The first was McWinSauce''s list: deck:79c590f0205dbbdbf928. It is fundamentally a Together as One deck, using several black verge lands to supply the other colors. Firdoch Core both ramps and fixes for Together as One, while also serving as a Demon to trigger Unholy Annex, creating tremendous long-game value.'
    - order: 3
      text:
        zh: 本周杀出的另一套隔间控制牌是：deck:2b828363fb5b9881ee8a。最开始出现是上周日本100+人RCQ上拿到资格，之后在MO上有人抄取也有出色表现。先是日本牌手ryuumei操控拿下四强，然后构筑上面苏勒台版本的McWinsauce也用同样的牌表取得四强，之外还有不少高分成绩。
        en: The other Unholy Annex control deck to break out this week was deck:2b828363fb5b9881ee8a. It first appeared in last week's over-100-player RCQ in Japan and earned a qualification slot. MTGO players then picked it up and produced strong results. Japanese player ryuumei reached the Top 4 first, and McWinSauce later made another Top 4 with the same list, alongside several other high finishes.
    - order: 4
      text:
        zh: 还有一套勇德神器牺牲套牌本周可以席卷一场：deck:3a2766382a9a6dff793f。以前天梯上偶尔能见到类似思路的套牌，以EOE的生质科技专家和TLA偏执追击为核心，不过MO比赛中高分区从来没出现过。但个人认为这两张牌，尤其是偏执追击的强度还是非常高的，只是暂时没有合适的结构。HOB的萨克维尔巴金斯家族可能一定程度上补足了这个结构，作为单次牺牲源+珍宝加速+牺牲打血引擎，整体和现有结构都非常搭。
        en: 'Jund Artifact Sacrifice also topped one event this week: deck:3a2766382a9a6dff793f. Similar lists occasionally appeared on the ladder, built around Biotech Specialist from EOE and Obsessive Pursuit from TLA, but they had never reached the high-finishing ranks of an MTGO event. Both cards—especially Obsessive Pursuit—look very powerful, but the archetype previously lacked the right shell. The Sackville-Bagginses from HOB may be the missing piece: a sacrifice outlet, Treasure acceleration, and a sacrifice-based damage engine that fits the rest of the deck extremely well.'
