review:
  top_copy:
    reviewed: true
    items:
    - order: 1
      text:
        zh: 本周标准环境经历了两个变化：首先是上周的大禁牌（獾、蓝才能、奶奶）；然后HOB本周也进入了环境。不过相比之下HOB对环境的影响还是比较小的，主要还是禁牌的效果。
        en: 'The Standard metagame went through two changes this week: first, last week’s major bans (Badgermole Cub, Stormchaser’s Talent, and Gran-Gran); then HOB entered the format this week. HOB’s immediate impact has been relatively small, however, and the bans have been the much bigger factor.'
    - order: 2
      text:
        zh: 最显而易见的是上周还持续占据环境霸主地位的灵技套牌直接原地消失，组件一部分类似的投掷套牌也只剩一套。缺少了蓝才能飞去来这个最强配合之后类似思路的套牌强度确实是一落千丈。
        en: The most obvious result is that the Prowess deck that still dominated the format last week disappeared completely, while the Fling deck that shares some of its components was reduced to a single Top 8. Without the Stormchaser’s Talent and Boomerang Basics package—the strategy’s strongest interaction—decks built along similar lines have fallen off sharply.
    - order: 3
      text:
        zh: 石板课在禁了奶奶之后，还以洁斯凯形态存在，并可以席卷两场。deck:0ef7de8666929e404c95 本来这个构筑其实就并不完全依赖奶奶，不过两场席卷的构筑都带了艺术家才能，第2章的减费效果一定程度上可以弥补失去奶奶之后的爆发力不足问题。
        en: Jeskai Lessons survived the Gran-Gran ban and even won two events. deck:0ef7de8666929e404c95 The archetype was never completely dependent on Gran-Gran to begin with, but both winning lists played Artist’s Talent. The cost reduction from its second chapter helps make up for some of the explosiveness lost with Gran-Gran.
    - order: 4
      text:
        zh: 而禁牌后第一周的最大赢家暂时是纯绿地落和蓝黑中速，并列高胜占比第一，而且八强占比也分列前二。地落用什么填补獾的位置暂时还没有定论，这四个位置其实对套牌强度的影响不算太大。席卷的版本一个是用了鼹鼠人和比利：deck:113f08b5c4dcc7b5e1ce；另一套2费Ramp同根共生和小浣熊锐目鉴物客：deck:3b20a57979ef845780d2
        en: 'The early winners of the first post-ban week are Mono-Green Landfall and Dimir Midrange. They are tied for first in high-score share and also rank first and second in Top 8 share. Landfall has not settled on a replacement for Badgermole Cub, and in practice those four slots do not appear to matter very much to the deck’s overall strength. One winning list used Mole Man, Moloid Master and Bristly Bill, Spine Sower: deck:113f08b5c4dcc7b5e1ce; the other used the two-mana ramp spell Shared Roots alongside Keen-Eyed Curator: deck:3b20a57979ef845780d2'
    - order: 5
      text:
        zh: 而蓝黑中速其实在上个环境末期，加入了黄蜂女和新的2费康之后，就有一点点复苏的趋势，经历了一个无伤禁牌表后彻底复活：deck:6552a16bef7fa5293b5d。另外还有一个满编萨克维尔巴金斯家族，并携带群袭智者配合的版本拿下八强：deck:cf1060bd38d38c8f161f
        en: 'Dimir Midrange had already begun to show signs of recovery late in the previous metagame after adding The Wondrous Wasp and the new two-mana counterspell We Say Thee Nay! After passing through the ban announcement untouched, it has now made a full comeback: deck:6552a16bef7fa5293b5d. Another Top 8 list maxed out on The Sackville-Bagginses and paired it with Infestation Sage: deck:cf1060bd38d38c8f161f'
    - order: 6
      text:
        zh: 黑白回血近期也还算比较坚挺，本周席卷一场，不过是和之前构筑不太一样的满编召起过往的版本：deck:085fbae05701d25afeda
        en: 'Orzhov Lifegain has also remained fairly resilient. It won one event this week, but with a build that differs from previous versions by playing a full set of Raise the Past: deck:085fbae05701d25afeda'
    - order: 7
      text:
        zh: 其他HOB新牌方面，能在第一周进入环境的牌确实并不多。影响最大的应该是斯毛格，重新激活了龙部族套牌，红白龙（deck:a1ee1d77d2a2ebb3ff9d），纯红龙（deck:96749dc528008eb7a201）都有多个八强成绩。
        en: 'As for the other new HOB cards, very few managed to break into the format in the first week. Smaug the Magnificent appears to have had the biggest impact, reviving the Dragon tribal decks: both Boros Dragons (deck:a1ee1d77d2a2ebb3ff9d) and Mono-Red Dragons (deck:96749dc528008eb7a201) posted multiple Top 8 finishes.'
    - order: 8
      text:
        zh: 其他新牌就只有零星出现了。一套带了两个侧门钥匙的四色人类拿下一个亚军（deck:72768a4ea7b144822c74）；满编老迈异常的鸟的蓝白救援取得八强（deck:492b0e40d4a2f0bdc168）；携带两个劫掠食人妖森林的洁斯凯石板拿下八强（deck:3e9daa72448ce4e0b276）；还有一个混红带红蓝围攻的洁斯凯模模带了两张鹰王同样取得八强（deck:1eedf5459507770b0502）。
        en: Other new cards appeared only sporadically. A Five-Color Humans list with two copies of Key to the Side-Door finished second (deck:72768a4ea7b144822c74); an Azorius Oculus list maxing out on Most Decrepit Old Bird reached the Top 8 (deck:492b0e40d4a2f0bdc168); a Jeskai Tablet list with two copies of Plunder the Trollshaws also made the Top 8 (deck:3e9daa72448ce4e0b276); and a red-splash Jeskai Momo list using Frostcliff Siege and two copies of The Lord of the Eagles reached the Top 8 as well (deck:1eedf5459507770b0502).
    - order: 9
      text:
        zh: 格利极石板控制思路首次进入八强：deck:96b30d5e076425e95de6。不是HOB的新科技，而是用非凡龙配合炸地的格利极版本石板套牌。基本思路还是石板控，不过相比以往石板控ramp出大招的思路，这套牌更偏控场和炸地。自由的代价和复仇者解散在非凡龙站场的情况下都可以直接炸两块地，同时扫场扫6非凡龙加豆还不会死。不过相比传统石板控的洁斯凯启示，这个终端在现环境下并没有特别强力。
        en: 'A Grixis Tablet control shell reached the Top 8 for the first time: deck:96b30d5e076425e95de6. This was not a new piece of HOB technology, but a Grixis Tablet build that combines Fin Fang Foom with land destruction. The core is still Tablet Control, but instead of ramping toward a large finisher like earlier builds, this list leans more heavily on board control and attacking mana. With Fin Fang Foom in play, both Price of Freedom and Avengers Disassembled can destroy two lands outright, while a six-damage sweeper leaves the Dragon alive and adds a counter to it. Compared with Jeskai Revelation, the traditional Tablet Control finisher, however, this endgame does not look especially powerful in the current field.'
