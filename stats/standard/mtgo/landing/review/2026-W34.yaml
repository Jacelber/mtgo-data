review:
  top_copy:
    reviewed: true
    items:
    - order: 1
      text:
        zh: 本周MO赛事结构调整后，很多赛制能开起来的比赛都大幅减少。标准赛制在有一场Showcase挑战赛（179人）的情况下，依旧比上周少开两场。
        en: Following this week's changes to the MTGO event structure, the number of events that actually fired dropped sharply across many formats. Standard still ran two fewer events than last week despite having a 179-player Showcase Challenge.
    - order: 2
      text:
        zh: Showcase最终由纯绿地落席卷：deck:05f753ee26d10025385a。纯绿地落在环境占比的领先优势也越来越大。而席卷Showcase的版本还在尝试更多HOB单卡，主牌的找地带了Elven Passage，备牌还有给保护+践踏的Warg Tactics，以及打控制套牌的Gigantic Big Bear。另外一套带了三张Bejeweled Warg的套牌在普通挑战赛中也拿下一个亚军：deck:865e322a036a77b48ffb。
        en: 'Mono-Green Landfall topped the Showcase: deck:05f753ee26d10025385a. Its lead in metagame share also continues to grow. The winning build experimented with more HOB cards, running Elven Passage as its maindeck fetch land, Warg Tactics in the sideboard for protection and trample, and Gigantic Big Bear for control matchups. Another list with three copies of Bejeweled Warg also finished runner-up in a regular Challenge: deck:865e322a036a77b48ffb.'
    - order: 3
      text:
        zh: 其他HOB新牌方面，一直在玩五色人类的burnet7（实际基本上也是只有他一个人玩），本周还在继续尝试新卡，还在Showcase中拿下八强，获得最终MOCS资格赛的资格：deck:ad4b7bcf0a408f28af1c
        en: 'Among the other new HOB cards, burnet7—who has been playing Five-Color Humans for some time and is effectively its only pilot—continued trying new additions this week, made the Top 8 of the Showcase, and earned a berth in the Showcase Qualifier: deck:ad4b7bcf0a408f28af1c'
    - order: 4
      text:
        zh: 一套带了大量新牌的小黑也在普通挑战赛中拿下八强成绩：deck:2093fcbc2b91ed82d42b。主牌满编了Desolation Prowler、Nighthowl Pursuer还有3张Gollum, Riddle Master，备牌还带了Gollum the Abandoned
        en: 'A Mono-Black Aggro list packed with new cards also made the Top 8 of a regular Challenge: deck:2093fcbc2b91ed82d42b. The maindeck played four copies each of Desolation Prowler and Nighthowl Pursuer, plus three Gollum, Riddle Master, with Gollum the Abandoned in the sideboard.'
  features:
    reviewed: true
    explicit_empty: false
    items:
    - source_order: 1
      category: new_deck
      destination_id: deck:28cfded64b696a0ce850
      parent_id: temur-spellementals
      subtype_id: null
      positioning:
        zh: 相比纯元素套牌更倾向于控制，不过还是保留了黯潮蟹+驱群妖的配合，进绿带的分析花粉一定程度上后期也可以导生物。不过个人感觉进绿为了各种单张单卡收益可能不是特别大。
        en: Compared with common Spellementals builds, this list leans more controlling while retaining the Eddymurk Crab + Sunderflock package. Splashing green for Analyze the Pollen also gives it access to a creature tutor in the late game. Personally, though, I am not convinced the green splash adds enough value through its assortment of one-ofs.
      featured_cards:
      - Eddymurk Crab
      - Analyze the Pollen
      - Prismari Charm
      - Sunderflock
      supporting_facts: *id001
    - source_order: 2
      category: new_technology
      destination_id: deck:05f753ee26d10025385a
      parent_id: mono-green-landfall
      subtype_id: null
      positioning:
        zh: 席卷Showcase的版本。尝试了更多HOB单卡，主牌的找地带了Elven Passage，备牌还有给保护+践踏的Warg Tactics，以及打控制套牌的Gigantic Big Bear。
        en: The Showcase-winning build. It tried more HOB cards, with Elven Passage as the maindeck fetch land, Warg Tactics in the sideboard for protection and trample, and Gigantic Big Bear for control matchups.
      featured_cards:
