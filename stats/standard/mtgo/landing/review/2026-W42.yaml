        text: 一套骷髅妖思路的纯黑快攻本周拿下一个8强，满编[[card:Tinybones, the Pickpocket|扒手细骨]]和[[card:Corpses of the Lost|失落者之骸]]。不过比赛本身人数较少，3-2进八强然后一轮游，并不算是有说服力的成绩：deck:369ac5463f7f6787f020
      copy.en:
      - order: 1
        text: 'Starting last week, Excruciator decks found a new target for [[card:Superior Spider-Man|Superior Spider-Man]] to copy: [[card:Uldaros Theorix|Uldaros Theorix]]. Many lists have moved [[card:Doomsday Excruciator|Doomsday Excruciator]] to the sideboard, or cut it altogether. Since last week''s report, all of these lists, including variants that already ran no Excruciator, have been grouped under the single Dimir Spider-Man archetype and counted together.'
      - order: 2
        text: This week, Dimir Midrange and Dimir Spider-Man are running neck and neck at the top of the metagame. Both mostly retain the builds established last week, while the rest of the field has largely settled into stable configurations.
      - order: 3
        text: 'A Skeleton-focused Mono-Black Aggro list made one Top 8 this week, running the full four copies of [[card:Tinybones, the Pickpocket|Tinybones, the Pickpocket]] and [[card:Corpses of the Lost|Corpses of the Lost]]. The event itself was small, however: it made Top 8 at 3-2 and lost in the quarterfinals, so the result is not especially convincing: deck:369ac5463f7f6787f020'
      features:
      - destination_id: deck:369ac5463f7f6787f020
