review:
  top_copy:
    items:
    - order: 1
      text:
        zh: 本周MO标准搞活动，周末有一场总决赛，周中挑战赛8强或者League5-0可以参加。最后总决赛有129人参加，蓝黑中速席卷，依旧是[[card:Yuriko, Hope from the Shadows|希望之影百合子]]和[[card:Theorix Charm|论析护符]]各挂一张的版本。亚军是蓝白模模，主牌带了一张[[card:Guiding Hydra|多头龙向导]]作为[[card:Starfield Shepherd|星空牧者]]导师的目标：deck:524eba2341891ddb59d7
        en: 'MTGO ran a special Standard event this week, culminating in a weekend final. Players could qualify with a Challenge Top 8 or a 5–0 League finish during the week. The final drew 129 players, and Dimir Midrange dominated, still using one copy each of [[card:Yuriko, Hope from the Shadows|Yuriko, Hope from the Shadows]] and [[card:Theorix Charm|Theorix Charm]]. The runner-up was Azorius Momo, with a single [[card:Guiding Hydra|Guiding Hydra]] in the main deck as a tutor target for [[card:Starfield Shepherd|Starfield Shepherd]]: deck:524eba2341891ddb59d7'
    - order: 2
      text:
        zh: 还有带[[card:Frostcliff Siege|围攻霜崖]]的洁斯凯模模版本拿下八强：deck:3e64f2a13a79d35110e4
        en: 'A Jeskai Momo version with [[card:Frostcliff Siege|Frostcliff Siege]] also reached the Top 8: deck:3e64f2a13a79d35110e4'
    - order: 3
      text:
        zh: 本周的环境变化方面，拷打魔系套牌找到了新的蜘蛛侠复制目标：[[card:Uldaros Theorix|乌达洛论析]]。很多套牌都开始把拷打魔放进备牌，甚至备牌都不带了。以前也有不带拷打魔的版本，本周周报把所有这些套牌整合成了蓝黑蜘蛛侠一个大类，不再分开统计。同时[[card:Seasoned Cryomancer|干练凛寒术士]]和[[card:Theorix Charm|论析护符]]也同样非常适合这个思路。还有带[[card:Null Summoner|虚空唤师]]的版本。本周拿下一个亚军：deck:af9339e5c032ae7b8c75
        en: 'As for this week''s metagame shifts, the Excruciator decks found a new creature for Spider-Man to copy: [[card:Uldaros Theorix|Uldaros Theorix]]. Many builds have moved [[card:Doomsday Excruciator|Doomsday Excruciator]] to the sideboard, or even cut it entirely. Versions without Excruciator had appeared before, and this week''s report now groups all these builds under Dimir Spider-Man rather than tracking them separately. [[card:Seasoned Cryomancer|Seasoned Cryomancer]] and [[card:Theorix Charm|Theorix Charm]] also fit the strategy extremely well. There are versions with [[card:Null Summoner|Null Summoner]], too. This build finished second this week: deck:af9339e5c032ae7b8c75'
    - order: 4
      text:
        zh: 同样是[[card:Superior Spider-Man|究极蜘蛛侠]]套牌的苏勒台掘坟也用上了[[card:Seasoned Cryomancer|干练凛寒术士]]，[[card:Something Worth Saving|应救之物]]相对[[card:Cache Grab|贪婪备储]]也是纯升级：deck:43587beb61363b53cb36
        en: 'Sultai Reanimator, another [[card:Superior Spider-Man|Superior Spider-Man]] deck, has also adopted [[card:Seasoned Cryomancer|Seasoned Cryomancer]], while [[card:Something Worth Saving|Something Worth Saving]] is a straight upgrade over [[card:Cache Grab|Cache Grab]]: deck:43587beb61363b53cb36'
    - order: 5
      text:
        zh: 地落套牌开始尝试[[card:Carnivorous Cultivator|食肉草培育师]]，并带一些[[card:Elven Passage|精灵通道]]，还有一些功能地作为导师目标，拿下一个四强：deck:37704608cf3168335752
        en: 'Landfall decks have started trying [[card:Carnivorous Cultivator|Carnivorous Cultivator]], adding some copies of [[card:Elven Passage|Elven Passage]] and other utility lands as tutor targets. This build reached the Top 4: deck:37704608cf3168335752'
    - order: 6
      text:
        zh: 加入[[card:The Theorist, Jace Beleren|塑理师杰斯贝连]]及其他杰斯一整套组件的蓝白控，本周也有出色表现：deck:1bb0230c61ba0a2f21eb
        en: 'Azorius Control with [[card:The Theorist, Jace Beleren|The Theorist, Jace Beleren]] and the rest of the new Jace package also performed well this week: deck:1bb0230c61ba0a2f21eb'
    - order: 7
      text:
        zh: 上周出现的混蓝带[[card:Avatar of Burgeoning Echoes|繁响化身]]的蓝绿地落，本周也开始出成绩：deck:0fefffe03ca3c1d88390
        en: 'The blue-splash Simic Landfall build with [[card:Avatar of Burgeoning Echoes|Avatar of Burgeoning Echoes]] that appeared last week has started putting up results: deck:0fefffe03ca3c1d88390'
    - order: 8
      text:
        zh: 红蓝灵技套牌继续满编[[card:Pompous Battlemage|浮夸战巫师]]，本周加入[[card:Stingcaster Mage|棘咒法师]]、[[card:Clash of Elements|元素交锋]]的版本也拿下一个八强：deck:9db4ea144f8aea4e897f
        en: 'Izzet Prowess continues to run the full playset of [[card:Pompous Battlemage|Pompous Battlemage]]. A version adding [[card:Stingcaster Mage|Stingcaster Mage]] and [[card:Clash of Elements|Clash of Elements]] reached the Top 8 this week: deck:9db4ea144f8aea4e897f'
    - order: 9
      text:
        zh: 毒镖蛙哥MacIsaac操控自己招牌的投掷版本，满编[[card:Pompous Battlemage|浮夸战巫师]]也拿下一个八强：deck:883e13bc88697b093241
        en: 'MacIsaac, the poison-dart-frog guy, piloted his signature Fling build to another Top 8, running a full playset of [[card:Pompous Battlemage|Pompous Battlemage]]: deck:883e13bc88697b093241'
    - order: 10
      text:
        zh: 上个环境就出现过的蓝黑大眼套牌，本周加入[[card:The Theorist, Jace Beleren|塑理师杰斯贝连]]拿下一个八强：deck:cf958c77a7a11b813ab2
        en: 'Dimir Oculus, which had already appeared in the previous metagame, added [[card:The Theorist, Jace Beleren|The Theorist, Jace Beleren]] and reached the Top 8 this week: deck:cf958c77a7a11b813ab2'
