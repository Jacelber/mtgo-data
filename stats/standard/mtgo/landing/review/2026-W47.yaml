    dimensions:
      copy.zh:
      - order: 1
        text: 本周标准七场比赛，四色石板拿下三个冠军、八个八强，包括183人的Showcase挑战赛冠军。蓝白控制高分占比最高是唯一一个踩上两位数占比的，但八强占比只有一半的5%左右，也没有席卷成绩。
      - order: 2
        text: 新科技方面，蓝黑蜘蛛侠也加入了[[card:Salt Vampire|盐吸血鬼]]。Arianne用主牌满编的版本连续拿下四个八强，包括Showcase挑战赛（deck:ea09e8f83ed1f0668e83）。
      - order: 3
        text: 红蓝元素也开始用[[card:Anthropological Mission|人类学任务]]，挑战赛四强版本主牌一张、备牌两张（deck:7b7e6497229f13bb4a59）。本来就带大量前期过牌的构筑也属于天然比较适合这个B计划。
      - order: 4
        text: deck:815047c98ce0c52ac4c8：现在标准现在已经有无穷多套牌了，算上被禁掉的会更多。但上周任务席卷世冠之后红蓝本周又有新花样。[[card:Kobayashi Maru Scenario|小林丸号模拟演练]]类似以前的[[card:Demonic Pact|恶魔契约]]，但3费更灵活，蓝色也有回手咒语可以配合。这套牌保留了[[card:Harmless Offering|无害献物]]给对手让对手直接维持输掉游戏的选项，也可以回手、或者加码牺牲重复利用。基本是一个带组合技制胜的红蓝控制套牌。
      copy.en:
      - order: 1
        text: Standard had seven events this week. 4-Color Tablet won three of them and claimed eight Top 8 finishes, including the title at the 183-player Showcase Challenge. Azorius Control accounted for the largest share of high-scoring decklists and was the only archetype to reach double digits. Its Top 8 share, however, was only about half as large, at roughly 5%, so it did not dominate the results.
      - order: 2
        text: Dimir Spider-Man players have also picked up [[card:Salt Vampire|Salt Vampire]]. Arianne made four consecutive Top 8s with a full playset in the main deck, including one at the Showcase Challenge (deck:ea09e8f83ed1f0668e83).
      - order: 3
        text: Izzet Spellementals players have started using [[card:Anthropological Mission|Anthropological Mission]] as well. One semifinalist's list ran a single copy in the main deck and two in the sideboard (deck:7b7e6497229f13bb4a59). A deck that already plays so much early card selection is a natural home for this backup plan.
      - order: 4
        text: 'deck:815047c98ce0c52ac4c8: Standard already has countless decks to choose from, and the list would be even longer if we included those that have been banned. After Mission dominated Worlds last week, Izzet players found another new angle this week. [[card:Kobayashi Maru Scenario|Kobayashi Maru Scenario]] resembles the old [[card:Demonic Pact|Demonic Pact]], but its three-mana cost makes it more flexible, and blue offers bounce spells to support it. This list keeps [[card:Harmless Offering|Harmless Offering]] as a way to hand it to the opponent and make them lose on their upkeep. Bounce spells and bargain effects also provide ways to keep extracting value from it. The result is essentially an Izzet control deck with a combo finish.'
