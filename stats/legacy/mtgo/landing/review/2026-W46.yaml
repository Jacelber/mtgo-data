        zh: 本周薪传六场比赛由六个不同类别的套牌夺冠，成绩比较分散。环境整体占比更是极为开放，高分占比最多的只有6%左右，也是非常少见了。
        en: Six different archetypes won this week’s six Legacy events, with results spread across a wide range of decks. The metagame was remarkably open too. Even the most popular archetype accounted for only around 6% of high-scoring decks.
    - order: 2
      text:
        zh: 新牌方面，进入薪传环境的也不多。八强套牌里面，只有一套四强的多色哨站在备牌加入一张[[card:Malfunctioning Holodeck|故障的全息甲板]]作为卡恩工具箱组件，基本是之前[[card:Perilous Snare|险恶圈套]]的升级版（牌表deck:b75e4deb46a629d326e3）。
        en: Few of the new cards have found their way into Legacy. Among this week’s Top 8 lists, the sole example was a Multi-Color Cloudpost build that reached the semifinals with one [[card:Malfunctioning Holodeck|Malfunctioning Holodeck]] in the sideboard as a Karn toolbox option. It is essentially an upgrade over [[card:Perilous Snare|Perilous Snare]] (decklistdeck:b75e4deb46a629d326e3).
