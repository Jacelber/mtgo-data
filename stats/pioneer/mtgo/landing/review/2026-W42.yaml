review:
  top_copy:
    items:
    - order: 1
      text:
        zh: 本周先驱有不少新科技，牺牲类套牌每周都有新花样。最开始是铁砧套牌中加入了标准的神器牺牲组件，然后是猫炉红黑牺牲套牌混绿加入[[card:Biotech Specialist|生质科技专家]]，本周开始出现黑绿牺牲混红带[[card:Biotech Specialist|生质科技专家]]的版本拿下一个亚军：deck:72783f790d2a68dcff03。两者虽然都归类为勇德牺牲，但构筑还是有一些差别。而铁砧版本的神器牺牲几乎已经迅速被环境淘汰。
        en: 'Pioneer saw plenty of new technology this week, with Sacrifice decks finding new twists every week. First, Anvil decks added the artifact sacrifice package from Standard. Then Rakdos Sacrifice decks built around [[card:Cauldron Familiar|Cauldron Familiar]] and [[card:Witch''s Oven|Witch''s Oven]] splashed green for [[card:Biotech Specialist|Biotech Specialist]]. This week, a Golgari Sacrifice build splashing red for [[card:Biotech Specialist|Biotech Specialist]] finished second: deck:72783f790d2a68dcff03. Although both builds are classified as Jund Sacrifice, their construction differs somewhat. Meanwhile, Anvil-based artifact sacrifice decks have already all but disappeared from the metagame.'
    - order: 2
      text:
        zh: 加入[[card:Hexhaven Invigorator|赫克海文茁茂兽]]的大绿献力本周席卷一场：deck:bcf6e21ae6eb7db34a4d。不光自己可以提供4点献力，还可以配合满编的[[card:Tail Swipe|甩尾扫击]]互斗找地Ramp，迅速出[[card:Craterhoof Behemoth|陨蹄贝西摩斯]]终结比赛。另外还有传统的[[card:Leyline of the Guildpact|十会盟地脉]]版本大绿献力取得四强：deck:48cb9b5b7dbea4a2216b
        en: 'Mono-Green Devotion featuring [[card:Hexhaven Invigorator|Hexhaven Invigorator]] swept an event this week: deck:bcf6e21ae6eb7db34a4d. The Invigorator not only provides four devotion itself, but also works with a full playset of [[card:Tail Swipe|Tail Swipe]] to fight creatures and find lands, ramping quickly into [[card:Craterhoof Behemoth|Craterhoof Behemoth]] to end the game. A traditional [[card:Leyline of the Guildpact|Leyline of the Guildpact]] build of Mono-Green Devotion also reached the semifinals: deck:48cb9b5b7dbea4a2216b'
    - order: 3
      text:
        zh: '[[card:The Theorist, Jace Beleren|塑理师杰斯贝连]]进入环境后，红蓝创新开始有上升趋势，本周席卷一场，八强占比也超过10%：deck:66772f50230d29dcc0ce。杰斯造人抓牌控场的效果相当契合套牌思路。'
        en: 'Izzet Creativity has been on the rise since [[card:The Theorist, Jace Beleren|The Theorist, Jace Beleren]] entered the format. It swept an event this week and exceeded a 10% Top 8 share: deck:66772f50230d29dcc0ce. Jace''s ability to make tokens, draw cards, and control the board fits the deck''s game plan very well.'
    non_card_phrases:
    - 终结比赛
    reviewed: true
