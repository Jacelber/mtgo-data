    items:
    - order: 1
      text:
        zh: 本周先驱有一场普通RCQ，两个资格分别由苏勒台变境：deck:64253f4ecd28019620e1和红白炸地：deck:c5f5366ae4cb1b473bb9拿到。两者都不是传统顶端套牌。四强还有一个已经淡出环境很久，但得到一些补强的红黑牺牲：deck:0c7862ef88ba681ae2a9
        en: 'This week''s Pioneer schedule included one regular RCQ. The two qualification slots went to Sultai Scapeshift: deck:64253f4ecd28019620e1 and Boros Land Destruction: deck:c5f5366ae4cb1b473bb9. Neither is traditionally one of the format''s top decks. The Top 4 also included Rakdos Sacrifice: deck:0c7862ef88ba681ae2a9, an archetype that had largely disappeared from the metagame but has received several upgrades.'
