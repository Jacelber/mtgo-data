review:
  top_copy:
    reviewed: true
    items:
    - order: 1
      text:
        zh: 本周黑绿恶魔占比飙升，高分占比超过20%，八强占比超过30%，大幅领先其他套牌。而上周在RCQ上表现不错的红白炸地和红黑牺牲，表现也都不错。基本都沿袭了上周出过成绩的构筑。
        en: Golgari Demons surged this week, exceeding 20% of the high-score field and 30% of Top 8 finishes, far ahead of every other deck. Boros Land Destruction and Rakdos Sacrifice, both of which performed well at last week's RCQ, also posted strong results. All three largely retained the builds that had succeeded the previous week.
    - order: 2
      text:
        zh: 日本牌手triosk结合[[card:Boomerang Basics|飞去来入门]]、[[card:Stormchaser's Talent|逐风客才能]]以及[[card:Academic Dispute|学术争执]]的温习课程体系，重新构筑了红蓝大锅套牌，本周拿下一个八强：deck:e095b3d604ce6f4f8e60
        en: 'Japanese player triosk rebuilt Izzet Cauldron with [[card:Boomerang Basics|Boomerang Basics]], [[card:Stormchaser''s Talent|Stormchaser''s Talent]], and a Learn/Lesson package enabled by [[card:Academic Dispute|Academic Dispute]], earning a Top 8 finish this week: deck:e095b3d604ce6f4f8e60'
  features:
    reviewed: true
    explicit_empty: false
    items:
    - source_order: 5
      category: new_technology
      destination_id: deck:e095b3d604ce6f4f8e60
      parent_id: izzet-cauldron
      subtype_id: null
      positioning:
        zh: 融入飞去来入门、逐风客才能以及学术争执的温习课程体系。
        en: An Izzet Cauldron build incorporating Boomerang Basics, Stormchaser's Talent, and a Learn/Lesson package enabled by Academic Dispute.
      featured_cards:
      - Agatha's Soul Cauldron
      - Boomerang Basics
      - Stormchaser's Talent
      - Academic Dispute
      supporting_facts: []
