review:
  top_copy:
    items:
    - order: 1
      text:
        zh: 先驱继续人气低迷，不过周末的一场比赛在降格到C16之后本周相比上周的2场能多开了一场，虽然只有惨淡的25人。
        en: Pioneer attendance remains low. Still, after the weekend event was downgraded to a Challenge 16, this week had three events rather than last week's two, although that event drew a meager 25 players.
    - order: 2
      text:
        zh: 环境方面，同样得到[[card:Pompous Battlemage|浮夸战巫师]]补强的灵技重新回到环境榜首：deck:b92f37441ed47646f915。
        en: 'In the metagame, Prowess has also gained [[card:Pompous Battlemage|Pompous Battlemage]] and returned to the top of the standings: deck:b92f37441ed47646f915.'
    - order: 3
      text:
        zh: 而在标准呼风唤雨的勇得神器牺牲本周也正式进入先驱环境。先驱之前本来就有以神器牺牲为主的铁砧套牌，加入了最近标准的新组件之后如虎添翼：deck:feb656292c6012d47255
        en: 'Jund Artifact Sacrifice, which has been making waves in Standard, also made its way into Pioneer this week. Pioneer already had Anvil decks built around sacrificing artifacts; adding the recent Standard components has given them a significant boost: deck:feb656292c6012d47255'
    - order: 4
      text:
        zh: 最近一直表现不错的红蓝大锅套牌，也有一套满编[[card:Seasoned Cryomancer|干练凛寒术士]]的版本取得八强：deck:157c69f80c0f0c34dfd6
        en: 'Izzet Cauldron has been performing well lately, and a version running a full playset of [[card:Seasoned Cryomancer|Seasoned Cryomancer]] also made the Top 8: deck:157c69f80c0f0c34dfd6'
    reviewed: true
