review:
  top_copy:
    items:
    - order: 1
      text:
        zh: 本周先驱四场比赛，铁木尔课程拿下两个冠军、五个八强。近一个月的高分环境中几乎不存在这套牌，但本周在毫无新牌的情况下直接崛起。小样本下的先驱环境确实非常诡异。
        en: Temur Lessons won two of this week’s four Pioneer events and recorded five Top 8 finishes. It had been almost absent from the high-scoring decks over the previous month, then suddenly broke out without adding a single new card. With samples this small, Pioneer can be a strange format to follow.
    - order: 2
      text:
        zh: 黑绿恶魔仍以17.0%的高分占比排在第一，但本周没有席卷。TRK新牌的集中应用在[[card:Scapeshift|变境]]大类，本周一个冠军和一个四强都带了[[card:Warp Speed|曲速航行]]与[[card:Genesis Device|创世装置]]。
        en: Golgari Demons remained the most popular archetype among high-scoring decks at 17.0%, although it failed to win an event this week. Most of the new TRK cards saw play in Scapeshift decks. Both a winning list and a semifinal list featured [[card:Warp Speed|Warp Speed]] and [[card:Genesis Device|Genesis Device]].
    - order: 3
      text:
        zh: kanister的席卷版本（牌表deck:a49369b82dc09ee7d3d2）满编[[card:Warp Speed|曲速航行]]和[[card:Spelunking|探查洞穴]]，非生物护身符效果有8张，不用再用[[card:The Wandering Minstrel|异国的诗人]]了。两张[[card:Genesis Device|创世装置]]也可以兼顾前期加速和后期[[card:Scapeshift|变境]]。各带一张的地牌，[[card:Q Continuum|Q连续体]]基本是单纯提供刺探的绿色地，[[card:Quark's Bar|夸克酒吧]]可以无限进场击杀对手，[[card:Temporal Anomaly|时间异象]]是额外回收坟场的手段，都非常适合套牌。
        en: Kanister’s winning build (decklistdeck:a49369b82dc09ee7d3d2) ran full playsets of [[card:Warp Speed|Warp Speed]] and Spelunking, giving it eight noncreature Amulet effects and allowing it to dispense with [[card:The Wandering Minstrel|The Wandering Minstrel]]. Two copies of [[card:Genesis Device|Genesis Device]] serve as early ramp while also supporting the Scapeshift plan later on. The list also included three particularly well-suited utility lands as singletons. The [[card:Q Continuum|Q Continuum]] mainly serves as a green surveil land, [[card:Quark's Bar|Quark's Bar]] enables an infinite loop of land entries to finish the opponent, and [[card:Temporal Anomaly|Temporal Anomaly]] provides another way to recover cards from the graveyard.
    reviewed: true
  features:
    explicit_empty: false
    items:
    - destination_id: deck:a49369b82dc09ee7d3d2
      category: new_technology
      source_order: 1
      featured_cards:
      - Warp Speed
      - Genesis Device
      - Quark's Bar
      - Temporal Anomaly
      positioning:
        zh: kanister的席卷版本（牌表）满编曲速航行和探查洞穴，非生物护身符效果有8张，不用再用异国的诗人了。两张创世装置也可以兼顾前期加速和后期变境。各带一张的地牌，Q连续体基本是单纯提供刺探的绿色地，夸克酒吧可以无限进场击杀对手，时间异象是额外回收坟场的手段，都非常适合套牌。
        en: Kanister’s winning build (decklist) ran full playsets of Warp Speed and Spelunking, giving it eight noncreature Amulet effects and allowing it to dispense with The Wandering Minstrel. Two copies of Genesis Device serve as early ramp while also supporting the Scapeshift plan later on. The list also included three particularly well-suited utility lands as singletons. The Q Continuum mainly serves as a green surveil land, Quark's Bar enables an infinite loop of land entries to finish the opponent, and Temporal Anomaly provides another way to recover cards from the graveyard.
