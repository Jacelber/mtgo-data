review:
  top_copy:
    items:
    - order: 1
      text:
        zh: 勇得神器牺牲的组件开始融入传统猫炉牺牲体系，替代了[[card:Mayhem Devil|破坏魔鬼]]。[[card:Biotech Specialist|生质科技专家]]和[[card:The Sackville-Bagginses|萨克维尔巴金斯家族]]的强度确实足够高。deck:95ac01edb226abbbc3b6
        en: Cards from Jund Artifact Sacrifice are finding their way into the traditional Cat-Oven sacrifice shell, replacing [[card:Mayhem Devil|Mayhem Devil]]. [[card:Biotech Specialist|Biotech Specialist]] and [[card:The Sackville-Bagginses|The Sackville-Bagginses]] certainly have the power to make the cut. deck:95ac01edb226abbbc3b6
    - order: 2
      text:
        zh: 黑绿恶魔也在尝试新组件，毕竟之前流行的2费曲线[[card:Badgermole Cub|獾地鼠幼兽]]单纯是强度高，和套牌其他部分配合并不紧密。本周一个满编[[card:Carnivorous Cultivator|食肉草培育师]]并带了两张[[card:Sanctum Lurker|圣所潜妖]]的版本席卷一场：deck:369554e47d28755d2426；并有一个满编[[card:Tarmogoyf|塔莫耶夫]]的版本拿下一个八强：deck:fa8c3e7c4011582519ee
        en: 'Golgari Demons is also trying new tools. After all, the previously popular two-drop [[card:Badgermole Cub|Badgermole Cub]] was there largely on raw power, without particularly close synergy with the rest of the deck. A build with a full playset of [[card:Carnivorous Cultivator|Carnivorous Cultivator]] and two copies of [[card:Sanctum Lurker|Sanctum Lurker]] won an event this week: deck:369554e47d28755d2426; another build with a full playset of [[card:Tarmogoyf|Tarmogoyf]] reached the Top 8: deck:fa8c3e7c4011582519ee'
    - order: 3
      text:
        zh: 还有不使用[[card:Pompous Battlemage|浮夸战巫师]]，但加入了3张[[card:Stingcaster Mage|棘咒法师]]的红蓝灵技拿下八强：deck:9e928adf39d5549aa4cd
        en: 'An Izzet Prowess build without [[card:Pompous Battlemage|Pompous Battlemage]], but with three copies of [[card:Stingcaster Mage|Stingcaster Mage]], also reached the Top 8: deck:9e928adf39d5549aa4cd'
    - order: 4
      text:
        zh: 新套牌方面，没用新牌的红白版本弃牌拿下多个八强：deck:24679085de3951a79cf4。基本是标准组件，但是有[[card:Guardian of New Benalia|新宾纳里亚守护者]]就可以不沾黑了，还有[[card:Fiery Temper|火爆]]作为弃牌收益。
        en: 'Among the new decks, Boros Discard made multiple Top 8s without using any new cards: deck:24679085de3951a79cf4. The core is largely the Standard shell, but [[card:Guardian of New Benalia|Guardian of New Benalia]] removes the need to splash black, while [[card:Fiery Temper|Fiery Temper]] provides another discard payoff.'
    - order: 5
      text:
        zh: claudioh构筑的纯黑凤凰拿下一个八强，除核心[[card:Darklight Phoenix|暗光凤凰]]之外，还满编了[[card:Dark Matter Manipulator|暗物质操弄师]]，带了3张[[card:Winter, Tormented Loner|落难孤影温特]]：deck:42d92dd759bd3bef90e0。
        en: 'A Mono-Black Phoenix deck built by claudioh reached the Top 8. Alongside its core [[card:Darklight Phoenix|Darklight Phoenix]], it runs a full playset of [[card:Dark Matter Manipulator|Dark Matter Manipulator]] and three copies of [[card:Winter, Tormented Loner|Winter, Tormented Loner]]: deck:42d92dd759bd3bef90e0.'
