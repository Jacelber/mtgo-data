    dimensions:
      copy.zh:
      - order: 1
        text: 纯铁相比FRA，基本还是在继续消化Zeta带来的冲击。[[card:Baleful Strix|恶邪枭]]套牌蓝黑仙灵和[[card:Dispatch|迅速了结]]（+[[card:Baleful Strix|恶邪枭]]）套牌艾斯波共鸣表现都不错。
      - order: 2
        text: FRA新牌出现在挑战赛八强中的只有[[card:Twinned Vision|双生视像]]，一套带了3张的贪吃灵版本纯蓝惧兽本周打进四强：deck:432084907928815e503c。[[card:Twinned Vision|双生视像]]也是一个纯蓝可以弃掉贪吃灵并直接拉回场的组件，也是自磨进坟之后可以施放的咒语，和套牌配合不错。
      - order: 3
        text: 另外Beicodegeia操控备牌混红带[[card:Vandalblast|蛮野冲击]]的蓝黑控制（同样满编[[card:Baleful Strix|恶邪枭]]）取得了大量八强成绩，其他牌手使用成绩也不错：deck:96d08dcd6ca15fe45a95
      copy.en:
      - order: 1
        text: Pauper is still largely digesting the impact of Zeta rather than FRA. Both Dimir Faeries with [[card:Baleful Strix|Baleful Strix]] and Esper Affinity with [[card:Dispatch|Dispatch]] (plus [[card:Baleful Strix|Baleful Strix]]) are performing well.
      - order: 2
        text: 'The only new FRA card to appear in Challenge Top 8 decklists was [[card:Twinned Vision|Twinned Vision]]. A [[card:Sneaky Snacker|Sneaky Snacker]] version of Mono-Blue Terror running three copies made the Top 4 this week: deck:432084907928815e503c. [[card:Twinned Vision|Twinned Vision]] gives mono-blue another way to discard [[card:Sneaky Snacker|Sneaky Snacker]] and bring it straight back to the battlefield. It can also be cast after being milled into the graveyard, making it a good fit for the deck.'
      - order: 3
        text: 'Beicodegeia also posted numerous Top 8 finishes with Dimir Control splashing red for [[card:Vandalblast|Vandalblast]] in the sideboard and running a full playset of [[card:Baleful Strix|Baleful Strix]]. Other players have had good results with the deck as well: deck:96d08dcd6ca15fe45a95'
