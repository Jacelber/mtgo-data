review:
  top_copy:
    reviewed: true
    items:
    - order: 1
      text:
        zh: '本周纯红疯魔依旧占比排名榜首，但数据没有前几周那么领先，也有很多新构筑加入环境。


          首先是四色版本的共鸣，[[card:Giant''s Boulder|巨人抛石]]是神器而且可以调整牌库顶和调色，和这种多色偏控制的神器中速也很契合。本周同一牌手操控四色版本的共鸣席卷了两场比赛：deck:9138068c968f01620f2b。


          另外驮兽铺场套牌本周也非常出彩。思路以纯白为主，之前出现过红白、黑白、玛尔都色组的版本。而本周以混绿带[[card:Winding Way|蜿蜒长路]]的形态席卷一场：deck:703dec5e054f8ab93980，占比也来到了5%以上。


          还有一套纳雅色组的野火套牌本周拿下一个四强：deck:5c7aae4bc5f4b7595bcc。基本是勇德一套放弃了黑色[[card:Refurbished Familiar|复新佣兽]]和其他神器的配合，转进白色使用白色去除，并带[[card:Pursue the Past|追逐过往]]配合[[card:Sneaky Snacker|贪吃灵]]。'
        en: 'Mono-Red Madness still held the largest metagame share this week, although its lead was smaller than in recent weeks. Several new builds also entered the field.


          First came Four-Color Affinity. [[card:Giant''s Boulder|Giant’s Boulder]] is both an artifact and a way to smooth the top of the library while fixing mana, making it a natural fit for this slower, multicolor artifact-midrange strategy. The same player piloted the four-color build to wins in two events this week: deck:9138068c968f01620f2b.


          Packbeast Swarm was another standout. The strategy is primarily white and has previously appeared in Boros, Orzhov, and Mardu color combinations. This week, a version splashing green for [[card:Winding Way|Winding Way]] won an event—deck:703dec5e054f8ab93980—and raised the archetype’s metagame share above 5%.


          A Naya Wildfire deck also reached the Top 4 this week: deck:5c7aae4bc5f4b7595bcc. It starts from the Jund shell but cuts black, [[card:Refurbished Familiar|Refurbished Familiar]], and the other artifact synergies. In their place, it adds white removal and uses [[card:Pursue the Past|Pursue the Past]] together with [[card:Sneaky Snacker|Sneaky Snacker]].'
  features:
    reviewed: true
    explicit_empty: false
    items:
    - source_order: 41
      category: new_deck
      destination_id: deck:9138068c968f01620f2b
