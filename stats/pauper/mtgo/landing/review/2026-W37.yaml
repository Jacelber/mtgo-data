      subtype_id: null
      positioning:
        zh: 本周由同一牌手操控席卷两场的四色共鸣。基本是格利极共鸣混白满编烁目鹰，同时使用巨人抛石调色。
        en: The same player piloted Four-Color Affinity to wins in two events this week. The deck is essentially Grixis Affinity splashing white for a full playset of Glint Hawk, with Giant’s Boulder helping to fix its mana.
      featured_cards:
      - Glint Hawk
      - Giant's Boulder
      - Thoughtcast
      - Refurbished Familiar
      supporting_facts:
      - type: new_archetype
