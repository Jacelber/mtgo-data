review:
  top_copy:
    reviewed: true
    items:
    - order: 1
      text:
        zh: 纯铁本周6场比赛均稳定击发，人气还是比较稳定。整体环境方面，纯蓝惧兽和纯红疯魔继续在顶端展开二人转，在近期对其他套牌的优势已经相当明显。
        en: All six Pauper events fired reliably this week, with participation remaining fairly steady. Mono-Blue Terror and Mono-Red Madness continue to trade places at the top of the metagame, and their recent edge over the rest of the field is becoming increasingly clear.
    - order: 2
      text:
        zh: HOB劫掠食人妖森林继续表现出色，纯蓝惧兽主牌带3拿下四强，配合洗清思想等自磨很合理：deck:e000dc7bf390c671070f；塔脉炉主牌满编替代虚色抓牌，也能配合恶意隆响，拿下八强：deck:1cc188d3e85960603299。
        en: 'Plunder the Trollshaws from HOB continues to impress. A Mono-Blue Terror list reached the Top 4 with three copies in the main deck, where it works naturally with self-mill cards such as Thought Scour: deck:e000dc7bf390c671070f; a Monster Tron list replaced its colorless draw package with the full four copies, which also pair well with Malevolent Rumble, and finished in the Top 8: deck:1cc188d3e85960603299.'
  features:
    reviewed: true
    explicit_empty: false
    items:
    - source_order: 6
      category: new_technology
      destination_id: deck:e000dc7bf390c671070f
      parent_id: mono-blue-terror
      subtype_id: null
      positioning:
        zh: 带了3张劫掠食人妖森林，配合洗清思想非常好。
        en: This build runs three copies of Plunder the Trollshaws and supports them with Thought Scour and the deck's broader self-mill package.
      featured_cards:
      - Plunder the Trollshaws
      - Thought Scour
      - Delver of Secrets
      - Tolarian Terror
      supporting_facts: *id001
    - source_order: 8
      category: new_technology
      destination_id: deck:1cc188d3e85960603299
      parent_id: green-tron
      subtype_id: null
      positioning:
        zh: 满编劫掠食人妖森林替代深邃真相，从坟场施放的效果配合恶意隆响更好。
        en: This build replaces Unfathomable Truths with a full set of Plunder the Trollshaws, gaining a graveyard-cast payoff that also works well with Malevolent Rumble.
      featured_cards:
      - Plunder the Trollshaws
      - Giant's Boulder
      - Urza's Tower
      - Writhing Chrysalis
      supporting_facts: *id002
