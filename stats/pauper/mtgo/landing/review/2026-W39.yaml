review:
  top_copy:
    reviewed: true
    items:
    - order: 1
      text:
        zh: 9月23日更新后，9月24日的赛事开始看到之前周报中提到的Zeta系列带来的10张牌。[[card:Dispatch|迅速了结]]和[[card:Baleful Strix|恶邪枭]]也直接成为环境标杆。这还只是首批四天的探索成果，估计之后环境会快速变动。
        en: After the September 23 MTGO update, the September 24 events began to show the ten cards brought in by the Zeta set that we mentioned in a previous weekly report. [[card:Dispatch|Dispatch]] and [[card:Baleful Strix|Baleful Strix]] have already become metagame staples. These are only the first four days of brewing, and the format may change quickly from here.
    - order: 2
      text:
        zh: 首先是共鸣套牌基本开始转向艾斯波，并不一定带[[card:Baleful Strix|恶邪枭]]，但[[card:Dispatch|迅速了结]]几乎都满编。组法还没有最终确定，非常多样。带[[card:Glint Hawk|烁目鹰]]和[[card:Kor Skyfisher|寇族空渔人]]的版本最先拿下四强：deck:a318243a93b5952a38bf。还有带满[[card:Frogmite|小蛙兽]]等共鸣单卡，进入铺场快攻思路的版本也能席卷一场：deck:64c44243a7c0bd5daff9。一直专精格利极共鸣的LuffyDoChapeuDePalha，也开始在套牌中携带[[card:Dispatch|迅速了结]]，用四色版本拿下一个八强：deck:c90f9ba63db39c388986。还有一套以玛尔都融合仪为基底，带满[[card:Dispatch|迅速了结]]，并用[[card:Giant's Boulder|巨人抛石]]调色，混入蓝色加入[[card:Thoughtcast|格物致知]]和[[card:Cryogen Relic|冰封遗宝]]的版本拿下一个亚军：deck:814cbb0f8678966bf875。
        en: 'Affinity has begun to shift toward Esper. Lists do not necessarily play [[card:Baleful Strix|Baleful Strix]], but nearly all run a full playset of [[card:Dispatch|Dispatch]]. The build is far from settled and remains highly varied. A [[card:Glint Hawk|Glint Hawk]] and [[card:Kor Skyfisher|Kor Skyfisher]] build was the first to reach the Top 4: deck:a318243a93b5952a38bf. A go-wide, Packbeast-style aggro build full of affinity cards such as [[card:Frogmite|Frogmite]] also won an event: deck:64c44243a7c0bd5daff9. Longtime Grixis Affinity specialist LuffyDoChapeuDePalha has also adopted [[card:Dispatch|Dispatch]], taking a four-color build to the Top 8: deck:c90f9ba63db39c388986. Another four-color build, based on Mardu Synthesizer, maxed out on [[card:Dispatch|Dispatch]] and used [[card:Giant''s Boulder|Giant''s Boulder]] to support a blue splash for [[card:Thoughtcast|Thoughtcast]] and [[card:Cryogen Relic|Cryogen Relic]], finishing runner-up: deck:814cbb0f8678966bf875.'
    - order: 3
      text:
        zh: 而[[card:Baleful Strix|恶邪枭]]在各种中速思路中也有很多出场。老套牌中，满编[[card:Baleful Strix|恶邪枭]]的蓝黑仙灵拿下亚军：deck:f7928089165f7285705a。另外一套新的偏控制的四色[[card:Pestilence|瘟疫]]门有一个八强：deck:59a7bed8bf40cd493f17。
        en: '[[card:Baleful Strix|Baleful Strix]] also appeared in a range of midrange strategies. Among established decks, a Dimir Faeries list with a full playset of Strix finished runner-up: deck:f7928089165f7285705a. A new, more controlling four-color Gates build centered on [[card:Pestilence|Pestilence]] also reached the Top 8: deck:59a7bed8bf40cd493f17.'
